const SUBD = ['₀', '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];
const sub = n => String(n).split('').map(d => SUBD[+d]).join('');
function packRows(items) {
  const rows = [];
  items.forEach(x => {
    let r = rows.find(row => row.every(y => !(x.s < y.f && y.s < x.f)));
    if (!r) { r = []; rows.push(r); }
    r.push(x);
  });
  return rows;
}
const TONE = {
  chosen: { background: 'var(--accent)', color: 'var(--accent-ink)', border: '1px solid var(--accent)' },
  mark: { background: 'var(--mark-soft)', color: 'var(--ink)', border: '1.5px solid var(--mark)' },
  bad: { background: 'var(--pit-soft)', color: 'var(--ink)', border: '1.5px solid var(--pit)' },
  dim: { background: 'transparent', color: 'var(--muted)', border: '1px dashed var(--line-strong)', textDecoration: 'line-through' },
  def: { background: 'var(--surface)', color: 'var(--ink)', border: '1px solid var(--line-strong)' },
};
function Lanes({ lanes, max, marker, labelW = 'w-10' }) {
  return (
    <div dir="ltr" className="grid gap-1.5">

              {marker != null && <div className="absolute top-0 bottom-0" style={{ left: (marker / max * 100) + '%', borderLeft: '2px dashed var(--mark)' }} />}

                    <div key={x.key || x.name} className="absolute top-0 bottom-0 rounded flex items-center justify-center font-mono text-[0.66rem] overflow-hidden whitespace-nowrap"
                      style={{ left: (x.s / max * 100) + '%', width: ((x.f - x.s) / max * 100) + '%', ...(TONE[x.tone] || TONE.def) }} title={`${x.name}: (${x.s},${x.f})`}>
                      {x.name}
                    </div>
                  ))}
                </div>
              ))}
              {!rows.length && <div className="h-6 my-0.5" />}

  );

/* ---------- Lecture 3: run of the earliest-finish rule ---------- */
function EftRun() {
  const [hist, setHist] = useState([]);
  const st = useMemo(() => {
    let S = L3.map(x => x.id); const log = []; const gone = {};
    hist.forEach((id, k) => {
      const p = byId(id);
      const rem = S.filter(j => j === id || overlaps(byId(j), p));
      rem.forEach(j => { if (j !== id) gone[j] = k + 1; });
      S = S.filter(j => !rem.includes(j));
      log.push({ id, rem, S: [...S] });
    });
    return { S, log, gone };
  }, [hist]);
  const cands = st.S.map(byId);
  const minF = cands.length ? Math.min(...cands.map(x => x.f)) : null;
  const ties = cands.filter(x => x.f === minF);
  const done = !st.S.length;
  const lanes = L3.map(x => {
    const k = hist.indexOf(x.id);
    const tone = k >= 0 ? 'chosen' : st.gone[x.id] ? 'dim' : ties.some(t => t.id === x.id) ? 'mark' : 'def';
    return { label: String(x.id), items: [{ name: `(${x.s},${x.f})` + (k >= 0 ? ` · ${k + 1}` : ''), s: x.s, f: x.f, tone, key: x.id }] };
  });
  return (
    <div className="card p-4 sm:p-5" style={{ background: 'var(--surface-2)' }}>
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <div className="font-semibold">הרצה צעד אחר צעד: מסתיימת ראשונה</div>
          <div className="text-sm c-muted">צהוב: המועמדות שמסתיימות ראשונות ב-<M>S</M>. כחול: נבחרו. מחוק: הוסרו מ-<M>S</M>.</div>
        </div>
        <div className="flex flex-wrap gap-2">
          <button className="btn text-sm" onClick={() => setHist(h => h.slice(0, -1))} disabled={!hist.length}>בטל צעד</button>

        </div>

      <div className="mt-3"><Lanes lanes={lanes} max={8} /></div>
      <div className="mt-3 flex flex-wrap gap-2 items-center">
        {!done && ties.length === 1 && <button className="btn btn-primary text-sm" onClick={() => setHist(h => [...h, ties[0].id])}>צעד {hist.length + 1}: לבחור את פעילות {ties[0].id}</button>}
        {!done && ties.length > 1 && (
          <>
            <span className="text-sm font-semibold c-mark">שוויון: {ties.length} פעילויות מסתיימות ב-{minF}. בחרו אחת:</span>
            {ties.map(t => <button key={t.id} className="btn btn-primary text-sm" onClick={() => setHist(h => [...h, t.id])}>פעילות {t.id}</button>)}

/* ---------- Lecture 3: the efficient scan ---------- */
const SCAN_ORDER = [...L3].sort((a, b) => a.f - b.f || a.id - b.id);
function ScanSim() {
  const [k, setK] = useState(0);
  const rows = []; let f = 0;
  SCAN_ORDER.forEach(x => { const take = f <= x.s; rows.push({ x, fBefore: f, take }); if (take) f = x.f; });
  const shown = rows.slice(0, k);
  const H = shown.filter(r => r.take).map(r => r.x.id);
  const fNow = k ? (shown.filter(r => r.take).slice(-1)[0] || { x: { f: 0 } }).x.f : 0;
  return (

          <tbody>
            {rows.map((r, i) => {
              const vis = i < k;
              return (
                <tr key={r.x.id} style={{ opacity: vis ? 1 : 0.35, background: vis && r.take ? 'var(--accent-soft)' : 'transparent' }}>
                  <td className="py-1.5 px-2 border-b border-line font-mono">{i + 1}</td>

                  <td className="py-1.5 px-2 border-b border-line font-mono">{r.x.f}</td>
                  <td className="py-1.5 px-2 border-b border-line font-mono">{vis ? r.fBefore : '·'}</td>
                  <td className="py-1.5 px-2 border-b border-line">{vis ? (r.take ? <span className="c-tip font-semibold"><bdi dir="ltr" className="font-mono">{r.fBefore} ≤ {r.x.s}</bdi> ⇒ מוסיפים, f ← {r.x.f}</span> : <span className="c-pit"><bdi dir="ltr" className="font-mono">{r.x.s} &lt; {r.fBefore}</bdi> ⇒ דוחים</span>) : ''}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="mt-2 text-[0.95rem]"><M>{`H = ${fmtSet(H)}`}</M>, <M>{`f = ${fNow}`}</M>{k === rows.length && <span className="c-tip font-semibold"> · אותן בחירות כמו האלגוריתם החמדני.</span>}</div>
    </div>
  );
}

/* ---------- Tutorial 2: activity partition ---------- */
const PS_INPUTS = {
  s21: { name: 'הדוגמה משקף 21', ints: [{ n: 'A', s: 0, f: 3 }, { n: 'B', s: 3, f: 9 }, { n: 'C', s: 0, f: 4 }, { n: 'D', s: 4, f: 6 }, { n: 'E', s: 6, f: 8 }] },
  lec: { name: 'הדוגמה מההרצאה', ints: L3.map(x => ({ n: String(x.id), s: x.s, f: x.f })) },
};
const ovl = (a, b) => a.s < b.f && b.s < a.f;
function partStart(ints) {
  const order = [...ints].sort((a, b) => a.s - b.s || a.f - b.f);
  const G = []; const steps = [];
  order.forEach(x => {
    let gi = G.findIndex(g => g.every(y => !ovl(x, y)));
    let opened = false;
    if (gi < 0) { G.push([]); gi = G.length - 1; opened = true; }
    G[gi].push(x);
    steps.push({ x, gi, opened, snap: G.map(g => [...g]) });
  });
  return steps;
}
function partRepeat(ints) {
  let A = [...ints]; const groups = [];
  while (A.length) {
    const S = [...A].sort((a, b) => a.f - b.f || a.s - b.s); const g = []; let last = -Infinity;
    S.forEach(x => { if (x.s >= last) { g.push(x); last = x.f; } });
    groups.push(g); A = A.filter(x => !g.includes(x));
  }
  return groups;
}
function depthOf(ints) {
  const max = Math.max(...ints.map(x => x.f)); let best = 0, at = 0;
  for (let t = 0.5; t < max; t += 1) { const c = ints.filter(x => x.s < t && t < x.f).length; if (c > best) { best = c; at = t; } }
  return [best, at];
}
function PartitionSim() {
  const [inp, setInp] = useState('s21');
  const [alg, setAlg] = useState('repeat');
  const [k, setK] = useState(0);
  const ints = PS_INPUTS[inp].ints;
  const max = Math.max(...ints.map(x => x.f));
  const steps = useMemo(() => partStart(ints), [inp]);
  const rep = useMemo(() => partRepeat(ints), [inp]);
  const [dep, at] = depthOf(ints);
  const reset = () => setK(0);
  let groups, msg = null, cur = null;
  if (alg === 'repeat') groups = rep;
  else {
    groups = k ? steps[k - 1].snap : [];
    if (k) { const s = steps[k - 1]; cur = s.x; msg = s.opened ? `${s.x.n} = (${s.x.s},${s.x.f}) חותכת פעילות בכל קבוצה קיימת ⇒ נפתחת קבוצה חדשה G${sub(s.gi + 1)}.` : `${s.x.n} = (${s.x.s},${s.x.f}) נכנסת ל-G${sub(s.gi + 1)}: הקבוצה הראשונה שבה יש לה מקום.`; }
  }
  const lanes = groups.map((g, gi) => ({ label: 'G' + sub(gi + 1), items: g.map(x => ({ name: `${x.n} (${x.s},${x.f})`, s: x.s, f: x.f, tone: cur === x ? 'mark' : 'chosen', key: x.n })) }));
  const finished = alg === 'repeat' || k === steps.length;
  const nG = alg === 'repeat' ? rep.length : (k === steps.length ? steps[steps.length - 1].snap.length : null);
  return (
    <div className="card p-4 sm:p-5" style={{ background: 'var(--surface-2)' }}>
      <div className="font-semibold">סימולטור: חלוקת פעילויות לקבוצות</div>
      <div className="mt-2 grid gap-2">
        <div className="flex flex-wrap items-center gap-2"><span className="text-sm c-muted w-16">קלט:</span>
          {Object.entries(PS_INPUTS).map(([key, v]) => <button key={key} className="chip" style={inp === key ? { background: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--ink)' } : {}} onClick={() => { setInp(key); reset(); }}>{v.name}</button>)}
        </div>
        <div className="flex flex-wrap items-center gap-2"><span className="text-sm c-muted w-16">אלגוריתם:</span>
          {[['repeat', 'רעיון ראשון: בחירה חוזרת'], ['start', 'רעיון שני: לפי זמן התחלה']].map(([key, t]) => <button key={key} className="chip" style={alg === key ? { background: 'var(--mark-soft)', borderColor: 'var(--mark)', color: 'var(--ink)' } : {}} onClick={() => { setAlg(key); reset(); }}>{t}</button>)}
        </div>
      </div>
      <div className="mt-3 text-sm c-muted">הקלט: {ints.map(x => <bdi key={x.n} dir="ltr" className="font-mono me-2">{x.n}=({x.s},{x.f})</bdi>)}</div>
      {alg === 'start' && (
        <div className="mt-2 flex flex-wrap gap-2 items-center">
          <button className="btn btn-primary text-sm" onClick={() => setK(v => Math.min(steps.length, v + 1))} disabled={k >= steps.length}>לשבץ את הבאה</button>
          <button className="btn text-sm" onClick={() => setK(steps.length)} disabled={k >= steps.length}>הכול</button>
          <button className="btn btn-ghost text-sm" onClick={reset}>התחל מחדש</button>
          <span className="text-sm c-muted">שובצו {k} מתוך {steps.length}</span>
        </div>
      )}
      <div className="mt-3">{lanes.length ? <Lanes lanes={lanes} max={max} /> : <div className="text-sm c-muted">לחצו "לשבץ את הבאה". הסדר הוא לפי זמן התחלה.</div>}</div>
      {msg && <div className="mt-2 text-[0.95rem]">{msg}</div>}
      {alg === 'repeat' && <div className="mt-2 text-[0.95rem]">כל שורה היא הרצה אחת של האלגוריתם לבעיית הפעילויות על מה שנשאר.</div>}
      {finished && (
        <div className={'mt-3 text-[0.95rem] ' + (nG === dep ? 'c-tip' : 'c-pit')}>
          <strong>{nG} קבוצות. </strong>
          <span className="text-ink">בזמן <bdi dir="ltr" className="font-mono">t = {at}</bdi> יש {dep} פעילויות חופפות, ולכן כל חלוקה צריכה לפחות {dep} קבוצות. {nG === dep ? 'כאן האלגוריתם הגיע למינימום.' : 'כאן האלגוריתם לא הגיע למינימום.'}</span>
        </div>
      )}
    </div>
  );
}

        <tbody>
          {[['פעילות i', L3.map(x => x.id)], ['זמן התחלה s', L3.map(x => x.s)], ['זמן סיום f', L3.map(x => x.f)]].map(([h, vals], r) => (
            <tr key={r}><th className="text-start py-1.5 px-2 border-b border-line kicker whitespace-nowrap">{h}</th>{vals.map((v, i) => <td key={i} className={'py-1.5 px-3 border-b border-line font-mono text-center ' + (r === 0 ? 'font-bold' : '')}>{v}</td>)}</tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function Lecture3Tab({ goLab, goTab, onIndex }) {
  return (
    <Stepper scope="lec3" items={LEC3_SECTIONS} onFinish={() => goTab('tutorial')} finishLabel="לתרגול 2" onIndexChange={onIndex}>
      <Section id="recap3" scope="lec3" doneKey="recap3" kicker="הרצאה 3 · עמ׳ 1–2" title="בעיית הפעילויות ותבנית חמדנית">
        <p>באופן אינטואיטיבי, אלגוריתם חמדן מבצע בכל צעד את הפעולה שנראית הטובה ביותר באותו רגע, <strong>ואינו חוזר בו</strong> מבחירותיו. את הבעיה ואת התבנית ראינו בסוף הרצאה 2. הפעם מגיעים גם להוכחה.</p>
        <Def tag="בעיית הפעילויות">
          <p>יש חדר הרצאות ופעילויות שרוצים לקיים בו. לכל פעילות זמן התחלה וזמן סיום, ובכל רגע אפשר לקיים בחדר לכל היותר פעילות אחת. <strong>המטרה:</strong> לשבץ כמה שיותר פעילויות.</p>
          <p><strong>קלט:</strong> <M>n</M> פעילויות; לכל <M>i</M> זמן התחלה <M>s_i</M> וזמן סיום <M>f_i</M>, <M>{"s_i < f_i"}</M>.</p>
          <p><strong>פתרון חוקי:</strong> <M>{"I ⊆ {1, …, n}"}</M> של פעילויות שאינן חופפות: לכל <M>i ≠ j</M> ב-<M>I</M>, <M>f_i ≤ s_j</M> או <M>f_j ≤ s_i</M>.</p>
          <p><strong>יש למצוא:</strong> פתרון חוקי <M>I</M> עם מספר גדול ככל האפשר של פעילויות.</p>
        </Def>
        <p>הדוגמה מההרצאה. הפעילויות אינן כוללות את קצות קטעי הזמן:</p>
        <ActivityTable />
        <ul className="prose-he" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li><M>{"{2, 6, 7}"}</M> ו-<M>{"{7, 3, 4}"}</M> הם פתרונות חוקיים עם שלוש פעילויות.</li>
          <li>אילו בחרנו <M>{"{1, 4}"}</M>, לא היינו יכולים להוסיף עוד פעילות, אבל גם לא היינו משיגים את המטרה.</li>
        </ul>
        <Callout type="behind" title="'אי אפשר להוסיף' לא אומר 'אופטימלי'">
          <p><M>{"{1, 4}"}</M> הוא פתרון <strong>מקסימלי לפי הכלה</strong>: אי אפשר להוסיף לו אף פעילות. אבל הוא לא <strong>בגודל מקסימלי</strong>. כל אלגוריתם חמדן מהתבנית מחזיר פתרון שאי אפשר להרחיב. כל השאלה היא אם הוא גם הגדול ביותר, ועל זה ההוכחה.</p>
        </Callout>
        <IntuitionCheck
          q="פעילות 3 היא (3,4) ופעילות 4 היא (4,7). אפשר לקיים את שתיהן?"
          options={[
            { t: 'כן: f₃ = 4 ≤ 4 = s₄, והפעילויות לא כוללות את הקצוות.', correct: true, why: 'זו בדיוק ההגדרה: $f_i ≤ s_j$. הן "נוגעות" ברגע 4 אבל לא חופפות. בתרגול אותו תנאי מנוסח כ"אינן מתנגשות".' },
            { t: 'לא: שתיהן משתמשות ברגע 4.', correct: false, why: 'ההנחה בהרצאה היא שהפעילויות אינן כוללות את קצות הקטעים, ולכן רגע 4 לא "שייך" לאף אחת מהן.' },
          ]}
        />
        <Def tag="תבנית לאלגוריתם חמדן">
          <p><strong>אתחול:</strong> <M>G ← ∅</M> (הפתרון החלקי), <M>{"S ← {1, …, n}"}</M> (הקטעים שזרים לכל הקטעים ב-<M>G</M>).</p>
          <p><strong>צעד:</strong> כל עוד <M>S ≠ ∅</M>: (1) בוחרים <M>i ∈ S</M> לפי כלל בחירה ומעדכנים <M>{"G ← G ∪ {i}"}</M>. (2) מסירים מ-<M>S</M> את כל הקטעים שחותכים את <M>i</M>, כולל <M>i</M> עצמו.</p>
          <p><strong>הבחנה:</strong> האלגוריתם מחזיר פתרון חוקי לכל כלל בחירה. (האלגוריתם הנאיבי, לעומת זאת, עובר על כל <M>2^n</M> תתי־הקבוצות.)</p>
        </Def>
        <Callout type="tip">
          <p>התבנית מפרידה בין שתי שאלות: <strong>חוקיות</strong> (מובטחת לכל כלל, בזכות שלב ההסרה) ו<strong>אופטימליות</strong> (תלויה בכלל). בכל הוכחה של חמדן כתבו אותן כשתי טענות נפרדות.</p>

      </Section>

      <Section id="rules3" scope="lec3" doneKey="rules3" kicker="הרצאה 3 · עמ׳ 2" title="ארבעה כללי בחירה, שלוש דוגמאות נגדיות">
        <ol className="prose-he grid gap-1" style={{ listStyle: 'decimal', paddingInlineStart: '1.4rem' }}>
          <li><strong>קטע שחותך מעט ככל האפשר קטעים.</strong> אינטואיציה: הוא פוסל מעט ככל האפשר.</li>
          <li><strong>קטע קצר ביותר.</strong> אינטואיציה: תופס מעט זמן, ולכן אולי פוסל מעט.</li>
          <li><strong>הקטע שמתחיל ראשון.</strong> אינטואיציה: מנצלים היטב את הזמן מההתחלה.</li>
          <li><strong>הקטע שמסתיים ראשון.</strong> אינטואיציה: מפנים את החדר מוקדם ככל האפשר.</li>
        </ol>
        <p>רק הכלל הרביעי מבטיח פתרון אופטימלי. הדוגמאות הנגדיות לשלושת האחרים מופיעות בציורים בעמ׳ 2 של ההרצאה ובשקפים 8–10 של התרגול. נסו כל כלל על כל קלט:</p>
        <GreedySim sets={GR_SETS2} initial="few" />
        <Callout type="behind" title="איך בונים דוגמה נגדית">
          <p>מחפשים איפה ה"אינטואיציה" של הכלל מטעה. <strong>קצרה ביותר:</strong> קטע קצר שיושב על הגבול בין שני קטעים ארוכים פוסל את שניהם. <strong>מתחילה ראשונה:</strong> קטע ארוך שמתחיל מוקדם מכסה הכול. <strong>הכי מעט התנגשויות:</strong> קטע אמצעי עם מעט התנגשויות, בין שתי "ערימות" של קטעים חופפים, שובר את השרשרת האופטימלית.</p>
        </Callout>
        <Callout type="pit" title="'נשמע הגיוני' זה לא הוכחה">
          <p>לכל אחד מארבעת הכללים יש אינטואיציה משכנעת, ושלושה מהם שגויים. מכאן הדרישה של ההרצאה: הטענה ש"בכל שלב עושים את הדבר הטוב ביותר" אינה הוכחה.</p>
        </Callout>
        <IntuitionCheck
          q="בקלט מהשקף נגד 'הקצרה ביותר': (1,5), (6,10), (4,7). למה הכלל נכשל?"
          options={[
            { t: 'הקטע הקצר (4,7) חותך את שני הארוכים, ולכן בחירתו פוסלת את שניהם.', correct: true, why: 'החמדן מקבל פעילות אחת, והאופטימום הוא 2: (1,5) ו-(6,10). קצר זה לא אותו דבר כמו "פוסל מעט".' },
            { t: 'יש שני קטעים באותו אורך, והכלל לא מוגדר.', correct: false, why: 'שני הארוכים באורך 4, אבל הקצר ביותר הוא (4,7) באורך 3, והבחירה בו מוגדרת היטב.' },
          ]}
        />
      </Section>

      <Section id="eft3" scope="lec3" doneKey="eft3" kicker="הרצאה 3 · עמ׳ 3" title="בוחרים את הפעילות שמסתיימת ראשונה">
        <Def tag="האלגוריתם החמדני">
          <p><strong>אתחול:</strong> <M>G ← ∅</M>, <M>{"S ← {1, …, n}"}</M>.</p>
          <p><strong>צעד:</strong> כל עוד <M>S ≠ ∅</M>: (1) בוחרים <M>i ∈ S</M> שמסתיימת ראשונה. (2) <M>{"G ← G ∪ {i}"}</M>. (3) מסירים מ-<M>S</M> את כל הפעילויות שחותכות את <M>i</M>, כולל <M>i</M> עצמה.</p>
        </Def>
        <EftRun />
        <IntuitionCheck
          q="בצעד השלישי, 2, 4 ו-5 מסתיימות כולן ב-7. האם הבחירה ביניהן משנה?"
          options={[
            { t: 'לא: שלושתן חותכות זו את זו, וכל בחירה מרוקנת את S.', correct: true, why: 'ההרצאה בוחרת "באופן שרירותי, למשל 2". לכן ההוכחה חייבת לעבוד לכל בחירה בשוויון, ואסור לה להניח שבחרנו דווקא אחת מסוימת.' },
            { t: 'כן: צריך לבחור את זו שמתחילה מאוחר יותר.', correct: false, why: 'כאן זה לא משנה את הגודל. נסו בהרצה למעלה: כל אחת משלוש הבחירות נותנת 3 פעילויות.' },
          ]}
        />
      </Section>

      <Section id="idea3" scope="lec3" doneKey="idea3" kicker="הרצאה 3 · עמ׳ 3" title="רעיון ההוכחה: הבחירות לא סוגרות דלתות">
        <p>נרצה להראות שבכל שלב קיים פתרון אופטימלי שמכיל את הפעילויות שכבר בחרנו. במילים אחרות, הבחירות שלנו לא מונעות מאיתנו להגיע לפתרון אופטימלי.</p>
        <Def tag="הטענה הנשמרת">
          <p>בכל שלב של האלגוריתם אפשר להרחיב את הקבוצה <M>G</M> לפתרון אופטימלי. נוכיח זאת באינדוקציה.</p>
          <p><strong>משפט:</strong> האלגוריתם מחזיר פתרון חוקי בגודל מקסימלי.</p>
        </Def>
        <Callout type="pit" title="'לא טועה' זה לא מספיק">
          <p>גם אלגוריתם שלא עושה כלום "לא טועה": <M>G = ∅</M> מוכלת בכל פתרון אופטימלי. לכן יש שני חלקים: הטענה הנשמרת, ואחריה טיעון שבסוף הריצה הפתרון <strong>כבר</strong> אופטימלי. התרגיל הראשון במעבדה עוסק בדיוק בחלק השני.</p>
          <button className="btn text-sm mt-2" onClick={() => goLab('g1')}>לתרגיל 1 במעבדה</button>
        </Callout>
        <Callout type="behind" title="למה 'טענה נשמרת'?">
          <p>זה אותו רעיון כמו שמורת לולאה ממבני נתונים: תכונה שנכונה לפני הלולאה, נשמרת בכל איטרציה, ובסוף, יחד עם תנאי העצירה (<M>S = ∅</M>), נותנת את מה שרוצים.</p>
        </Callout>
        <IntuitionCheck
          q="למה הטענה אומרת 'קיים פתרון אופטימלי O שמכיל את G' ולא 'הפתרון האופטימלי מכיל את G'?"
          options={[
            { t: 'כי ייתכנו כמה פתרונות אופטימליים, ומותר שבכל שלב זה יהיה O אחר.', correct: true, why: 'ההרצאה מדגישה: "שימו לב שייתכנו כמה פתרונות אופטימליים". בצעד האינדוקציה מחליפים את O ב-O′, ולכן הטענה חייבת להיות "קיים".' },
            { t: 'כי לא לכל קלט יש פתרון אופטימלי.', correct: false, why: 'מספר הפתרונות החוקיים סופי ולא ריק (∅ חוקי), ולכן תמיד קיים פתרון בגודל מקסימלי.' },
            { t: 'כי O הוא הפלט של האלגוריתם.', correct: false, why: 'O הוא פתרון אופטימלי כלשהו שמשמש רק בהוכחה. האלגוריתם לא מכיר אותו.' },
          ]}
        />
      </Section>

      <Section id="inv3" scope="lec3" doneKey="inv3" kicker="הרצאה 3 · עמ׳ 4" title="הוכחת הטענה הנשמרת באינדוקציה">
        <Def tag="הבחנה">
          <p>האלגוריתם מחזיר פתרון חוקי: בכל שלב כל הפעילויות ב-<M>S</M> זרות לפעילויות ב-<M>G</M>, ולכן כשמוסיפים פעילות מ-<M>S</M> ל-<M>G</M>, הפעילויות ב-<M>G</M> נשארות זרות זו לזו.</p>
        </Def>
        <p><strong>סימונים:</strong> <M>{"i_{ℓ}"}</M> היא הפעילות ה-<M>ℓ</M>-ית שהאלגוריתם מוסיף, ו-<M>{"G_{ℓ} = {i_1, …, i_ℓ}"}</M>.</p>
        <div className="grid gap-5">
          <RevealStep n="1" title="בסיס" question="מה נכון על $G₀$?">
            <p><M>G₀ = ∅</M> מוכלת בכל פתרון אופטימלי. בוחרים פתרון אופטימלי כלשהו <M>O</M>.</p>
          </RevealStep>
          <RevealStep n="2" title="הנחה ושני מקרים" question="נניח $G_{ℓ−1} ⊆ O$. מתי אפשר להשאיר את $O$ כמו שהוא?">
            <p><strong>המקרה הפשוט:</strong> <M>{"i_{ℓ} ∈ O"}</M>. בוחרים <M>O′ = O</M>.</p>
            <p><strong>המקרה האחר:</strong> <M>{"i_{ℓ} ∉ O"}</M>. בונים פתרון אופטימלי אחר באמצעות <strong>החלפה</strong>.</p>
          </RevealStep>
        </div>
        <ExchangeDemo />
        <div className="grid gap-5">
          <RevealStep n="3" title="ההחלפה במקרה הכללי" question="את איזו פעילות של $O$ כדאי להוציא כדי לפנות מקום ל-$i_ℓ$?">
            <p>מסמנים ב-<M>{"j_{ℓ}, j_{ℓ+1}, …, j_{k}"}</M> את הפעילויות ב-<M>O</M> שאינן ב-<M>{"G_{ℓ}"}</M>, לפי סדר זמני הסיום. בפרט, <M>{"j_{ℓ}"}</M> מסתיימת ראשונה מביניהן. מגדירים</p>
            <p className="text-center"><M>{"O′ = (O ∖ {j_ℓ}) ∪ {i_ℓ}"}</M></p>
            <p>מתקיים <M>|O′| = |O|</M>. נותר להראות ש-<M>O′</M> חוקי.</p>
          </RevealStep>
        </div>
        <Callout type="behind" title="למה דווקא $j_ℓ$?">
          <p><M>{"j_{ℓ}"}</M> היא ה"מתחרה הישירה" של <M>{"i_{ℓ}"}</M>: הפעילות הבאה בתור של <M>O</M> אחרי מה ששני הפתרונות כבר חולקים. אם מוציאים פעילות שמסתיימת מאוחר יותר, <M>{"i_{ℓ}"}</M> עלולה לחתוך את <M>{"j_{ℓ}"}</M> שנשארה.</p>
        </Callout>
        <TryFirst goLab={goLab} ids={[['g2', 2]]} text="את ההוכחה שההחלפה חוקית אפשר לכתוב לבד, לפני שקוראים את החלק הבא." />
      </Section>

      <Section id="swap3" scope="lec3" doneKey="swap3" kicker="הרצאה 3 · עמ׳ 5" title="למה ההחלפה שומרת על חוקיות">
        <p>אם <M>O′</M> חוקי, הוא גם אופטימלי, כי גודלו שווה לגודל <M>O</M>. כל הפעילויות ב-<M>O</M> זרות זו לזו, ולכן די להראות ש-<M>{"i_{ℓ}"}</M> זרה לשאר הפעילויות ב-<M>O′</M>.</p>
        <div className="grid gap-5">
          <RevealStep n="1" title="מול הפעילויות שכבר נבחרו" question="למה $i_ℓ$ זרה ל-$i_1, …, i_{ℓ−1}$?">
            <p>לפי האלגוריתם: <M>{"i_{ℓ}"}</M> נבחרה מתוך <M>S</M>, וכל הפעילויות ב-<M>S</M> זרות ל-<M>{"G_{ℓ−1}"}</M>.</p>
          </RevealStep>
          <RevealStep n="2" title="איפה כלל הבחירה נכנס" question="מה הקשר בין $f_{iℓ}$ ל-$f_{jℓ}$?">
            <p><M>O</M> חוקי, ולכן <M>{"j_{ℓ}"}</M> זרה ל-<M>{"i_1, …, i_{ℓ−1}"}</M>. לכן <M>{"j_{ℓ} ∈ S"}</M> בשלב ה-<M>ℓ</M>. האלגוריתם בחר בשלב זה את <M>{"i_{ℓ}"}</M>, ולכן <M>{"f_{iℓ} ≤ f_{jℓ}"}</M>.</p>
          </RevealStep>
          <RevealStep n="3" title="מול הזנב של O" question="למה $i_ℓ$ זרה ל-$j_{ℓ+1}, …, j_k$?">
            <p><M>O</M> חוקי, ולכן <M>{"j_{ℓ+1}, …, j_{k}"}</M> מתחילות לאחר סיום <M>{"j_{ℓ}"}</M> או בזמן סיומה. לכן הן מתחילות גם לאחר סיום <M>{"i_{ℓ}"}</M> או בזמן סיומה, ו-<M>{"i_{ℓ}"}</M> זרה לכולן. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="tip" title="השאלה שמנחה כל טיעון החלפה">
          <p>"מה הבחירה החמדנית מבטיחה לי <strong>לעומת</strong> הפעילות שאני זורק?" כאן התשובה היא <M>{"f_{iℓ} ≤ f_{jℓ}"}</M>, וכל השאר נובע ממנה. אם אי אפשר לענות על השאלה הזו, כנראה שבחרתם את הפעילות הלא נכונה לזרוק.</p>
        </Callout>
        <Callout type="pit" title="צריך להצדיק ש-$j_ℓ$ הייתה ב-$S$">
          <p>כדי להשתמש בכלל הבחירה צריך ש-<M>{"j_{ℓ}"}</M> הייתה <strong>מועמדת</strong> בשלב ה-<M>ℓ</M>. זה נובע מכך ש-<M>{"j_{ℓ}"}</M> ו-<M>{"G_{ℓ−1}"}</M> כולן בתוך <M>O</M> החוקי. בלי השורה הזו, האי־שוויון <M>{"f_{iℓ} ≤ f_{jℓ}"}</M> לא מוצדק.</p>
        </Callout>
      </Section>

      <Section id="end3" scope="lec3" doneKey="end3" kicker="הרצאה 3 · עמ׳ 5" title="אופטימליות בסוף הריצה, וזמן הריצה הנאיבי">
        <p>עד כאן הראינו שהבחירות של האלגוריתם אינן מונעות הגעה לפתרון אופטימלי. עכשיו מראים שבסוף הריצה האלגוריתם אכן מגיע לפתרון כזה.</p>
        <TryFirst goLab={goLab} ids={[['g1', 1]]} text="זה התרגיל הקל במעבדה. נסו לפני שאתם פותחים את ההוכחה." />
        <div className="grid gap-5">
          <RevealStep n="1" title="משפט: בסוף הריצה G אופטימלי" question="הטענה הנשמרת נותנת O ⊇ G. למה בסוף O = G?">
            <p>לפי הטענה הנשמרת קיים פתרון אופטימלי <M>O</M> כך ש-<M>G ⊆ O</M>. בסוף הריצה <M>S = ∅</M>, ולכן כל פעילות שאינה ב-<M>G</M> חותכת פעילות ב-<M>G</M>. מכאן ש-<M>O</M> לא יכול להכיל פעילות שאינה ב-<M>G</M>. לכן <M>O = G</M>, ו-<M>G</M> פתרון אופטימלי. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Def tag="ניתוח זמן הריצה">
          <ul>
            <li><strong>איך מוצאים את הפעילות שמסתיימת ראשונה ב-S?</strong> ממיינים לפי זמני הסיום: <M>O(n log n)</M>.</li>
            <li><strong>איך מעדכנים את S?</strong> אחרי כל בחירה מסירים את כל הפעילויות שחותכות אותה. מימוש נאיבי: <M>O(n)</M> לשלב, ולכן <M>O(n²)</M> בסך הכול.</li>
          </ul>
        </Def>
        <Callout type="behind" title="קודם מופשט, אחר כך מימוש">
          <p>ההוכחה דיברה על <M>S</M> ו-<M>G</M> בלי שום מבנה נתונים. זו גישת "מלמעלה למטה" מהרצאה 1: מוכיחים נכונות ברמה המופשטת, ורק אז מחפשים מימוש מהיר. המימוש המהיר יצטרך הוכחה משלו: שהוא מבצע את אותן בחירות.</p>
        </Callout>
      </Section>

      <Section id="fast3" scope="lec3" doneKey="fast3" kicker="הרצאה 3 · עמ׳ 6" title="מימוש יעיל באמצעות מיון וסריקה">
        <Def tag="האלגוריתם">
          <ol>
            <li>ממיינים לפי זמני הסיום: <M>{"f_{i1} ≤ f_{i2} ≤ ⋯ ≤ f_{in}"}</M>.</li>
            <li>מאתחלים <M>H ← ∅</M> ו-<M>f ← 0</M>. <M>f</M> הוא זמן הסיום של הפעילות האחרונה שנבחרה.</li>
            <li>עבור <M>k = 1, …, n</M>: אם <M>{"f ≤ s_{ik}"}</M>, מעדכנים <M>{"H ← H ∪ {i_k}"}</M> ו-<M>{"f ← f_{ik}"}</M>.</li>
          </ol>
          <p><strong>זמן הריצה:</strong> מיון <M>O(n log n)</M>, לולאה <M>O(n)</M>. סך הכול <M>O(n log n)</M>.</p>
        </Def>
        <ScanSim />
        <Def tag="הקשר לאלגוריתם החמדני">
          <p><strong>טענה:</strong> כשהמימוש היעיל מוסיף <M>{"i_k"}</M> ל-<M>H</M>, היא מסתיימת ראשונה מבין כל הפעילויות הזרות לפעילויות שכבר ב-<M>H</M>.</p>
        </Def>
        <TryFirst goLab={goLab} ids={[['g3', 3]]} text="ההוכחה של הטענה הזו היא תרגיל 3 במעבדה." />
        <div className="grid gap-5">
          <RevealStep n="1" title="$i_k$ זרה ל-$H$" question="מה ידוע על זמני הסיום של הפעילויות ב-H?">
            <p>לפני הוספת <M>{"i_k"}</M>, כל הפעילויות ב-<M>H</M> מסתיימות לכל המאוחר בזמן <M>f</M>. מכיוון ש-<M>{"f ≤ s_{ik}"}</M>, פעילות <M>{"i_k"}</M> זרה לכולן.</p>
          </RevealStep>
          <RevealStep n="2" title="כל פעילות שנדחתה חותכת את H" question="תהי $i_j$, $j < k$, שנדחתה. במה היא חותכת?">
            <p>נסמן ב-<M>h</M> את הפעילות האחרונה שנבחרה בזמן הבדיקה של <M>{"i_j"}</M>. תנאי הדחייה: <M>{"s_{ij} < f_h"}</M>. <M>h</M> נסרקה לפני <M>{"i_j"}</M>, ולכן <M>{"f_h ≤ f_{ij}"}</M>. לכן</p>
            <p className="text-center"><M>{"s_{ij} < f_h,   s_h < f_h ≤ f_{ij}"}</M></p>
            <p>ו-<M>{"i_j"}</M> חותכת את <M>h</M>. <M>h</M> נשארת ב-<M>H</M>, ולכן <M>{"i_j"}</M> לא זרה ל-<M>H</M> גם בהמשך.</p>
          </RevealStep>
          <RevealStep n="3" title="מסקנה" question="למה זה מראה ש-$i_k$ היא הבחירה החמדנית?">
            <p>כל הפעילויות הזרות ל-<M>H</M> נמצאות ברשימה <M>{"i_k, …, i_n"}</M>, ו-<M>{"i_k"}</M> מסתיימת ראשונה מביניהן. <span className="qed" /></p>
          </RevealStep>
        </div>
      </Section>

      <div className="card p-5 sm:p-6" style={{ background: 'var(--ink)', color: 'var(--surface)', borderColor: 'var(--ink)' }}>
        <div className="kicker" style={{ color: 'var(--mark)' }}>כרטיס סיכום · הרצאה 3</div>
        <ul className="mt-2 grid gap-1.5 text-[0.98rem]" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>חוקיות לכל כלל (הבחנה) ואופטימליות רק לכלל הנכון: שתי טענות נפרדות.</li>
          <li>שלושה כללים טבעיים נופלים על דוגמה נגדית קטנה. לפני הוכחה, נסו להפיל.</li>
          <li>טענה נשמרת: בכל שלב קיים <M>O</M> אופטימלי עם <M>G ⊆ O</M>. אינדוקציה: מקרה פשוט, ומקרה החלפה <M>{"O′ = (O ∖ {j_ℓ}) ∪ {i_ℓ}"}</M>.</li>
          <li>בהחלפה: <M>|O′| = |O|</M>, ו-<M>O′</M> חוקי בזכות <M>{"f_{iℓ} ≤ f_{jℓ}"}</M>.</li>
          <li>בסוף: <M>S = ∅</M> ⇒ <M>O = G</M>. מימוש: מיון וסריקה, <M>O(n log n)</M>, עם הוכחה שהבחירות זהות.</li>
        </ul>
      </div>
    </Stepper>
  );
}

const TUT2_SECTIONS = [
  ['plan2', 'מה בתרגול'], ['rules2', 'כללי בחירה'], ['ahead2', 'נשארים מקדימה'], ['ahead-proof2', 'הוכחת טענת העזר'],
  ['part2', 'חלוקת הפעילויות'], ['part-claims2', 'הטענות'], ['part-swap2', 'החלפת זנבות'], ['spot2', 'איך בוחרים שיטה'],
];

function Tutorial2Tab({ goLab, goTab, onIndex }) {
  return (
    <Stepper scope="tut2" items={TUT2_SECTIONS} onFinish={() => goTab('lab')} finishLabel="למעבדת ההוכחות" onIndexChange={onIndex}>
      <Section id="plan2" scope="tut2" doneKey="plan2" kicker="תרגול 2 · סיכום עמ׳ 1 · שקפים 2–3" title="אלגוריתם שלעולם לא מתחרט">
        <p>אלגוריתם חמדן הוא אלגוריתם שלעולם לא מתחרט על בחירה שעשה (בתקווה שעשה בחירה טובה ככל הניתן). הגישה נראית פשטנית מדי, וכמובן אינה תמיד נכונה, אבל במקרים רבים היא מוצאת פתרון אופטימלי.</p>
        <Def tag="בתרגול">
          <ol>
            <li>תזכורת לבעיית הפעילויות ולאלגוריתם החמדן מההרצאה.</li>
            <li>הוכחת נכונות <strong>נוספת</strong>, שונה מזו שבהרצאה.</li>
            <li>בעיית חלוקת הפעילויות והאלגוריתם החמדן לה.</li>
            <li>הוכחת נכונות לחלוקה לפי <strong>הסכימה המומלצת</strong> להוכחת אלגוריתמים חמדניים.</li>
          </ol>
        </Def>
        <Callout type="behind" title="למה להוכיח שוב משהו שכבר הוכח?">
          <p>כמו שאומר השקף: "כי לפעמים יש דרכים קצרות יותר (או נוחות יותר) להוכיח". בתרגול תראו שתי שיטות שונות. אחת כללית (טענה נשמרת והחלפה), שעובדת כמעט תמיד. השנייה קצרה ("נשארים מקדימה"), כשאפשר להשוות שני פתרונות פעילות מול פעילות. בשאלת מבחן תצטרכו לבחור, ולכן כדאי להכיר את שתיהן.</p>
        </Callout>
        <Callout type="tip" title="איך לקרוא את התרגול הזה">
          <p>בכל הוכחה, לפני שאתם פותחים את הצעדים, שאלו: מה הטענה שנשמרת? על מה האינדוקציה? איפה בדיוק נכנס כלל הבחירה? בכל הוכחה של חמדן, כלל הבחירה מופיע בשורה אחת או שתיים בלבד.</p>
        </Callout>
      </Section>

      <Section id="rules2" scope="tut2" doneKey="rules2" kicker="תרגול 2 · סיכום עמ׳ 1 · שקפים 5–11" title="פעילויות: הגדרות וכללי בחירה">
        <Def tag="הגדרות התרגול">
          <p>נתונה קבוצה <M>A</M> של <M>n</M> פעילויות; לכל <M>i</M>, <M>{"0 ≤ s_i < f_i"}</M>.</p>
          <p><strong>שתי פעילויות i, j אינן מתנגשות</strong> אם <M>s_i ≥ f_j</M> או <M>s_j ≥ f_i</M>. במילים: אחת מתחילה לא לפני שהשנייה נגמרת.</p>
          <p><strong>קבוצה חוקית:</strong> כל שתי פעילויות בה אינן מתנגשות. <strong>יש למצוא:</strong> תת־קבוצה חוקית בגודל מקסימלי. <strong>אבחנה:</strong> ייתכן שיש יותר מקבוצה אחת כזו.</p>
        </Def>
        <p>לאלגוריתם חמדן צריך כלל בחירה. הדוגמאות הנגדיות מהשקפים:</p>
        <GreedySim sets={GR_SETS2} initial="few" />
        <Callout type="tip" title="איך מזהים שכלל נכשל, מהר">
          <p>בונים קלט של 3–5 פעילויות שבו הבחירה הראשונה של הכלל "חוסמת" שתיים. אם לא מצאתם תוך כמה דקות, זה סימן (לא הוכחה) שאולי הכלל נכון, ואז עוברים להוכחה.</p>
        </Callout>
        <Def tag="האלגוריתם · תזכורת">
          <p dir="ltr" className="font-mono text-[0.9rem]">Activity(A): G ← ∅; S ← A; while S ≠ ∅: i ← activity in S with earliest finishing time; S ← S \ Collide(i); G ← G ∪ {"{i}"}; return G</p>
          <p><M>Collide(i)</M> הן הפעילויות שמתנגשות עם <M>i</M> (כולל <M>i</M>).</p>
        </Def>
      </Section>

      <Section id="ahead2" scope="tut2" doneKey="ahead2" kicker="תרגול 2 · סיכום עמ׳ 2 · שקפים 13–17" title="הוכחה נוספת: נשארים מקדימה">
        <p>בהרצאה הוכחתם בעזרת הטענה "בכל שלב, הפתרון הנבנה <M>G</M> מוכל בפתרון אופטימלי <M>O</M>". היום: השוואה ישירה, פעילות מול פעילות.</p>
        <Def tag="סימונים">
          <p><M>{"G = {i_1, i_2, …, i_k}"}</M>: הפתרון של החמדן, לפי סדר הבחירה.</p>
          <p><M>{"O = {j_1, j_2, …, j_m}"}</M>: פתרון אופטימלי כלשהו, ממוין לפי זמני הסיום: <M>{"f_{j1} < f_{j2} < ⋯ < f_{jm}"}</M>.</p>
        </Def>
        <p><strong>אינטואיציה:</strong> בכל פעם בוחרים את הפעילות שמסתיימת הכי מוקדם, וכך מאפשרים ליותר פעילויות להתקיים בהמשך. לכן הפעילות ה-<M>l</M>-ית של <M>G</M> מסתיימת לא אחרי הפעילות ה-<M>l</M>-ית של <M>O</M>.</p>
        <StayAheadViz />
        <Def tag="הטענות">
          <p><strong>טענה ראשית:</strong> הקבוצה <M>G</M> היא קבוצת פעילויות חוקית בגודל מקסימלי.</p>
          <p><strong>טענת עזר:</strong> לכל <M>1 ≤ l ≤ k</M>, <M>{"f_{il} ≤ f_{jl}"}</M>.</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="חוקיות" question="מה מבטיח שאין התנגשויות ב-G?">
            <p>לאחר הוספת פעילות ל-<M>G</M>, כל הפעילויות שמתנגשות איתה מוצאות מ-<M>S</M>. לכן כל פעילות שמתווספת ל-<M>G</M> מ-<M>S</M> לא מתנגשת עם אף פעילות שכבר נבחרה.</p>
          </RevealStep>
          <RevealStep n="2" title="אופטימליות: m = k" question="O אופטימלי, ולכן m ≥ k. איך טענת העזר פוסלת m > k?">
            <p>מטענת העזר, <M>{"f_{ik} ≤ f_{jk}"}</M>. <M>{"i_k"}</M> היא האחרונה שהאלגוריתם הוסיף, ולכן אין בקלט פעילות שמתחילה בזמן <M>{"f_{ik}"}</M> או אחריו. לכן גם אין פעילות שמתחילה אחרי <M>{"f_{jk}"}</M>, כלומר <M>{"j_k"}</M> היא האחרונה ב-<M>O</M>, ו-<M>m = k</M>. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="behind" title="למה אין פעילות שמתחילה אחרי $f_{ik}$?">
          <p>כל הפעילויות ב-<M>G</M> מסתיימות עד <M>{"f_{ik}"}</M>. פעילות שמתחילה בזמן <M>{"f_{ik}"}</M> או אחריו זרה לכולן, ולכן אף פעם לא הייתה מוסרת מ-<M>S</M>. אבל בסוף הריצה <M>S = ∅</M>. זה אותו רעיון כמו "בסוף הריצה" בהרצאה, בניסוח אחר.</p>
        </Callout>
      </Section>

      <Section id="ahead-proof2" scope="tut2" doneKey="ahead-proof2" kicker="תרגול 2 · סיכום עמ׳ 3 · שקפים 18–19" title="הוכחת טענת העזר באינדוקציה על l">
        <div className="grid gap-5">
          <RevealStep n="1" title="בסיס: l = 1" question="למה $f_{i1} ≤ f_{j1}$?">
            <p><M>{"i_1"}</M> מסתיימת ראשונה מבין <strong>כל</strong> הפעילויות, ובפרט <M>{"f_{i1} ≤ f_{j1}"}</M>.</p>
          </RevealStep>
          <RevealStep n="2" title="צעד" question="נניח $f_{il} ≤ f_{jl}$. איפה נמצאת $j_{l+1}$ כשהחמדן בוחר את $i_{l+1}$?">
            <p>הפעילויות ב-<M>O</M> אינן מתנגשות, ולכן <M>{"f_{il} ≤ f_{jl} ≤ s_{j(l+1)}"}</M> (הנחת האינדוקציה, ואז זרות).</p>
            <p>כלומר <M>{"j_{l+1}"}</M> מתחילה אחרי סוף <M>{"i_l"}</M>, ולכן עדיין נמצאת ב-<M>S</M> כש-<M>{"i_{l+1}"}</M> נבחרת. החמדן בוחר את הפעילות עם זמן הסיום המינימלי ב-<M>S</M>, ולכן <M>{"f_{i(l+1)} ≤ f_{j(l+1)}"}</M>. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="behind" title="פרט שקל לפספס">
          <p>כדי ש-<M>{"j_{l+1}"}</M> תהיה ב-<M>S</M> צריך שהיא תהיה זרה ל<strong>כל</strong> <M>{"i_1, …, i_l"}</M>, לא רק ל-<M>{"i_l"}</M>. זה נכון כי החמדן בוחר פעילויות בסדר עולה של זמני סיום, כך שכולן מסתיימות עד <M>{"f_{il} ≤ s_{j(l+1)}"}</M>. במבחן, שורה כזו מראה שהבנתם את ההוכחה.</p>
        </Callout>
        <Def tag="מימוש וזמן ריצה">
          <p>במימוש נאיבי <M>O(n²)</M>: חיפוש <M>Collide(i)</M> דורש <M>Ω(n)</M>, ויש לכל היותר <M>n</M> קריאות. במימוש מההרצאה (מיון וסריקה): <M>O(n log n)</M>.</p>
        </Def>
        <TryFirst goLab={goLab} ids={[['g4', 4], ['g5', 5]]} text="תרגיל 4 במעבדה: לכתוב את ההוכחה הזו בעצמכם. תרגיל 5 הוא חלק א' של החידה מסוף התרגול." />
      </Section>

      <Section id="part2" scope="tut2" doneKey="part2" kicker="תרגול 2 · סיכום עמ׳ 3 · שקפים 21–24" title="בעיית חלוקת הפעילויות">
        <Def tag="הבעיה">
          <p><strong>קלט:</strong> קבוצת פעילויות <M>A</M> בגודל <M>n</M>, עם זמני התחלה וסיום (שלמים אי־שליליים).</p>
          <p><strong>פתרון חוקי:</strong> חלוקה של <strong>כל</strong> הפעילויות לקבוצות חוקיות <M>{"G_1, …, G_d"}</M>: <M>{"⋃ G_i = A"}</M> ו-<M>{"G_i ∩ G_j = ∅"}</M> לכל <M>i ≠ j</M>.</p>
          <p><strong>יש למצוא:</strong> חלוקה חוקית עם מספר מינימלי של קבוצות.</p>
        </Def>
        <p>אפשר לחשוב על כל קבוצה כעל חדר: רוצים לשבץ את כל הפעילויות במינימום חדרים.</p>
        <div className="grid gap-5">
          <RevealStep n="1" title="רעיון ראשון: בחירה חוזרת" question="מריצים את האלגוריתם לבעיית הפעילויות שוב ושוב, כל עוד נשארו פעילויות. האם זה אופטימלי?">
            <p>הפלט חוקי, אבל <strong>לא</strong> אופטימלי. בקלט משקף 21 הרעיון נותן 3 קבוצות, וקיימת חלוקה ל-2. נסו בסימולטור.</p>
          </RevealStep>
          <RevealStep n="2" title="רעיון שני: לפי זמן התחלה" question="מה משתנה אם עוברים על הפעילויות לפי זמן ההתחלה?">
            <p>בכל פעם לוקחים את הפעילות שמתחילה הכי מוקדם, ומכניסים אותה לאחת הקבוצות שכבר נבנו שיש בה מקום. אם אין, פותחים בשבילה קבוצה חדשה.</p>
          </RevealStep>
        </div>
        <PartitionSim />
        <Def tag="האלגוריתם">
          <p dir="ltr" className="font-mono text-[0.9rem]">Partition(A): G₁ = ∅; k ← 1; sort A by starting time (s₁ ≤ s₂ ≤ ⋯ ≤ sₙ); for l = 1 to n: if possible, insert activity l to one of G_i; else k ← k+1, G_k ← {"{l}"}; return G₁, …, G_k</p>
        </Def>
        <Callout type="behind" title="חסם תחתון שכדאי להכיר">
          <p>אם בזמן מסוים יש <M>d</M> פעילויות שחופפות זו לזו, כל חלוקה צריכה לפחות <M>d</M> קבוצות, כי אף שתיים מהן לא יכולות להיות באותה קבוצה. הסימולטור מראה את החסם הזה לכל קלט.</p>
        </Callout>
        <IntuitionCheck
          q="למה הרעיון הראשון נכשל בקלט משקף 21?"
          options={[
            { t: 'הסבב הראשון לוקח את שלוש הקצרות, ומשאיר שתי ארוכות שחופפות זו לזו. כל אחת צריכה קבוצה משלה.', correct: true, why: 'אופטימיות בבעיית הפעילויות (מקסימום בקבוצה אחת) לא מבטיחה אופטימיות בחלוקה (מינימום קבוצות). אלו מטרות שונות.' },
            { t: 'בגלל שוויון בזמני ההתחלה.', correct: false, why: 'לשוויון ב-0 אין השפעה כאן. הבעיה היא שהסבב הראשון "גונב" את הפעילויות הקצרות.' },
          ]}
        />
      </Section>

      <Section id="part-claims2" scope="tut2" doneKey="part-claims2" kicker="תרגול 2 · סיכום עמ׳ 4 · שקפים 25–26" title="הטענות, לפי הסכימה המומלצת">
        <Def tag="טענות">
          <p><strong>טענה ראשית:</strong> האלגוריתם מחזיר פתרון חוקי עם מספר מינימלי של קבוצות.</p>
          <p><strong>טענה נשמרת:</strong> בכל שלב <M>l</M> קיים פתרון אופטימלי <M>{"O = O_1, …, O_d"}</M>, כאשר <M>k ≤ d</M>, כך ש-<M>{"G_r ⊆ O_r"}</M> לכל <M>1 ≤ r ≤ k</M>.</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="הטענה הראשית מתוך הטענה הנשמרת" question="מה קורה בסוף הריצה?">
            <p>בסוף הריצה האלגוריתם שיבץ את כל הפעילויות, וקיים פתרון אופטימלי שמרחיב אותו. אין פעילויות נוספות לשיבוץ, ולכן הפתרון האופטימלי שמובטח הוא בדיוק הפלט של האלגוריתם. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="behind" title="למה הטענה כוללת $k ≤ d$?">
          <p>"מרחיב" כאן פירושו שכל קבוצה <M>{"G_r"}</M> של האלגוריתם מוכלת בקבוצה <M>{"O_r"}</M> <strong>עם אותו אינדקס</strong>. זה אפשרי רק אם לאלגוריתם אין יותר קבוצות משיש ל-<M>O</M>. לכן <M>k ≤ d</M> הוא חלק מהטענה, וגם אותו צריך להוכיח שוב בכל צעד.</p>
        </Callout>
        <Callout type="tip" title="השוואה לבעיית הפעילויות">
          <p>שם: <M>G ⊆ O</M> (קבוצה אחת). כאן: <M>{"G_r ⊆ O_r"}</M> לכל <M>r</M> (רשימת קבוצות). אותה סכימה, אובייקט מורכב יותר. כשמכלילים טענה נשמרת, שאלו מה בדיוק "להכיל" אומר עבור הפתרונות של הבעיה החדשה.</p>
        </Callout>
      </Section>

      <Section id="part-swap2" scope="tut2" doneKey="part-swap2" kicker="תרגול 2 · סיכום עמ׳ 4–5 · שקפים 27–36" title="הוכחת הטענה הנשמרת: החלפת זנבות">
        <p>אינדוקציה על מספר הפעילויות ששובצו. <strong>בסיס:</strong> בתחילת האלגוריתם הפתרון החמדן ריק, וכל פתרון אופטימלי מקיים את הטענה. <strong>הנחה:</strong> אחרי <M>l − 1</M> שיבוצים קיים <M>{"O_1, …, O_d"}</M> כך ש-<M>{"G_r ⊆ O_r"}</M> לכל <M>r ≤ k</M>.</p>
        <p>מסמנים ב-<M>j</M> את הקבוצה שאליה האלגוריתם שיבץ את <M>l</M>, וב-<M>t</M> את הקבוצה שבה <M>l</M> נמצאת ב-<M>O</M>.</p>
        <div className="grid gap-5">
          <RevealStep n="1" title="מקרה פשוט: j = t" question="מה צריך לעשות?">
            <p>האלגוריתם שיבץ בתיאום עם <M>O</M>, ולכן <M>O</M> מהנחת האינדוקציה מקיים את הטענה גם אחרי הצעד.</p>
          </RevealStep>
          <RevealStep n="2" title="מקרה פחות פשוט: קודם k′ ≤ d" question="אם נפתחה קבוצה חדשה, למה זה לא חורג מ-d?">
            <p>אם לא נפתחה קבוצה חדשה, <M>k′ = k ≤ d</M>. אחרת, <M>l</M> חותכת פעילות בכל אחת מ-<M>{"G_1, …, G_k"}</M>, ולכן (בגלל ההכלה) גם בכל אחת מ-<M>{"O_1, …, O_k"}</M>. <M>l</M> נמצאת ב-<M>O</M>, ולכן בהכרח בקבוצה אחרת: <M>k′ = k + 1 ≤ d</M>.</p>
          </RevealStep>
        </div>
        <TailSwap />
        <div className="grid gap-5">
          <RevealStep n="3" title="ההגדרה" question="איך מגדירים את הזנבות?">
            <p>לכל <M>1 ≤ i ≤ d</M>, <M>{"A_i"}</M> = כל הפעילויות ב-<M>{"O_i"}</M> שמתחילות החל מ-<M>{"s_l"}</M>. מגדירים</p>
            <p className="text-center"><M>{"O′_j = (O_j ∖ A_j) ∪ A_t,   O′_t = (O_t ∖ A_t) ∪ A_j"}</M></p>
            <p>ולכל <M>r ≠ j, t</M>: <M>{"O′_r = O_r"}</M>. <M>O′</M> משתמש באותו מספר קבוצות כמו <M>O</M>, ומשבץ את <M>l</M> הפעילויות הראשונות כמו האלגוריתם.</p>
          </RevealStep>
          <RevealStep n="4" title="חוקיות $O′_j$" question="תהי $a ∈ A_t$ ו-$b ∈ O_j ∖ A_j$. למה הן לא מתנגשות?">
            <p>כל הפעילויות ב-<M>{"O_j ∖ A_j"}</M> מתחילות לפני <M>{"s_l"}</M>, ולכן האלגוריתם כבר שיבץ אותן עד שלב <M>l − 1</M>: <M>{"b ∈ G_j"}</M> (הנחת האינדוקציה). בשלב <M>l</M> האלגוריתם הכניס את <M>l</M> ל-<M>{"G_j"}</M> בלי התנגשות, ולכן <M>{"f_b ≤ s_l"}</M>. <M>{"a ∈ A_t"}</M>, ולכן <M>{"s_l ≤ s_a"}</M>. סה"כ <M>{"f_b ≤ s_l ≤ s_a"}</M>.</p>
          </RevealStep>
          <RevealStep n="5" title="חוקיות $O′_t$" question="תהי $a ∈ A_j$ ו-$b ∈ O_t ∖ A_t$. ומה כאן?">
            <p><M>{"b ∈ O_t"}</M>, ולכן לא מתנגשת עם <M>l</M>, שגם היא ב-<M>{"O_t"}</M>. לפי הגדרת <M>{"A_t"}</M>, <M>b</M> מתחילה לפני <M>{"s_l"}</M>, ולכן גם מסתיימת עד <M>{"s_l"}</M>: <M>{"f_b ≤ s_l"}</M>. <M>{"a ∈ A_j"}</M>, ולכן <M>{"s_l ≤ s_a"}</M>. סה"כ <M>{"f_b ≤ s_l ≤ s_a"}</M>. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="behind" title="שתי הוכחות חוקיות, שני נימוקים שונים">
          <p>ב-<M>{"O′_j"}</M> הנימוק עובר דרך <strong>האלגוריתם</strong> (b כבר שובצה, ו-l נכנסה לידה בלי התנגשות). ב-<M>{"O′_t"}</M> הנימוק עובר דרך <strong>O</strong> (b ו-l באותה קבוצה חוקית). בהחלפה בין שני פתרונות, כל צד נשען על הפתרון שממנו הגיע.</p>
        </Callout>
        <Callout type="pit" title="'בלי הוכחת אי השוויון, ההמשך לא חוקי'">
          <p>הסיכום של התרגול מדגיש: בלי להראות <M>k′ ≤ d</M> לא נדע שהאלגוריתם לא יצר <M>d + 1</M> קבוצות, ואז <M>{"G_{k′}"}</M> לא מוכלת באף <M>{"O_r"}</M>. זה צעד שקל לדלג עליו.</p>
        </Callout>
        <TryFirst goLab={goLab} ids={[['g7', 7]]} text="תרגיל 7 במעבדה: לכתוב את כל ההוכחה הזו בעצמכם." />
      </Section>

      <Section id="spot2" scope="tut2" doneKey="spot2" kicker="תרגול 2 · שקף 37" title="איך בוחרים שיטת הוכחה, ומה מחכה בבית">

                ['דוגמה נגדית', 'כשהכלל חשוד, או כשהשאלה "הוכיחו או הפריכו"', 'קיים קלט שבו החמדן לא אופטימלי', 'שלושת הכללים, הרעיון הראשון לחלוקה'],
              ].map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} className={'py-2 px-2 border-b border-line ' + (j === 0 ? 'font-semibold' : '')}>{j === 2 ? <M>{c}</M> : c}</td>)}</tr>)}
            </tbody>
          </table>
        </div>
        <Callout type="tip" title="הסדר הנכון מול שאלת חמדן">
          <p>(1) מנסים להפיל את הכלל בדוגמה קטנה. (2) אם לא נופל: חוקיות. (3) בוחרים שיטה ומנסחים טענת עזר מדויקת. (4) אינדוקציה. (5) מהטענה לאופטימליות בסוף. (6) מימוש וזמן.</p>
        </Callout>
        <Def tag="חידה לבית">
          <p><strong>חלק א׳:</strong> בבעיית הפעילויות בוחרים בכל שלב את הפעילות שמתחילה <strong>אחרונה</strong>. האם האלגוריתם תמיד אופטימלי? הוכיחו או הפריכו.</p>
          <p><strong>חלק ב׳:</strong> בחלוקת הפעילויות ממיינים לפי זמן <strong>סיום</strong> (במקום התחלה), ומכניסים כל פעילות לקבוצה הראשונה שבה יש לה מקום. עדיין מינימלי? הוכיחו או הפריכו.</p>
          <p className="c-muted">רמז מהשקף: באחד החלקים התשובה חיובית ובשני שלילית.</p>
        </Def>
        <div className="flex gap-2 flex-wrap">
          <button className="btn btn-primary text-sm" onClick={() => goLab('g5')}>חלק א׳ במעבדה</button>
          <button className="btn text-sm" onClick={() => goLab('g6')}>חלק ב׳ במעבדה</button>
        </div>
      </Section>

      <div className="card p-5 sm:p-6" style={{ background: 'var(--ink)', color: 'var(--surface)', borderColor: 'var(--ink)' }}>
        <div className="kicker" style={{ color: 'var(--mark)' }}>כרטיס סיכום · תרגול 2</div>
        <ul className="mt-2 grid gap-1.5 text-[0.98rem]" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>נשארים מקדימה: <M>{"f_{il} ≤ f_{jl}"}</M> באינדוקציה, ואז <M>m = k</M> כי שום פעילות לא מתחילה אחרי <M>{"f_{ik}"}</M>.</li>
          <li>חלוקה: לפי זמן התחלה, לקבוצה שיש בה מקום. בחירה חוזרת של פעילויות לא אופטימלית.</li>
          <li>הטענה הנשמרת לחלוקה: <M>k ≤ d</M> ו-<M>{"G_r ⊆ O_r"}</M>. צריך להוכיח את שני החלקים בכל צעד.</li>
          <li>החלפת זנבות: מחליפים את כל מה שמתחיל החל מ-<M>{"s_l"}</M>, לא רק את <M>l</M>.</li>
          <li>חוקיות כל צד נשענת על הפתרון שממנו הגיע: האלגוריתם או <M>O</M>.</li>

let pdfjsPromise = null;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('script')); document.head.appendChild(el); });
}
function loadPdfjs() {
  if (!pdfjsPromise) {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfjsPromise = loadScript(base + 'pdf.min.js')
      .then(() => loadScript(base + 'pdf.worker.min.js'))
      .then(() => { const lib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib; if (!lib) throw new Error('pdfjs'); return lib; });
    pdfjsPromise.catch(() => { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}

function PdfView({ file, page, follow, onPage, zoom }) {
  const boxRef = useRef(null);
  const pageRefs = useRef([]);
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState(null);
  const [width, setWidth] = useState(0);
  const [dims, setDims] = useState([]);
  const tok = useRef(0);

  useEffect(() => {
    let alive = true; setDoc(null); setErr(null);
    loadPdfjs().then(lib => lib.getDocument({ url: file, isEvalSupported: false }).promise)
      .then(d => { if (alive) setDoc(d); })
      .catch(() => { if (alive) setErr('לא הצלחנו לטעון את הקובץ כאן.'); });
    return () => { alive = false; };
  }, [file]);

  useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const upd = () => setWidth(Math.max(200, el.clientWidth - 24));
    upd();
    let t; const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(upd, 150); });
    ro.observe(el);
    return () => { ro.disconnect(); clearTimeout(t); };
  }, []);

  useEffect(() => {
    if (!doc || !width) return;
    const my = ++tok.current;
    (async () => {
      const w = width * zoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const ds = [];
      for (let n = 1; n <= doc.numPages; n++) {
        const pg = await doc.getPage(n); if (my !== tok.current) return;
        const vp0 = pg.getViewport({ scale: 1 });
        const vp = pg.getViewport({ scale: (w / vp0.width) * dpr });
        ds[n - 1] = { w, h: w * vp0.height / vp0.width };
        setDims([...ds]);
        const holder = pageRefs.current[n - 1]; if (!holder) continue;
        const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
        await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        if (my !== tok.current) return;
        const old = holder.querySelector('canvas'); if (old) old.replaceWith(cv); else holder.prepend(cv);
      }
    })().catch(() => { if (my === tok.current) setErr('הקובץ נטען, אבל הצגת העמודים נכשלה.'); });
  }, [doc, width, zoom]);

  useEffect(() => {
    if (!follow || !page || !doc) return;
    const el = pageRefs.current[page - 1], box = boxRef.current;
    if (el && box) box.scrollTo({ top: el.offsetTop - 12, behavior: 'smooth' });
  }, [page, follow, doc, dims.length >= (page || 0)]);

  const onScroll = () => {
    const box = boxRef.current; if (!box) return;
    const mid = box.scrollTop + box.clientHeight * 0.35; let cur = 1;
    pageRefs.current.forEach((el, k) => { if (el && el.offsetTop <= mid) cur = k + 1; });
    onPage && onPage(cur, doc ? doc.numPages : 0);
  };
  useEffect(() => { if (doc) onPage && onPage(1, doc.numPages); }, [doc]);

  return (
    <div ref={boxRef} className="pdf-scroll" onScroll={onScroll} dir="ltr">
      {err && <div className="callout callout-pit" dir="rtl">{err} אפשר לפתוח אותו בלשונית חדשה בכפתור למעלה.</div>}
      {!err && !doc && <div className="c-muted text-sm p-4 flex items-center gap-2" dir="rtl"><span className="dot pulse-dot" style={{ background: 'var(--accent)' }} />טוען את הקובץ…</div>}
      {doc && Array.from({ length: doc.numPages }, (_, k) => (
        <div key={k} ref={el => (pageRefs.current[k] = el)} className="pdf-page" style={{ width: dims[k] ? dims[k].w : width * zoom, minHeight: dims[k] ? dims[k].h : width * zoom * 1.3 }}>
          <span className="pg">{k + 1}</span>
        </div>
      ))}
    </div>
  );
}

function SourcePanel({ options, pages }) {
  const [view, setView] = useState(options[0].k);
  const cur = options.find(o => o.k === view) || options[0];
  const [follow, setFollow] = useState(true);
  const [zoom, setZoom] = useState(1);
  const [pg, setPg] = useState([1, 0]);
  const file = cur.doc.file;
  return (
    <div className="card lift src-panel overflow-hidden">
      <div className="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-line">
        <div className="min0">
          <div className="font-semibold text-[0.95rem] leading-tight">{cur.doc.title}</div>
          <div className="text-xs c-muted">{cur.doc.name}</div>
        </div>
        <div className="ms-auto flex flex-wrap items-center gap-1.5">
          <span className="chip font-mono"><bdi dir="ltr">{pg[0]} / {pg[1] || '–'}</bdi></span>
          <button className="symkey" aria-label="הקטנה" onClick={() => setZoom(z => Math.max(0.6, +(z - 0.2).toFixed(1)))}>−</button>
          <button className="symkey" aria-label="הגדלה" onClick={() => setZoom(z => Math.min(2.4, +(z + 0.2).toFixed(1)))}>+</button>
          <label className="chip cursor-pointer select-none"><input id={'follow-' + cur.doc.name} type="checkbox" checked={follow} onChange={e => setFollow(e.target.checked)} />עקוב אחרי החלק</label>
        </div>
      </div>
      {options.length > 1 && (
        <div className="px-3 py-2 border-b border-line">
          <div className="tabbar !p-1 w-fit" role="tablist" aria-label="בחירת חומר מקורי">
            {options.map(o => <button key={o.k} role="tab" aria-selected={view === o.k} className="tab !py-1.5 !text-sm" onClick={() => setView(o.k)}>{o.label}</button>)}
          </div>
        </div>
      )}
      {options.length === 1 && (
        <div className="px-3 py-1.5 border-b border-line flex flex-wrap gap-x-4 gap-y-1 text-sm">
          <a className="c-accent font-semibold" href={file} target="_blank" rel="noopener">פתיחה בלשונית חדשה ↗</a>
        </div>
      )}
      <PdfView key={file} file={file} page={pages ? pages[cur.k] : null} follow={follow} zoom={zoom} onPage={(c, n) => setPg([c, n])} />
    </div>
  );
}

function SourceToggle({ on, setOn, kind }) {
  const label = kind === 'lecture' ? (on ? 'הסתר סיכום' : 'הצג סיכום מקורי') : (on ? 'הסתר מצגת' : 'הצג מצגת תרגול');
  return (
    <button className={'btn text-sm shrink-0 ' + (on ? 'btn-primary' : '')} onClick={() => setOn(!on)} aria-pressed={on}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
      {label}
    </button>
  );
}

function ThemeToggle() {
  const sysDark = () => { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } };
  const [theme, setTheme] = useState(() => store.get('theme', null) || (document.documentElement.getAttribute('data-theme')) || (sysDark() ? 'dark' : 'light'));
  const [explicit, setExplicit] = useState(() => !!store.get('theme', null));
  useEffect(() => {
    if (explicit) { document.documentElement.setAttribute('data-theme', theme); store.set('theme', theme); }
  }, [theme, explicit]);
  useEffect(() => {
    if (explicit) return;
    let mq; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
    const h = () => setTheme(document.documentElement.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'));
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, [explicit]);
  const flip = () => { setExplicit(true); setTheme(t => (t === 'dark' ? 'light' : 'dark')); };
  const dark = theme === 'dark';
  return (
    <button className="theme-switch" dir="ltr" data-theme-now={theme} onClick={flip} role="switch" aria-checked={dark} aria-label={dark ? 'מעבר למצב בהיר' : 'מעבר למצב כהה'} title={dark ? 'מצב בהיר' : 'מצב כהה'}>
      <span className="knob" />
      <span className="opt" data-on={!dark}>{Ico.sun}</span>
      <span className="opt" data-on={dark}>{Ico.moon}</span>
    </button>
  );
}

const WEEK_META = {
  1: {
    kicker: 'שבוע 01 · הרצאה 1 (18.10.2026) · הרצאה 2 (21.10.2026) · תרגול 1 · תגבור 1',
    title: 'מבוא ורדוקציות',
    lead: <>איך פותרים בעיה חדשה בעזרת אלגוריתם שכבר קיים, ואיך מוכיחים שזה עובד, <span className="hl" style={{ color: 'var(--ink)' }}>לכל קלט</span>.</>,
    footer: 'החומר מבוסס על הרצאות 1–2, תרגול 1, תגבור 1 ומבחני העבר בפרויקט.',
  },
  2: {
    kicker: 'שבוע 02 · הרצאה 3 (25.10.2026) · תרגול 2 (25.10.2026)',
    title: 'אלגוריתמים חמדניים',
    lead: <>בכל צעד בוחרים את מה שנראה הכי טוב, ולא מתחרטים. איך מוכיחים שהבחירות האלה <span className="hl" style={{ color: 'var(--ink)' }}>לא סוגרות את הדרך</span> לפתרון אופטימלי.</>,
    footer: 'החומר מבוסס על הרצאה 3, תרגול 2 (סיכום ומצגת) ובוחן האמצע של 2021.',
  },
};

function App() {
  const initialTab = (() => { const h = (location.hash || '').slice(1); return TABS.some(t => t.k === h) ? h : 'lecture'; })();
  const [tab, setTab] = useState(initialTab);
  const [week, setWeekRaw] = usePersist('week', 2);
  const [labStep, setLabStep] = usePersist('labStep', 0);
  const [labStep2, setLabStep2] = usePersist('labStep2', 0);
  const [drawer, setDrawer] = useState(false);
  const [progress, setProgress] = usePersist('progress', { lec: {}, tut: {}, ex: {} });
  const [ai, setAi] = useState({ status: 'loading', fn: null });
  const [splitLec, setSplitLec] = useState(false);
  const [splitTut, setSplitTut] = useState(false);
  const [lecIdx, setLecIdx] = useState(0);
  const [lec2Idx, setLec2Idx] = useState(0);
  const [lec3Idx, setLec3Idx] = useState(0);
  const [lecWhich, setLecWhich] = usePersist('lecWhich', 'l1');
  const [tutIdx, setTutIdx] = useState(0);
  const [tut2Idx, setTut2Idx] = useState(0);
  const W = WEEK_META[week] ? week : 1;
  const meta = WEEK_META[W];
  const split = (tab === 'lecture' && splitLec) || (tab === 'tutorial' && splitTut);

  useEffect(() => {
    let alive = true; const c = window.claude;
    if (!c || typeof c.use !== 'function') { setAi({ status: 'off', fn: null }); return; }
    c.use('sample').then(fn => { if (alive) setAi(fn ? { status: 'on', fn } : { status: 'off', fn: null }); }).catch(() => { if (alive) setAi({ status: 'off', fn: null }); });
    return () => { alive = false; };
  }, []);

  const ctx = {
    progress, ai,
    setAiBlocked: () => setAi({ status: 'blocked', fn: null }),
    setDone: (scope, k, v) => setProgress(p => ({ ...p, [scope]: { ...p[scope], [k]: v } })),
    setEx: (id, patch) => setProgress(p => ({ ...p, ex: { ...p.ex, [id]: { ...(p.ex[id] || {}), ...patch } } })),
  };
  const setWeek = n => { setWeekRaw(n); window.scrollTo({ top: 0 }); };
  const go = k => { setTab(k); try { history.replaceState(null, '', '#' + k); } catch (e) {} window.scrollTo({ top: 0 }); };
  const goLab = id => {
    const k2 = EXERCISES2.findIndex(e => e.id === id);
    if (k2 >= 0) { setWeekRaw(2); setLabStep2(k2 + 1); }
    else { const k = EXERCISES.findIndex(e => e.id === id); setWeekRaw(1); setLabStep(k >= 0 ? k + 1 : 0); }
    setTab('lab'); try { history.replaceState(null, '', '#lab'); } catch (e) {} window.scrollTo({ top: 0 });
  };

  const first = (list, i) => (list[i] || list[0] || [])[0];
  const panel = (() => {
    if (tab === 'lecture') {
      if (W === 2) return { key: 'w2-lec', options: [{ k: 'doc', doc: DOCS.lec3 }], pages: { doc: LEC3_PAGES[first(LEC3_SECTIONS, lec3Idx)] } };
      return lecWhich === 'l2'
        ? { key: 'w1-l2', options: [{ k: 'doc', doc: DOCS.lec2 }], pages: { doc: LEC2_PAGES[first(LEC2_SECTIONS, lec2Idx)] } }
        : { key: 'w1-l1', options: [{ k: 'doc', doc: DOCS.lec1 }], pages: { doc: LEC_PAGES[first(LEC_SECTIONS, lecIdx)] } };
    }
    if (W === 2) return { key: 'w2-tut', options: [{ k: 'summary', label: 'סיכום תרגול', doc: DOCS.ps2 }, { k: 'slides', label: 'מצגת שקופיות', doc: DOCS.ps2m }], pages: { summary: TUT2_PAGES[first(TUT2_SECTIONS, tut2Idx)], slides: TUT2_SLIDE_PAGES[first(TUT2_SECTIONS, tut2Idx)] } };
    return { key: 'w1-tut', options: [{ k: 'summary', label: 'סיכום תרגול', doc: DOCS.ps1 }, { k: 'slides', label: 'מצגת שקופיות', doc: DOCS.ps1m }], pages: { summary: TUT_PAGES[first(TUT_SECTIONS, tutIdx)], slides: TUT_SLIDE_PAGES[first(TUT_SECTIONS, tutIdx)] } };
  })();

  return (
    <Ctx.Provider value={ctx}>
      <div dir="rtl" className={'mx-auto py-4 sm:py-6 lg:flex lg:gap-7 ' + (split ? 'max-w-none' : 'max-w-[1320px]')}>
        <aside className={(split ? 'hidden' : 'hidden lg:block') + ' w-[272px] shrink-0'}>
          <div className="sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 24px)' }}><Rail week={W} setWeek={setWeek} /></div>
        </aside>

        {drawer && (
          <div className={'fixed inset-0 z-50 ' + (split ? '' : 'lg:hidden')} role="dialog" aria-modal="true">
            <div className="absolute inset-0" style={{ background: 'rgba(8,12,20,.45)' }} onClick={() => setDrawer(false)} />
            <div className="absolute top-0 bottom-0 right-0 w-[86%] max-w-[330px] overflow-y-auto p-4" style={{ background: 'var(--bg)', paddingTop: 'calc(env(safe-area-inset-top, 0px) + 16px)', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))', paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 16px)' }}>
              <Rail week={W} setWeek={setWeek} onClose={() => setDrawer(false)} />
            </div>
          </div>
        )}

        <main className="flex-1 min0">
          <header className="grid gap-4">
            <div className="flex items-center gap-3">
              <button className={'btn !p-2 ' + (split ? '' : 'lg:hidden')} onClick={() => setDrawer(true)} aria-label="מפת הסמסטר">{Ico.menu}</button>
              <div className="kicker min0">{meta.kicker}</div>
              <div className="ms-auto flex items-center gap-2"><span className="hidden sm:inline text-sm c-muted">ערכת צבעים</span><ThemeToggle /></div>
            </div>
            <div>
              <h1 className="font-display text-[2rem] sm:text-[2.6rem] leading-[1.1]">{meta.title}</h1>
              <p className="mt-2 c-muted max-w-[62ch]">{meta.lead}</p>
            </div>
          </header>
          <div className="sticky z-40 mt-5 mb-6 py-2" style={{ top: 'env(safe-area-inset-top, 0px)', background: 'var(--bg)' }}>
            <div className="flex items-center gap-2">
            <div className="tabbar flex-1 min0" role="tablist">
              {TABS.map(t => (
                <button key={t.k} role="tab" aria-selected={tab === t.k} className="tab" onClick={() => go(t.k)}>
                  {t.label}<span className="hidden sm:inline font-normal c-muted text-sm">· {t.sub}</span>{t.star && <span className="star">★</span>}
                </button>
              ))}
            </div>
            {tab === 'lecture' && <SourceToggle kind="lecture" on={splitLec} setOn={setSplitLec} />}
            {tab === 'tutorial' && <SourceToggle kind="tutorial" on={splitTut} setOn={setSplitTut} />}
            </div>
          </div>
          <div className={split ? 'grid lg:grid-cols-2 gap-6 items-start' : ''}>
            <div className="min0">
              {tab === 'lecture' && (W === 2
                ? <LecturesW2 key="w2" goLab={goLab} goTab={go} onIndex={setLec3Idx} />
                : <LecturesTab key="w1" which={lecWhich} setWhich={setLecWhich} goLab={goLab} goTab={go} onIndex1={setLecIdx} onIndex2={setLec2Idx} />)}
              {tab === 'tutorial' && (W === 2
                ? <Tutorial2Tab key="w2" goLab={goLab} goTab={go} onIndex={setTut2Idx} />
                : <TutorialTab key="w1" goLab={goLab} goTab={go} onIndex={setTutIdx} />)}
            </div>
            {split && (
              <div className="min0 order-first lg:order-none lg:sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 84px)' }}>
                <SourcePanel key={panel.key} options={panel.options} pages={panel.pages} />
              </div>
            )}
          </div>
          {tab === 'lab' && (W === 2
            ? <Lab2Tab key="w2" step={labStep2} setStep={setLabStep2} />
            : <LabTab key="w1" step={labStep} setStep={setLabStep} />)}
          <footer className="mt-10 mb-6 text-sm c-muted text-center">{meta.footer} טיוטות והתקדמות נשמרות רק בדפדפן הזה.</footer>
        </main>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
