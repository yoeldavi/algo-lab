function buildPrompt(ex, draft, withRef) {
  const F = FIELDS.map(f => `[${f.label}]\n${(draft.fields[f.key] || '').trim() || '(ריק)'}`).join('\n\n');
  const choiceTxt = ex.choices ? 'אפשרויות:\n' + ex.choices.map((c, i) => `${'אבגד'[i]}. ${plain(c)}`).join('\n') + '\n' : '';
  const picked = ex.choices && draft.choice != null ? `התשובה שהסטודנט בחר: ${'אבגד'[draft.choice]}\n` : (ex.choices ? 'הסטודנט לא בחר אפשרות.\n' : '');
  const refBlock = withRef
    ? `# פתרון ייחוס (לשימושך בלבד. אל תעתיק אותו לסטודנט ואל תחשוף את התשובה המלאה)\n${ex.reference}\n\n# נקודות שבודק מחפש\n${(ex.rubric || []).map(r => '- ' + r).join('\n')}`
    : `# חומר עזר\nהשווה לחומר הקורס בפרויקט (מקור השאלה: ${ex.source}). השתמש בהגדרות ובסימונים של ההרצאות והתרגולים.`;
  return `אתה בודק הוכחות מנוסה בקורס האוניברסיטאי "תכנון אלגוריתמים" (נושא: רדוקציות, שבוע 1). הסטודנט מתאמן בכתיבת הוכחות בגישת "מלמעלה למטה" שנלמדה בקורס: ניסוח משפט נכונות, ניסוח טענות עזר, הוכחת המשפט מתוך טענות העזר, הוכחת טענות העזר, ולבסוף ניתוח זמן ריצה. רדוקציה בקורס היא זוג ממירים: ממיר קלט f וממיר פלט g(x, y). הקופסה השחורה רשאית להחזיר כל פתרון חוקי, ואסור להניח עליה שום דבר מלבד נכונות.

# השאלה: ${ex.title}
${plain(ex.statement)}

מה נדרש:
${(ex.tasks || []).map(t => '- ' + plain(t)).join('\n')}
${choiceTxt}
${refBlock}

# תשובת הסטודנט
${picked}${F}

(הסטודנט פתח ${draft.hints || 0} מתוך 3 רמזים.)

# הוראות לבדיקה
כתוב בעברית טבעית וברורה, ופנה לסטודנט בגוף שני. כתוב סימנים מתמטיים ב-Unicode (∀, ∈, ⇔, ≤, s₁) ולא ב-LaTeX. אל תכתוב את הפתרון המלא: כשחסר רעיון מרכזי, הצבע עליו בעזרת שאלה מנחה. היה מדויק: ציין איזו שורה או איזה מעבר לוגי בעייתי ולמה. שדה ריק הוא חוסר שיש לציין. אם הניסוח נכון אבל לא פורמלי מספיק לבחינה, אמור זאת.
השב בדיוק במבנה הזה, עם הכותרות האלה:
## פסק דין
שורה אחת: "נכון ומלא" / "נכון ברובו – חסרים פרטים" / "רעיון נכון, הוכחה חלקית" / "לא נכון בבסיסו", ואחריה "ציון משוער: X/10".
## מה היה טוב בתשובה
2–4 נקודות: צעדים לוגיים נכונים, ניסוח טוב, מבנה נכון.
## מה חסר או שגוי
כל פגם בנקודה נפרדת: פערים לוגיים, כיוון שלא הוכח, מקרי קצה (אין פתרון, ∞), הנחות על הקופסה השחורה, טעויות בסיבוכיות, בעיות ניסוח וסימון.
## טיפים לשיפור
2–4 טיפים מעשיים לכתיבת הוכחה מהסוג הזה בפעם הבאה.
## הצעד הבא
שאלה מנחה אחת שתקדם את הסטודנט מהנקודה שבה הוא נמצא.`;
}

function ReviewView({ text }) {
  const groups = []; let cur = null;
  text.split('\n').forEach(ln => {
    const h = ln.match(/^\s*#{1,4}\s*(.+?)\s*$/);
    if (h) {
      const t = h[1].replace(/\*\*/g, '');
      const tone = /טוב/.test(t) ? 'good' : /חסר|שגוי/.test(t) ? 'bad' : /טיפ/.test(t) ? 'tip' : /פסק/.test(t) ? 'verdict' : /הבא/.test(t) ? 'next' : '';
      cur = { title: t, tone, lines: [] }; groups.push(cur); return;
    }
    if (!cur) { cur = { title: '', tone: '', lines: [] }; groups.push(cur); }
    cur.lines.push(ln);
  });
  const renderLines = (lines, gk) => {
    const out = []; let list = null;
    const flush = () => { if (list) { out.push(<ul key={gk + 'u' + out.length}>{list}</ul>); list = null; } };
    lines.forEach((ln, i) => {
      const li = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (li) { (list = list || []).push(<li key={i}>{inline(li[1], gk + 'li' + i)}</li>); return; }
      if (!ln.trim()) { flush(); return; }
      flush(); out.push(<p key={i}>{inline(ln, gk + 'p' + i)}</p>);
    });
    flush(); return out;
  };
  return (
    <div className="grid gap-2.5">
      {groups.filter(g => g.title || g.lines.some(l => l.trim())).map((g, i) => (
        <div key={i} className={'review-block ' + (g.tone ? 'rv-' + g.tone : '')}>
          {g.title && <h4>{g.title}</h4>}
          <div className="prose-he text-[0.96rem]">{renderLines(g.lines, 'g' + i)}</div>
        </div>
      ))}
    </div>
  );
}

let pdfjsPromise = null;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('script')); document.head.appendChild(el); });
}
function loadPdfjs() {
  if (!pdfjsPromise) {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    pdfjsPromise = loadScript(base + 'pdf.min.js')
      .then(() => loadScript(base + 'pdf.worker.min.js'))
      .then(() => { const lib = window['pdfjs-dist/build/pdf'] || window.pdfjsLib; if (!lib) throw new Error('pdfjs'); return lib; });
    pdfjsPromise.catch(() => { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}

function PdfView({ file, page, follow, onPage, zoom }) {
  const boxRef = useRef(null);
  const pageRefs = useRef([]);
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState(null);
  const [width, setWidth] = useState(0);
  const [dims, setDims] = useState([]);
  const tok = useRef(0);

  useEffect(() => {
    let alive = true; setDoc(null); setErr(null);
    loadPdfjs().then(lib => lib.getDocument({ url: file, isEvalSupported: false }).promise)
      .then(d => { if (alive) setDoc(d); })
      .catch(() => { if (alive) setErr('לא הצלחנו לטעון את הקובץ כאן.'); });
    return () => { alive = false; };
  }, [file]);

  useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const upd = () => setWidth(Math.max(200, el.clientWidth - 24));
    upd();
    let t; const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(upd, 150); });
    ro.observe(el);
    return () => { ro.disconnect(); clearTimeout(t); };
  }, []);

  useEffect(() => {
    if (!doc || !width) return;
    const my = ++tok.current;
    (async () => {
      const w = width * zoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const ds = [];
      for (let n = 1; n <= doc.numPages; n++) {
        const pg = await doc.getPage(n); if (my !== tok.current) return;
        const vp0 = pg.getViewport({ scale: 1 });
        const vp = pg.getViewport({ scale: (w / vp0.width) * dpr });
        ds[n - 1] = { w, h: w * vp0.height / vp0.width };
        setDims([...ds]);
        const holder = pageRefs.current[n - 1]; if (!holder) continue;
        const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
        await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        if (my !== tok.current) return;
        const old = holder.querySelector('canvas'); if (old) old.replaceWith(cv); else holder.prepend(cv);
      }
    })().catch(() => { if (my === tok.current) setErr('הקובץ נטען, אבל הצגת העמודים נכשלה.'); });
  }, [doc, width, zoom]);

  useEffect(() => {
    if (!follow || !page || !doc) return;
    const el = pageRefs.current[page - 1], box = boxRef.current;
    if (el && box) box.scrollTo({ top: el.offsetTop - 12, behavior: 'smooth' });
  }, [page, follow, doc, dims.length >= (page || 0)]);

  const onScroll = () => {
    const box = boxRef.current; if (!box) return;
    const mid = box.scrollTop + box.clientHeight * 0.35; let cur = 1;
    pageRefs.current.forEach((el, k) => { if (el && el.offsetTop <= mid) cur = k + 1; });
    onPage && onPage(cur, doc ? doc.numPages : 0);
  };
  useEffect(() => { if (doc) onPage && onPage(1, doc.numPages); }, [doc]);

  return (
    <div ref={boxRef} className="pdf-scroll" onScroll={onScroll} dir="ltr">
      {err && <div className="callout callout-pit" dir="rtl">{err} אפשר לפתוח אותו בלשונית חדשה בכפתור למעלה.</div>}
      {!err && !doc && <div className="c-muted text-sm p-4 flex items-center gap-2" dir="rtl"><span className="dot pulse-dot" style={{ background: 'var(--accent)' }} />טוען את הקובץ…</div>}
      {doc && Array.from({ length: doc.numPages }, (_, k) => (
        <div key={k} ref={el => (pageRefs.current[k] = el)} className="pdf-page" style={{ width: dims[k] ? dims[k].w : width * zoom, minHeight: dims[k] ? dims[k].h : width * zoom * 1.3 }}>
          <span className="pg">{k + 1}</span>
        </div>
      ))}
    </div>
  );
}

          <div className="tabbar !p-1 w-fit" role="tablist" aria-label="בחירת חומר מקורי">
            {options.map(([k, t]) => <button key={k} role="tab" aria-selected={view === k} className="tab !py-1.5 !text-sm" onClick={() => setView(k)}>{t}</button>)}
          </div>
        </div>
      )}
      {isLec && (
        <div className="px-3 py-1.5 border-b border-line flex flex-wrap gap-x-4 gap-y-1 text-sm">
          <a className="c-accent font-semibold" href={file} target="_blank" rel="noopener">פתיחה בלשונית חדשה ↗</a>
        </div>
      )}
      <PdfView key={file} file={file} page={slides ? slidePage : page} follow={follow} zoom={zoom} onPage={(c, n) => setPg([c, n])} />
    </div>
  );
}

function SourceToggle({ on, setOn, kind }) {
  const label = kind === 'lecture' ? (on ? 'הסתר סיכום' : 'הצג סיכום מקורי') : (on ? 'הסתר מצגת' : 'הצג מצגת תרגול');
  return (
    <button className={'btn text-sm shrink-0 ' + (on ? 'btn-primary' : '')} onClick={() => setOn(!on)} aria-pressed={on}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
      {label}
    </button>
  );
}

function ThemeToggle() {
  const sysDark = () => { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } };
  const [theme, setTheme] = useState(() => store.get('theme', null) || (document.documentElement.getAttribute('data-theme')) || (sysDark() ? 'dark' : 'light'));
  const [explicit, setExplicit] = useState(() => !!store.get('theme', null));
  useEffect(() => {
    if (explicit) { document.documentElement.setAttribute('data-theme', theme); store.set('theme', theme); }
  }, [theme, explicit]);
  useEffect(() => {
    if (explicit) return;
    let mq; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
    const h = () => setTheme(document.documentElement.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'));
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, [explicit]);
  const flip = () => { setExplicit(true); setTheme(t => (t === 'dark' ? 'light' : 'dark')); };
  const dark = theme === 'dark';
  return (
    <button className="theme-switch" dir="ltr" data-theme-now={theme} onClick={flip} role="switch" aria-checked={dark} aria-label={dark ? 'מעבר למצב בהיר' : 'מעבר למצב כהה'} title={dark ? 'מצב בהיר' : 'מצב כהה'}>
      <span className="knob" />
      <span className="opt" data-on={!dark}>{Ico.sun}</span>
      <span className="opt" data-on={dark}>{Ico.moon}</span>
    </button>
  );
}

function App() {
  const initialTab = (() => { const h = (location.hash || '').slice(1); return TABS.some(t => t.k === h) ? h : 'lecture'; })();
  const [tab, setTab] = useState(initialTab);
  const [labStep, setLabStep] = usePersist('labStep', 0);
  const [drawer, setDrawer] = useState(false);
  const [progress, setProgress] = usePersist('progress', { lec: {}, tut: {}, ex: {} });
  const [ai, setAi] = useState({ status: 'loading', fn: null });
  const [splitLec, setSplitLec] = useState(false);
  const [splitTut, setSplitTut] = useState(false);
  const [lecIdx, setLecIdx] = useState(0);
  const [lec2Idx, setLec2Idx] = useState(0);
  const [lecWhich, setLecWhich] = usePersist('lecWhich', 'l1');
  const [tutIdx, setTutIdx] = useState(0);
  const split = (tab === 'lecture' && splitLec) || (tab === 'tutorial' && splitTut);

  useEffect(() => {
    let alive = true; const c = window.claude;
    if (!c || typeof c.use !== 'function') { setAi({ status: 'off', fn: null }); return; }
    c.use('sample').then(fn => { if (alive) setAi(fn ? { status: 'on', fn } : { status: 'off', fn: null }); }).catch(() => { if (alive) setAi({ status: 'off', fn: null }); });
    return () => { alive = false; };
  }, []);

  const ctx = {
    progress, ai,
    setAiBlocked: () => setAi({ status: 'blocked', fn: null }),
    setDone: (scope, k, v) => setProgress(p => ({ ...p, [scope]: { ...p[scope], [k]: v } })),
    setEx: (id, patch) => setProgress(p => ({ ...p, ex: { ...p.ex, [id]: { ...(p.ex[id] || {}), ...patch } } })),
  };
  const go = k => { setTab(k); try { history.replaceState(null, '', '#' + k); } catch (e) {} window.scrollTo({ top: 0 }); };
  const goLab = id => { const k = EXERCISES.findIndex(e => e.id === id); setLabStep(k >= 0 ? k + 1 : 0); setTab('lab'); try { history.replaceState(null, '', '#lab'); } catch (e) {} window.scrollTo({ top: 0 }); };

  return (
    <Ctx.Provider value={ctx}>
      <div dir="rtl" className={'mx-auto py-4 sm:py-6 lg:flex lg:gap-7 ' + (split ? 'max-w-none' : 'max-w-[1320px]')}>
        <aside className={(split ? 'hidden' : 'hidden lg:block') + ' w-[272px] shrink-0'}>
          <div className="sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 24px)' }}><Rail /></div>
        </aside>

        {drawer && (
          <div className="fixed inset-0 z-50 lg:hidden" role="dialog" aria-modal="true">
            <div className="absolute inset-0" style={{ background: 'rgba(8,12,20,.45)' }} onClick={() => setDrawer(false)} />
            <div className="absolute top-0 bottom-0 right-0 w-[86%] max-w-[330px] overflow-y-auto p-4" style={{ background: 'var(--bg)', paddingTop: 'calc(env(safe-area-inset-top, 0px) + 16px)', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))', paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 16px)' }}>
              <Rail onClose={() => setDrawer(false)} />
            </div>
          </div>
        )}

        <main className="flex-1 min0">
          <header className="grid gap-4">
            <div className="flex items-center gap-3">
              <button className="btn lg:hidden !p-2" onClick={() => setDrawer(true)} aria-label="מפת הסמסטר">{Ico.menu}</button>
              <div className="kicker min0">שבוע 01 · הרצאה 1 (18.10.2026) · הרצאה 2 (21.10.2026) · תרגול 1 · תגבור 1</div>
              <div className="ms-auto flex items-center gap-2"><span className="hidden sm:inline text-sm c-muted">ערכת צבעים</span><ThemeToggle /></div>
            </div>
            <div>
              <h1 className="font-display text-[2rem] sm:text-[2.6rem] leading-[1.1]">מבוא ורדוקציות</h1>
              <p className="mt-2 c-muted max-w-[62ch]">איך פותרים בעיה חדשה בעזרת אלגוריתם שכבר קיים, ואיך מוכיחים שזה עובד, <span className="hl" style={{ color: 'var(--ink)' }}>לכל קלט</span>.</p>
            </div>
          </header>
          <div className="sticky z-40 mt-5 mb-6 py-2" style={{ top: 'env(safe-area-inset-top, 0px)', background: 'var(--bg)' }}>
            <div className="flex items-center gap-2">
            <div className="tabbar flex-1 min0" role="tablist">
              {TABS.map(t => (
                <button key={t.k} role="tab" aria-selected={tab === t.k} className="tab" onClick={() => go(t.k)}>
                  {t.label}<span className="hidden sm:inline font-normal c-muted text-sm">· {t.sub}</span>{t.star && <span className="star">★</span>}
                </button>
              ))}
            </div>
            {tab === 'lecture' && <SourceToggle kind="lecture" on={splitLec} setOn={setSplitLec} />}
            {tab === 'tutorial' && <SourceToggle kind="tutorial" on={splitTut} setOn={setSplitTut} />}
            </div>
          </div>
                    <div className={split ? 'grid lg:grid-cols-2 gap-6 items-start' : ''}>
            <div className="min0">
              {tab === 'lecture' && <LecturesTab which={lecWhich} setWhich={setLecWhich} goLab={goLab} goTab={go} onIndex1={setLecIdx} onIndex2={setLec2Idx} />}
              {tab === 'tutorial' && <TutorialTab goLab={goLab} goTab={go} onIndex={setTutIdx} />}
            </div>
            {split && (
              <div className="min0 order-first lg:order-none lg:sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 84px)' }}>
                {tab === 'lecture'
                  ? <SourcePanel key={lecWhich} kind="lecture" lecture={lecWhich} page={lecWhich === 'l2' ? LEC2_PAGES[(LEC2_SECTIONS[lec2Idx] || [])[0]] : LEC_PAGES[(LEC_SECTIONS[lecIdx] || [])[0]]} />
                  : <SourcePanel kind="tutorial" page={TUT_PAGES[(TUT_SECTIONS[tutIdx] || [])[0]]} slidePage={TUT_SLIDE_PAGES[(TUT_SECTIONS[tutIdx] || [])[0]]} />}
              </div>
            )}
          </div>
          {tab === 'lab' && <LabTab step={labStep} setStep={setLabStep} />}
          <footer className="mt-10 mb-6 text-sm c-muted text-center">החומר מבוסס על הרצאה 1, תרגול 1, תגבור 1 ומבחני העבר בפרויקט. טיוטות והתקדמות נשמרות רק בדפדפן הזה.</footer>
        </main>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
