<style>
/* Layout: sticky semester rail on the start (right) side, a reading column with three tabs, and a full-width proof workbench in the lab. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --sunken:#E4E9F0;
  --ink:#152238; --muted:#5A6577; --line:#D3DAE4; --line-strong:#B7C1CF;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DDF1EF; --accent-strong:#075A56;
  --mark:#E9A825; --mark-soft:#FCEFCF; --mark-ink:#6B4A00;
  --tip:#2D7A4A; --tip-soft:#E2F2E8;
  --intuit:#5B47B8; --intuit-soft:#ECE8FA;
  --behind:#A55418; --behind-soft:#F7E8DB;
  --pit:#B3263E; --pit-soft:#FAE3E7;
  --term:#14202F; --term-ink:#D7E2EE; --term-dim:#7F90A6;
  --shadow:0 1px 2px rgba(21,34,56,.06),0 6px 20px rgba(21,34,56,.06);

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C121C; --surface:#131B28; --surface-2:#182231; --sunken:#0F1723;
    --ink:#E4EAF2; --muted:#93A0B4; --line:#253246; --line-strong:#34445C;
    --accent:#3BBDB4; --accent-ink:#06211F; --accent-soft:#12302F; --accent-strong:#6FD6CE;
    --mark:#F0B941; --mark-soft:#33290F; --mark-ink:#F6D58A;
    --tip:#5CC98A; --tip-soft:#13281C;
    --intuit:#A897F2; --intuit-soft:#211C3A;
    --behind:#E89A5E; --behind-soft:#2E1F12;
    --pit:#F07A8E; --pit-soft:#341820;
    --term:#070C14; --term-ink:#D7E2EE; --term-dim:#6E7F96;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C121C; --surface:#131B28; --surface-2:#182231; --sunken:#0F1723;
  --ink:#E4EAF2; --muted:#93A0B4; --line:#253246; --line-strong:#34445C;
  --accent:#3BBDB4; --accent-ink:#06211F; --accent-soft:#12302F; --accent-strong:#6FD6CE;
  --mark:#F0B941; --mark-soft:#33290F; --mark-ink:#F6D58A;
  --tip:#5CC98A; --tip-soft:#13281C;
  --intuit:#A897F2; --intuit-soft:#211C3A;
  --behind:#E89A5E; --behind-soft:#2E1F12;

html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:var(--f-body); font-size:16px; line-height:1.7;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));

}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{text-wrap:balance}
.font-display{font-family:var(--f-display);font-weight:400;letter-spacing:.005em}
.math{font-family:var(--f-mono);font-size:.9em;padding:0 .2em;color:var(--ink);overflow-wrap:anywhere;font-variant-ligatures:none}

.kicker{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lift{box-shadow:var(--shadow)}
.def{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;position:relative;padding:1.25rem 1rem .9rem}
.def-tag{position:absolute;top:-.7rem;inset-inline-start:.9rem;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;padding:.1rem .55rem;border-radius:4px}
.prose-he p{margin:.55rem 0}
.prose-he ul{list-style:disc;padding-inline-start:1.3rem;margin:.4rem 0}
.prose-he ol{list-style:decimal;padding-inline-start:1.4rem;margin:.4rem 0}
.prose-he li{margin:.2rem 0}
.prose-he strong{font-weight:600}
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:10px;padding:.5rem .95rem;font-weight:600;font-size:.92rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
.hl{background:linear-gradient(transparent 58%, var(--mark-soft) 58%);padding:0 .1em}
.callout{border-radius:12px;padding:.85rem 1rem;border:1px solid}
.callout-tip{background:var(--tip-soft);border-color:var(--tip)}
.callout-intuit{background:var(--intuit-soft);border-color:var(--intuit)}
.callout-behind{background:var(--behind-soft);border-color:var(--behind)}
.callout-pit{background:var(--pit-soft);border-color:var(--pit)}
.c-tip{color:var(--tip)} .c-intuit{color:var(--intuit)} .c-behind{color:var(--behind)} .c-pit{color:var(--pit)} .c-accent{color:var(--accent)} .c-muted{color:var(--muted)} .c-mark{color:var(--mark-ink)}
.tabbar{display:flex;gap:.25rem;padding:.3rem;border-radius:12px;background:var(--sunken);border:1px solid var(--line);overflow-x:auto}
.tab{white-space:nowrap;padding:.5rem .9rem;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;border:1px solid transparent;font-size:.95rem;display:flex;align-items:center;gap:.45rem}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.tab .star{color:var(--mark)}
.term{background:var(--term);color:var(--term-ink);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.term-bar{display:flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-bottom:1px solid rgba(255,255,255,.07);font-family:var(--f-mono);font-size:.78rem;color:var(--term-dim);flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.field{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;width:100%;padding:.75rem .85rem;font-family:var(--f-body);font-size:.98rem;line-height:1.65;resize:vertical;min-height:7.5rem}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.symkey{font-family:var(--f-mono);min-width:2.1rem;height:2.1rem;padding:0 .4rem;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.95rem}
.symkey:hover{border-color:var(--accent);color:var(--accent)}
.step-num{font-family:var(--f-mono);font-weight:700;font-size:.8rem;width:2rem;height:2rem;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--ink);color:var(--surface)}
.pipe-node{border:1px solid var(--line-strong);border-radius:10px;padding:.55rem .7rem;background:var(--surface);cursor:pointer;text-align:center;min-width:0;transition:all .2s}
.pipe-node.box{background:var(--surface-2);border-style:dashed}
.pipe-node.bb{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pipe-node[data-active="true"]{border-color:var(--mark);box-shadow:0 0 0 3px var(--mark-soft);transform:translateY(-2px)}
.pipe-node.bb[data-active="true"]{box-shadow:0 0 0 3px var(--mark)}
.svg-ink{fill:var(--ink)} .svg-muted{fill:var(--muted)} .svg-surface{fill:var(--surface)} .svg-surface2{fill:var(--surface-2)}
.stroke-line{stroke:var(--line-strong)} .stroke-accent{stroke:var(--accent)} .stroke-mark{stroke:var(--mark)} .stroke-ink{stroke:var(--ink)}
.review-block{border-radius:10px;padding:.7rem .9rem;border:1px solid var(--line)}
.rv-good{background:var(--tip-soft);border-color:var(--tip)}
.rv-bad{background:var(--pit-soft);border-color:var(--pit)}
.rv-tip{background:var(--mark-soft);border-color:var(--mark)}
.rv-verdict{background:var(--surface-2);border-color:var(--line-strong)}
.rv-next{background:var(--intuit-soft);border-color:var(--intuit)}
.review-block h4{font-weight:700;margin-bottom:.25rem}
.review-block ul{list-style:disc;padding-inline-start:1.2rem}
.review-block li{margin:.2rem 0}
.shake{animation:shake .35s}

.pulse-dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.min0{min-width:0}
.scroll-x{overflow-x:auto}
.toc a{color:var(--muted);text-decoration:none}
.toc a:hover{color:var(--accent)}
.rail-week[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.progress-track{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.slide-in{animation:slideIn .32s ease-out}
@keyframes slideIn{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
.theme-switch{position:relative;display:inline-flex;align-items:center;gap:0;height:2.35rem;padding:.2rem;border-radius:999px;border:1px solid var(--line-strong);background:var(--sunken);cursor:pointer;flex:none}
.theme-switch .opt{position:relative;z-index:1;width:2rem;height:1.9rem;display:grid;place-items:center;border-radius:999px;color:var(--muted);transition:color .2s}
.theme-switch .opt[data-on="true"]{color:var(--ink)}
.theme-switch .knob{position:absolute;top:.2rem;width:2rem;height:1.9rem;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);transition:inset-inline-start .25s;inset-inline-start:.2rem}
.theme-switch[data-theme-now="dark"] .knob{inset-inline-start:calc(.2rem + 2rem)}
.seg{display:flex;align-items:center;gap:.4rem;white-space:nowrap;padding:.38rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.85rem;font-weight:600;cursor:pointer}
.seg:hover{color:var(--ink);border-color:var(--line-strong)}
.seg[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg .n{font-family:var(--f-mono);font-size:.72rem}
.navbtn{flex:1;min-width:0;display:flex;flex-direction:column;gap:.1rem;padding:.85rem 1.1rem;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-align:start;transition:border-color .15s,background .15s,transform .1s}
.navbtn:hover{border-color:var(--accent)}
.navbtn:active{transform:translateY(1px)}
.navbtn.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-align:end;align-items:flex-end}
.navbtn.next:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.navbtn .lbl{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.4rem}
.navbtn .sub{font-size:.82rem;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.src-panel{height:62vh;display:flex;flex-direction:column}
@media (min-width:1024px){.src-panel{height:calc(100vh - 104px)}}
.pdf-scroll{flex:1;overflow:auto;background:var(--sunken);padding:12px;border-radius:0 0 14px 14px}
.pdf-page{margin:0 auto 12px;background:#fff;box-shadow:var(--shadow);border-radius:4px;overflow:hidden;position:relative}
.pdf-page canvas{display:block;width:100%;height:auto}
.pdf-page .pg{position:absolute;bottom:6px;inset-inline-end:8px;font-family:var(--f-mono);font-size:.7rem;background:rgba(20,32,47,.75);color:#fff;padding:0 .4rem;border-radius:4px}
.qed{display:inline-block;width:.7em;height:.7em;border:1.5px solid currentColor;vertical-align:-.05em}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  get(k, d) { try { const v = localStorage.getItem(NS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }

function usePersist(key, init) {
  const [v, setV] = useState(() => store.get(key, init));

   =================================================================== */
function mathNodes(s) {
  const parts = []; let last = 0; const re = /([_^])(?:\{([^}]*)\}|([A-Za-z0-9]))/g; let m;
  while ((m = re.exec(s))) {
    if (m.index > last) parts.push(s.slice(last, m.index));
    const c = m[2] != null ? m[2] : m[3];
    parts.push(m[1] === '_' ? <sub key={m.index}>{c}</sub> : <sup key={m.index}>{c}</sup>);
    last = re.lastIndex;

  if (last < s.length) parts.push(s.slice(last));
  return parts;
}
const M = ({ children }) => <bdi dir="ltr" className="math">{typeof children === 'string' ? mathNodes(children) : children}</bdi>;

function inline(s, keyBase = 'i') {
  const out = []; const re = /(\$[^$]+\$|\*\*[^*]+\*\*|`[^`]+`)/g; let last = 0; let m; let k = 0;

    else if (t[0] === '*') out.push(<strong key={keyBase + k++}>{inline(t.slice(2, -2), keyBase + k)}</strong>);

  const blocks = text.trim().split(/\n\s*\n/);

        const lines = b.split('\n');

      })}

const SG_NODES = [
  { w: 'THE', x: 70, y: 50 }, { w: 'HEA', x: 210, y: 50 }, { w: 'EAT', x: 350, y: 50 },
  { w: 'EAM', x: 70, y: 180 }, { w: 'TEA', x: 210, y: 180 }, { w: 'ATE', x: 350, y: 180 },

const canFollow = (a, b) => a.slice(1) === b.slice(0, 2);
function edgePts(a, b, hw = 36, hh = 17) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const t1 = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  const t2 = Math.min(dx ? (hw + 6) / Math.abs(dx) : Infinity, dy ? (hh + 6) / Math.abs(dy) : Infinity);
  return { x1: a.x + dx * t1, y1: a.y + dy * t1, x2: b.x - dx * t2, y2: b.y - dy * t2 };
}
function SubstringPlayground() {
  const [path, setPath] = useState([]);
  const [msg, setMsg] = useState(null);
  const [showEdges, setShowEdges] = useState(true);
  const [shakeW, setShakeW] = useState(null);

  SG_NODES.forEach(a => SG_NODES.forEach(b => { if (a !== b && canFollow(a.w, b.w)) edges.push([a, b]); }));
  const built = path.length ? path[0] + path.slice(1).map(w => w[2]).join('') : '';
  const done = path.length === SG_NODES.length;
  const onPath = (a, b) => { for (let i = 0; i + 1 < path.length; i++) if (path[i] === a && path[i + 1] === b) return true; return false; };
  function click(w) {
    if (done) return;
    if (path.includes(w)) { setMsg({ bad: true, t: `${w} כבר במסלול. במסלול המילטון כל קודקוד מופיע בדיוק פעם אחת.` }); return; }
    if (path.length) {
      const last = path[path.length - 1];
      if (!canFollow(last, w)) {
        setShakeW(w); setTimeout(() => setShakeW(null), 400);
        setMsg({ bad: true, t: `אין קשת ${last} → ${w}: שתי האותיות האחרונות של ${last} הן "${last.slice(1)}", אבל ${w} מתחילה ב-"${w.slice(0, 2)}".` });
        return;

    }
    const np = [...path, w]; setPath(np);
    if (np.length === SG_NODES.length) setMsg({ bad: false, t: 'מסלול המילטון! עברתם בכל קודקוד בדיוק פעם אחת.' });

          <div className="text-sm c-muted">קלט: ATE, EAT, TEA, EAM, THE, HEA. לחצו על קודקודים לפי הסדר.</div>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button className="btn text-sm" onClick={() => { setPath(p => p.slice(0, -1)); setMsg(null); }} disabled={!path.length}>בטל צעד</button>
          <button className="btn text-sm" onClick={() => { setPath([]); setMsg(null); }}>התחל מחדש</button>
          <button className="btn btn-ghost text-sm" onClick={() => setShowEdges(s => !s)}>{showEdges ? 'הסתר קשתות' : 'הצג קשתות'}</button>
        </div>
      </div>
      <div className="mt-3 scroll-x" dir="ltr">
        <svg viewBox="0 0 420 230" className="w-full max-w-[520px] mx-auto block" role="img" aria-label="גרף המחרוזות">

            <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style={{ fill: 'var(--accent)' }} /></marker>
          </defs>

          })}

          {DC_V.map(v => <button key={v} className="chip font-mono" style={target === v ? { background: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--ink)' } : {}} onClick={() => setTarget(v)}>{v}</button>)}
        </div>
      </div>
      <div className="mt-3 grid md:grid-cols-[1fr_1.25fr] gap-4 items-start">
        <div className="min0">
          <div className="kicker">הגרף המקורי G</div>
          <svg viewBox="0 0 260 190" className="w-full max-w-[300px] block" dir="ltr" role="img" aria-label="הגרף G">
            {DC_E.map(([u, v], i) => <line key={i} x1={DC_POS_G[u][0]} y1={DC_POS_G[u][1]} x2={DC_POS_G[v][0]} y2={DC_POS_G[v][1]} strokeWidth={hotG.has(u + v) ? 3.5 : 1.8} style={{ stroke: hotG.has(u + v) ? 'var(--accent)' : 'var(--line-strong)' }} />)}
            {DC_V.map(v => <g key={v}><circle cx={DC_POS_G[v][0]} cy={DC_POS_G[v][1]} r="16" strokeWidth="1.8" style={{ fill: v === target ? 'var(--mark-soft)' : 'var(--surface)', stroke: v === target ? 'var(--mark)' : 'var(--ink)' }} /><text x={DC_POS_G[v][0]} y={DC_POS_G[v][1] + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 14 }}>{v}</text></g>)}
          </svg>
        </div>
        <div className="min0">
          <div className="kicker">G′ · עליון: V₁ (זוגי עד כה) · תחתון: V₂ (אי־זוגי עד כה)</div>
          <svg viewBox="0 0 335 195" className="w-full max-w-[420px] block" dir="ltr" role="img" aria-label="הגרף G′">
            {DC_E.flatMap(([u, v], i) => [[u + '1', v + '2'], [u + '2', v + '1']].map(([p, q], j) => {
              const a = P2(p[0], p[1]), b = P2(q[0], q[1]); const hot = hotPrime.has(p + '|' + q);
              return <line key={i + '-' + j} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} strokeWidth={hot ? 3.5 : 1.4} style={{ stroke: hot ? 'var(--accent)' : 'var(--line-strong)' }} />;
            }))}
            {DC_V.flatMap(v => ['1', '2'].map(c => {
              const [x, y] = P2(v, c); const isT = v === target && c === '1'; const isS = v === 's' && c === '1';
              return <g key={v + c}><circle cx={x} cy={y} r="16" strokeWidth="1.8" style={{ fill: isT ? 'var(--mark-soft)' : isS ? 'var(--accent-soft)' : 'var(--surface)', stroke: isT ? 'var(--mark)' : 'var(--ink)' }} /><text x={x} y={y + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 13 }}>{v}<tspan fontSize="9" dy="3">{c}</tspan></text></g>;
            }))}
          </svg>
        </div>
      </div>
      <div className="mt-3 text-[0.95rem] grid gap-1">
        <div>BFS מ-<M>s_1</M> ב-G′: <M>{`d(s_1, ${target}_1) = ${t1 in dist ? dist[t1] : '∞'}`}</M>. לכן אורך המסלול הזוגי הקצר ביותר מ-<M>s</M> ל-<M>{target}</M> ב-G הוא <strong>{t1 in dist ? dist[t1] : '∞'}</strong>.</div>
        <div>המסלול ב-G′: <M>{path.map(p => p[0] + '_' + p[1]).join(' → ')}</M>. אותו מסלול ב-G (מוחקים את מספר העותק): <M>{gWalk.join(' → ')}</M>.</div>
        {target === 'a' && <div className="c-behind">שימו לב: המסלול חוזר ל-<M>a</M> פעמיים. "מסלול" כאן מותר לחזור על קודקודים, ולכן משולש (מעגל באורך אי־זוגי) מאפשר "להחליף זוגיות".</div>}
      </div>
    </div>
  );
}

const LEC_SECTIONS = [

];

      </div>

class SlideBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { try { console.error(err); } catch (e) {} }
  render() {
    if (this.state.err) return (
      <div className="callout callout-pit">
        <div className="font-semibold">המסך הזה לא נטען.</div>
        <div className="mt-1 text-[0.95rem]">שאר האפליקציה ממשיכה לעבוד. עברו למסך אחר בכפתורים למטה.</div>
      </div>
    );
    return this.props.children;
  }
}

function Stepper({ scope, items, children, onFinish, finishLabel, flat, idx: cIdx, setIdx: cSet, isDone, summary, onIndexChange }) {
  const { progress } = useApp();
  const [pIdx, pSet] = usePersist('step:' + scope, 0);
  const idx = cIdx != null ? cIdx : pIdx;
  const setIdx = cSet || pSet;
  const isDoneId = id => (isDone ? isDone(id) : !!(progress[scope] || {})[id]);
  const slides = [];
  React.Children.toArray(children).forEach(ch => {
    if (flat || ch.type === Section || !slides.length) slides.push([ch]); else slides[slides.length - 1].push(ch);
  });
  const n = slides.length;
  const i = Math.min(Math.max(idx || 0, 0), n - 1);
  const topRef = useRef(null);
  const segRef = useRef(null);
  const goTo = j => { if (j < 0 || j >= n) return; setIdx(j); };
  useEffect(() => { if (onIndexChange) onIndexChange(i); }, [i]);
  const mounted = useRef(false);
  useEffect(() => {
    if (!mounted.current) { mounted.current = true; return; }
    requestAnimationFrame(() => {
      const el = topRef.current; if (!el) return;
      const top = el.getBoundingClientRect().top;
      if (top < 84 || top > window.innerHeight * .5) window.scrollTo({ top: Math.max(0, top + window.scrollY - 84), behavior: 'smooth' });
    });
  }, [i]);
  useEffect(() => {
    const h = e => {
      const t = e.target;
      if (t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(i + 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(i - 1); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [i, n]);
  useEffect(() => {
    const box = segRef.current; if (!box) return;
    const cur = box.querySelector('[aria-current="step"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }, [i]);
  const doneCount = items.filter(([id]) => isDoneId(id)).length;
  const prev = i > 0 ? items[i - 1] : null;
  const next = i < n - 1 ? items[i + 1] : null;
  return (
    <div className="grid gap-5" ref={topRef}>
      <div className="card p-3 sm:p-4 grid gap-3">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div className="flex items-baseline gap-2">
            <span className="kicker">חלק</span>
            <span className="font-display text-xl"><bdi dir="ltr">{i + 1} / {n}</bdi></span>
            <span className="font-semibold">{items[i][1]}</span>
          </div>
          <span className="text-sm c-muted">{summary || `${doneCount} מתוך ${n} סומנו כהובנו`} · אפשר לנווט גם בחצים במקלדת</span>
        </div>
        <div className="flex gap-1">
          {items.map(([id], j) => (
            <span key={id} className="h-1.5 flex-1 rounded-full" style={{ background: j === i ? 'var(--mark)' : isDoneId(id) ? 'var(--accent)' : 'var(--sunken)' }} />
          ))}
        </div>
        <div ref={segRef} className="flex gap-1.5 scroll-x pb-1" role="tablist" aria-label="חלקי השיעור">
          {items.map(([id, t], j) => (
            <button key={id} className="seg" aria-current={j === i ? 'step' : undefined} onClick={() => goTo(j)}>
              {items[j][2] || t}{isDoneId(id) && <span style={{ color: j === i ? 'var(--mark)' : 'var(--tip)' }}>{Ico.check}</span>}
            </button>
          ))}
        </div>
      </div>

      <div key={i} className="slide-in grid gap-6"><SlideBoundary>{slides[i]}</SlideBoundary></div>

      <nav className="flex gap-3 items-stretch" aria-label="ניווט בין חלקים">
        {prev ? (
          <button className="navbtn" onClick={() => goTo(i - 1)}>
            <span className="lbl"><span aria-hidden="true">→</span> הקודם</span>
            <span className="sub">{prev[1]}</span>
          </button>
        ) : <div className="flex-1" />}
        {next ? (
          <button className="navbtn next" onClick={() => goTo(i + 1)}>
            <span className="lbl">הבא <span aria-hidden="true">←</span></span>
            <span className="sub">{next[1]}</span>
          </button>
        ) : (
          <button className="navbtn next" onClick={onFinish}>
            <span className="lbl">{finishLabel} <span aria-hidden="true">←</span></span>
            <span className="sub">סיימתם את כל החלקים</span>
          </button>
        )}
      </nav>
    </div>
  );
}

      <Section id="problem" scope="lec" doneKey="problem" kicker="הרצאה 1 · עמ׳ 2" title="מה זו בעיה? מופע, פתרון ואלגוריתם">

          options={[

      <Section id="reduction" scope="lec" doneKey="reduction" kicker="הרצאה 1 · עמ׳ 3" title="רדוקציה: לפתור בעיה חדשה בעזרת אלגוריתם קיים">
        <p>רוצים לפתור בעיה <M>A</M>, ויש לנו אלגוריתם לבעיה <M>B</M>. ממירים את הקלט <M>x</M> של <M>A</M> לקלט <M>x′</M> של <M>B</M>, מריצים עליו את האלגוריתם ל-<M>B</M>, וממירים את הפלט <M>y′</M> לפלט <M>y</M> של <M>A</M>. הרדוקציה מורכבת משני אלגוריתמים: <strong>ממיר קלט</strong> ו<strong>ממיר פלט</strong>.</p>
        <ReductionPipeline />
        <Callout type="tip" title="איך מתייחסים לקופסה השחורה">
          <p>בהוכחה מניחים על האלגוריתם ל-<M>B</M> דבר אחד בלבד: שהוא פותר נכון את <M>B</M> לכל מופע. לא איך הוא עובד, ולא <em>איזה</em> פתרון הוא יחזיר כשיש כמה. אם יש שני מסלולים קצרים ביותר, ההוכחה צריכה לעבוד לא משנה איזה מהם יחזור.</p>
        </Callout>
        <Callout type="behind" title="למה זו טכניקה כל כך חזקה?">
          <p>כדי לבנות רדוקציה לא צריך לדעת איך פותרים את <M>B</M>. כל אלגוריתם שתלמדו בהמשך הקורס (BFS, Dijkstra, זרימה ועוד) הופך לכלי שאפשר להפעיל על בעיות חדשות, בלי לתכנן אותו מחדש.</p>
        </Callout>
      </Section>

      <Section id="example-sp" scope="lec" doneKey="example-sp" kicker="הרצאה 1 · עמ׳ 3–4" title="דוגמה ראשונה: מסלול קצר ביותר בגרף לא מכוון">
        <p>נתון אלגוריתם יעיל שמוצא מסלול קצר ביותר בין שני קודקודים בגרף <strong>מכוון</strong>. איך נמצא בעזרתו מסלול קצר ביותר בגרף <strong>לא מכוון</strong>? מחליפים כל צלע בשתי קשתות מכוונות, אחת לכל כיוון.</p>
        <Def tag="פירוט הרדוקציה">
          <p><strong>ממיר הקלט:</strong> בהינתן גרף לא מכוון <M>G = (V, E)</M> וקודקודים <M>s, t ∈ V</M>, מחזירים את הגרף המכוון <M>G′ = (V, E′)</M> ואת אותם <M>s, t</M>, כאשר</p>
          <p className="text-center"><M>{"E′ = { (u,v), (v,u) : {u,v} ∈ E }"}</M></p>
          <p><strong>ממיר הפלט:</strong> מחזירים את הפלט של האלגוריתם ללא שינוי.</p>
          <p><strong>האלגוריתם:</strong> (1) מריצים את ממיר הקלט ומקבלים <M>G′, s, t</M>. (2) מוצאים מסלול קצר ביותר מ-<M>s</M> ל-<M>t</M> ב-<M>G′</M>. (3) מחזירים את המסלול, או "לא קיים".</p>
        </Def>
        <Def tag="משפט + טענת עזר">
          <p><strong>משפט:</strong> האלגוריתם מחזיר מסלול קצר ביותר מ-<M>s</M> ל-<M>t</M> ב-<M>G</M>, אם קיים.</p>
          <p><strong>טענת עזר:</strong> <M>P</M> הוא מסלול באורך <M>ℓ</M> מ-<M>s</M> ל-<M>t</M> ב-<M>G</M> אם ורק אם <M>P</M> הוא מסלול באורך <M>ℓ</M> מ-<M>s</M> ל-<M>t</M> ב-<M>G′</M>.</p>
        </Def>
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: 'var(--mark-soft)', borderColor: 'var(--mark)' }}>
          <div><strong>ההרצאה לא הוכיחה את המשפט.</strong> זה בדיוק התרגיל הראשון במעבדה.</div>
          <button className="btn btn-primary text-sm" onClick={() => goLab('e1')}>לתרגיל 1 במעבדה</button>
        </div>
        <Def tag="ניתוח זמן ריצה">
          <ul>
            <li>ממיר הקלט: שתי קשתות לכל צלע, <M>O(|V| + |E|)</M>.</li>
            <li>מציאת המסלול: BFS, <M>O(|V| + |E|)</M>.</li>
            <li>ממיר הפלט: <M>O(1)</M>. סך הכול <M>O(|V| + |E|)</M>.</li>
          </ul>
        </Def>
        <IntuitionCheck
          q="למה מספיק שממיר הפלט יחזיר את המסלול בלי שום שינוי?"
          options={[
            { t: 'כי כל מסלול ב-G′ הוא גם מסלול ב-G, עם אותה סדרת קודקודים ואותו אורך.', correct: true, why: 'קבוצת הקודקודים זהה, וכל קשת (u,v) ב-E′ באה מצלע {u,v} ב-E. לכן אין צורך "לתרגם" כלום. זה כיוון ⇐ של טענת העזר.' },
            { t: 'כי BFS תמיד מחזיר מסלול פשוט.', correct: false, why: 'אסור להניח איך הקופסה השחורה עובדת. ההצדקה צריכה לבוא ממבנה G′, לא מ-BFS.' },
            { t: 'כי G′ קטן יותר מ-G.', correct: false, why: 'למעשה ב-G′ יש פי שניים קשתות. הגודל לא קשור לשאלה.' },
          ]}
        />
        <Callout type="pit" title="קשת לכיוון אחד בלבד">
          <p>אילו ממיר הקלט היה הופך כל צלע לקשת <em>אחת</em> בכיוון שרירותי, כיוון ⇒ של טענת העזר היה נשבר: מסלול ב-<M>G</M> שעובר בצלע "נגד הכיוון" לא היה קיים ב-<M>G′</M>, והקופסה הייתה עלולה לא למצוא את המסלול הקצר ביותר.</p>
        </Callout>
      </Section>

      <Section id="formal" scope="lec" doneKey="formal" kicker="הרצאה 1 · עמ׳ 4" title="ההגדרה הפורמלית של רדוקציה">
        <Def>
          <p>תהיינה <M>A</M> ו-<M>B</M> שתי בעיות. <strong>רדוקציה מ-A ל-B</strong> היא זוג אלגוריתמים <M>f, g</M> כך ש:</p>
          <ul>
            <li><M>f</M> הוא <strong>ממיר הקלט</strong>: ממיר מופע של <M>A</M> למופע של <M>B</M>.</li>
            <li><M>g</M> הוא <strong>ממיר הפלט</strong>: מקבל את הקלט לבעיה <M>A</M> ואת הפתרון למופע המתאים של <M>B</M>, ומחזיר פתרון למופע של <M>A</M>.</li>
          </ul>
          <p><strong>האלגוריתם:</strong> (1) עבור מופע <M>x</M> של <M>A</M>, מחשבים <M>f(x)</M>. (2) מחשבים פתרון <M>y</M> למופע <M>f(x)</M> של <M>B</M>. (3) מחזירים את <M>g(x, y)</M>.</p>
          <p><strong>נכונות הרדוקציה:</strong> לכל מופע <M>x</M> של <M>A</M>, <span className="hl">אם <M>y</M> הוא פתרון</span> למופע <M>f(x)</M> של <M>B</M>, אז <M>g(x, y)</M> הוא פתרון למופע <M>x</M> של <M>A</M>.</p>
        </Def>
        <Callout type="behind" title="למה g מקבל גם את x?">
          <p>לעתים קרובות הפתרון של <M>B</M> חסר משמעות בלי ההקשר המקורי. ב-SEP ← SP מהתרגול, ממיר הפלט צריך לדעת אילו קודקודים ב-<M>G′</M> הם העותקים <M>u_1</M> של קודקודי <M>V</M>. בתרגול כותבים <M>g(b)</M> בלבד, ובהרצאה <M>g(x, y)</M>. ההגדרה של ההרצאה כללית יותר, ובטוח יותר לכתוב אותה.</p>
        </Callout>
        <Callout type="behind" title="'אם y הוא פתרון' פירושו: לכל פתרון">
          <p>ההגדרה לא אומרת "קיים פתרון y שעבורו g עובד". היא דורשת ש-<M>g</M> יעבוד על <strong>כל</strong> פתרון שהקופסה עשויה להחזיר. אם ל-<M>f(x)</M> יש שני פתרונות אופטימליים ורק אחד מהם מתורגם נכון, הרדוקציה שגויה. שאלה 3 בבוחן האמצע של 2023 בנויה בדיוק על זה, והיא במעבדה כתרגיל 7.</p>
        </Callout>
        <Callout type="pit" title="זמן הריצה של הקופסה נמדד על f(x)">
          <p>בניתוח זמן הריצה צריך להביא בחשבון את <strong>גודל</strong> הקלט שמזינים לאלגוריתם ל-<M>B</M>, כלומר את <M>|f(x)|</M>, ואז לבטא אותו במונחי הקלט המקורי.</p>
        </Callout>
        <IntuitionCheck
          q="ממיר הקלט הופך גרף עם n קודקודים לגרף עם n² קודקודים. הקופסה השחורה רצה בזמן O(N log N) על גרף עם N קודקודים. מה זמן הריצה שלה במונחי n?"
          options={[
            { t: 'O(n log n)', correct: false, why: 'זה הזמן על הקלט המקורי, אבל הקופסה לא רצה עליו. היא רצה על f(x).' },
            { t: 'O(n² log n)', correct: true, why: 'מציבים N = n²: O(n² log n²) = O(2n² log n) = O(n² log n).' },
            { t: 'O(n²)', correct: false, why: 'שכחתם את גורם ה-log. log(n²) = 2 log n, וזה לא קבוע.' },
          ]}
        />
      </Section>

      <Section id="substrings" scope="lec" doneKey="substrings" kicker="הרצאה 1 · עמ׳ 5" title="בעיית תתי־המחרוזות">
        <Def tag="הבעיה">
          <p><strong>קלט:</strong> אוסף של <M>n</M> מחרוזות, כל אחת באורך 3. דוגמה: <M>GUR, URI, NGU, BEN, ION, ENG, RIO</M>.</p>
          <p><strong>פלט חוקי:</strong> מחרוזת באורך <M>n + 2</M> שמחרוזות הקלט הן <strong>בדיוק</strong> כל תתי־המחרוזות שלה באורך 3. בדוגמה: <M>BENGURION</M>.</p>
          <p><strong>גרסת ההכרעה:</strong> "כן" אם קיימת מחרוזת כזו, ו"לא" אחרת. <strong>הנחה מפשטת:</strong> כל מחרוזת מופיעה בקלט פעם אחת בלבד.</p>
        </Def>
        <p>דרך נוספת לראות את הבעיה: מישהו החזיק מחרוזת באורך <M>n + 2</M>, גזר ממנה את כל תתי־המחרוזות באורך 3 ונתן לנו אותן בסדר כלשהו. המוטיבציה: ריצוף גנום.</p>
        <p><strong>פתרון נאיבי:</strong> בודקים את כל <M>n!</M> הסידורים. סידור מתאים אם שתי האותיות האחרונות של כל מחרוזת הן שתי האותיות הראשונות של המחרוזת שאחריה. זה לא יעיל: <M>{"n! = 2^{Θ(n log n)}"}</M>.</p>
        <Def tag="הגדרה">
          <p>מחרוזת <M>w_j</M> <strong>יכולה להופיע אחרי</strong> מחרוזת <M>w_i</M> אם שתי האותיות האחרונות של <M>w_i</M> הן שתי האותיות הראשונות של <M>w_j</M>.</p>
        </Def>
        <p>מייצגים בגרף אילו מחרוזות יכולות להופיע זו אחרי זו. נסו בעצמכם על הדוגמה מההרצאה:</p>
        <SubstringPlayground />
        <Callout type="tip" title="התנועה החשובה של השבוע">
          <p>כשיש יחס בין פריטים ("מי יכול לבוא אחרי מי"), זה סימן לגרף מכוון: הפריטים הם קודקודים והיחס הוא הקשתות. שאלה על <em>סידור</em> של כל הפריטים הופכת לשאלה על <em>מסלול</em> שעובר בכולם.</p>
        </Callout>
        <IntuitionCheck
          q="איפה ההנחה 'כל מחרוזת מופיעה בקלט פעם אחת' באמת עוזרת?"
          options={[
            { t: 'היא מבטיחה שיש מסלול המילטון.', correct: false, why: 'היא לא מבטיחה קיום של שום דבר. יש קלטים בלי פתרון גם תחת ההנחה.' },
            { t: 'בזכותה יש התאמה חד־חד־ערכית בין מחרוזות לקודקודים, וטיעון הספירה עובד: n מחרוזות שונות ובדיוק n מקומות התחלה.', correct: true, why: 'בהוכחה בהרצאה 2 משתמשים בכך ש-T באורך n+2 מכילה לכל היותר n תתי־מחרוזות שונות באורך 3, והקלט מכיל n שונות. לכן הן בדיוק אותן מחרוזות.' },
            { t: 'היא מקטינה את זמן הריצה של בניית הגרף.', correct: false, why: 'בניית הגרף היא O(n²) בכל מקרה: בודקים כל זוג מחרוזות.' },
          ]}
        />
      </Section>

      <Section id="hamilton" scope="lec" doneKey="hamilton" kicker="הרצאה 1 · עמ׳ 6" title="רדוקציה למסלול המילטון ונכונותה">
        <p>חזרנו לבעיה מתחילת השיעור. קיבלנו רדוקציה מבעיית ההכרעה של תתי־המחרוזות לבעיית <strong>קיום</strong> מסלול המילטון בגרף מכוון.</p>
        <Def tag="הרדוקציה">
          <p><strong>ממיר הקלט:</strong> קלט <M>w_1, …, w_n</M>. פלט: גרף מכוון <M>G = (V, E)</M> עם <M>{"V = {w_1, …, w_n}"}</M>, ויש קשת מ-<M>w_i</M> ל-<M>w_j</M> אם <M>w_j</M> יכולה להופיע אחרי <M>w_i</M>.</p>
          <p><strong>ממיר הפלט (הכרעה):</strong> מחזירים "כן" אם ורק אם האלגוריתם לקיום מסלול המילטון החזיר "כן".</p>
        </Def>
        <Def tag="נכונות">
          <p><strong>משפט:</strong> יש פתרון לבעיית תתי־המחרוזות אם ורק אם האלגוריתם מחזיר "כן".</p>
          <p><strong>טענה 1:</strong> אם אין פתרון לבעיה, אז אין מסלול המילטון בגרף.</p>
          <p><strong>טענה 2:</strong> אם יש פתרון לבעיה, אז קיים מסלול המילטון בגרף.</p>
          <p><strong>מהטענות למשפט:</strong></p>
          <ul>
            <li>אם יש פתרון, לפי טענה 2 יש מסלול המילטון. לכן האלגוריתם לבדיקת מסלול המילטון מחזיר "כן", וכך גם האלגוריתם שלנו.</li>
            <li>אם אין פתרון, לפי טענה 1 אין מסלול המילטון. לכן הוא מחזיר "לא", וכך גם האלגוריתם שלנו.</li>
          </ul>
        </Def>
        <Callout type="behind" title="למה טענה 1 מנוסחת 'הפוך'?">
          <p>טענה 1 היא זו שמגינה מפני "כן" שגוי. בניסוח השלילי ("אין X ⇒ אין Y") קשה לעבוד, ולכן מוכיחים את הטענה השקולה: <strong>אם יש מסלול המילטון, אז יש פתרון</strong>. כך ההוכחה הופכת לבנייה: מקבלים מסלול ובונים ממנו מחרוזת. זה בדיוק מה שעושים בהרצאה 2. כלל אצבע: טענה מהצורה "אין… ⇒ אין…" כמעט תמיד מוכחת דרך השלילה ההפוכה שלה.</p>
        </Callout>
        <Callout type="tip" title="תבנית לבעיות הכרעה">
          <p>שתי טענות עזר, אחת לכל כיוון, ואז שתי שורות שמחברות אותן לתשובה של הקופסה השחורה. שמרו את התבנית הזו; היא חוזרת בכל רדוקציה של בעיית הכרעה.</p>
        </Callout>
        <div className="grid sm:grid-cols-2 gap-3">
          <div className="card p-4 flex flex-col gap-2"><div className="kicker">נסו לבד</div><div>הוכיחו את טענה 2: ממחרוזת לפתרון למסלול המילטון.</div><button className="btn text-sm self-start" onClick={() => goLab('e2')}>לתרגיל 2</button></div>
          <div className="card p-4 flex flex-col gap-2"><div className="kicker">נסו לבד</div><div>הוכיחו את טענה 1 בניסוח השקול: ממסלול למחרוזת.</div><button className="btn text-sm self-start" onClick={() => goLab('e3')}>לתרגיל 3</button></div>
        </div>
        <Def tag="הרחבה: בעיית החיפוש">
          <p><strong>ממיר הפלט:</strong> בהינתן מסלול המילטון <M>{"w_{i1}, w_{i2}, …, w_{in}"}</M>, בונים מחרוזת באורך <M>n + 2</M>: מתחילים ב-<M>{"w_{i1}"}</M>, ומוסיפים לפי הסדר את האות האחרונה של <M>{"w_{i2}"}</M>, של <M>{"w_{i3}"}</M> וכן הלאה. אם אין מסלול המילטון, מחזירים "אין פתרון".</p>
        </Def>
        <IntuitionCheck
          q="הרדוקציה נכונה, אבל לבעיית מסלול המילטון לא ידוע אלגוריתם יעיל, ולכן האלגוריתם שקיבלנו אקספוננציאלי. מה המסקנה?"
          options={[
            { t: 'בעיית תתי־המחרוזות קשה.', correct: false, why: 'רדוקציה מ-A ל-B מראה ש-A לא קשה יותר מ-B. היא לא אומרת כלום על כך ש-A קשה.' },
            { t: 'צריך לבחור בעיית יעד אחרת, שיש לה אלגוריתם יעיל.', correct: true, why: 'זה בדיוק מה שקורה בהרצאה 2: רדוקציה למסלול אוילר, שנפתר בזמן O(|E|). קשתות במקום קודקודים.' },
            { t: 'הרדוקציה שגויה.', correct: false, why: 'הרדוקציה נכונה. נכונות ויעילות הן שתי שאלות נפרדות.' },
          ]}
        />
        <Callout type="tip" title="מה מחכה בהרצאה 2">
          <p>בנייה חדשה: כל מחרוזת תהיה <strong>קשת</strong> (מהתחילית בת שתי האותיות לסופית שלה), ומסלול שעובר בכל קשת בדיוק פעם אחת הוא מסלול אוילר. אותו רעיון, בחירה חכמה יותר של בעיית היעד.</p>
        </Callout>
      </Section>

      <div className="card p-5 sm:p-6" style={{ background: 'var(--ink)', color: 'var(--surface)', borderColor: 'var(--ink)' }}>
        <div className="kicker" style={{ color: 'var(--mark)' }}>כרטיס סיכום · הרצאה 1</div>
        <ul className="mt-2 grid gap-1.5 text-[0.98rem]" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>אלגוריתם חייב להחזיר פתרון חוקי לכל קלט שיש לו פתרון, ו"אין פתרון" לכל קלט שאין לו.</li>
          <li>רדוקציה = ממיר קלט <M>f</M> + ממיר פלט <M>g(x, y)</M>. הקופסה השחורה היא קופסה: לא מניחים עליה כלום מלבד נכונות.</li>
          <li>נכונות: לכל <M>x</M> ולכל פתרון <M>y</M> של <M>f(x)</M>, <M>g(x, y)</M> פתרון של <M>x</M>.</li>
          <li>זמן ריצה: ממיר קלט + קופסה על <M>|f(x)|</M> + ממיר פלט.</li>
          <li>הוכחה מלמעלה למטה: משפט ← טענות עזר ← המשפט מהטענות ← הוכחת הטענות.</li>
        </ul>
      </div>
    </Stepper>
  );
}

/* ===================================================================
   Interactive: Euler graph playground (lecture 2 example)
   =================================================================== */
const EU_V = { TH: [50, 60], HE: [165, 60], EA: [275, 125], AT: [385, 60], TE: [385, 190], AM: [165, 190] };
const EU_E = ['THE', 'HEA', 'EAT', 'ATE', 'TEA', 'EAM'].map(w => ({ w, a: w.slice(0, 2), b: w.slice(1) }));
function EulerPlayground() {
  const [path, setPath] = useState([]);
  const [msg, setMsg] = useState(null);
  const cur = path.length ? EU_E.find(e => e.w === path[path.length - 1]).b : null;
  const built = path.length ? path[0] + path.slice(1).map(w => w[2]).join('') : '';
  const done = path.length === EU_E.length;
  function click(e) {
    if (done) return;
    if (path.includes(e.w)) { setMsg({ bad: true, t: `הקשת ${e.w} כבר במסלול. במסלול אוילר כל קשת מופיעה בדיוק פעם אחת.` }); return; }
    if (cur && e.a !== cur) { setMsg({ bad: true, t: `המסלול נמצא עכשיו בקודקוד ${cur}, אבל הקשת ${e.w} יוצאת מ-${e.a}.` }); return; }
    const np = [...path, e.w]; setPath(np);

  }

            <marker id="earrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style={{ fill: 'var(--accent)' }} /></marker>
          </defs>

            const [ax, ay] = EU_V[e.a], [bx, by] = EU_V[e.b];

            const x1 = ax + ux * 24, y1 = ay + uy * 24, x2 = bx - ux * 29, y2 = by - uy * 29;
            const mx = (ax + bx) / 2 - uy * 15, my = (ay + by) / 2 + ux * 15;
            const idx = path.indexOf(e.w); const used = idx >= 0;
            return (
              <g key={e.w} onClick={() => click(e)} style={{ cursor: done ? 'default' : 'pointer' }}>
                <line x1={x1} y1={y1} x2={x2} y2={y2} strokeWidth="14" style={{ stroke: 'transparent' }} />
                <line x1={x1} y1={y1} x2={x2} y2={y2} strokeWidth={used ? 3 : 1.6} style={{ stroke: used ? 'var(--accent)' : 'var(--line-strong)' }} markerEnd={used ? 'url(#earrA)' : 'url(#earr)'} />

                <text x={mx} y={my + 4.5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 11.5 }}>{e.w}{used ? ` ${idx + 1}` : ''}</text>
              </g>

          })}
          {Object.entries(EU_V).map(([v, [x, y]]) => (
            <g key={v}>

              <text x={x} y={y + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 14 }}>{v}</text>

        </svg>
      </div>
      <div className="mt-3 grid gap-2">
        <div className="flex flex-wrap items-baseline gap-2">
          <span className="text-sm c-muted">המחרוזת (המחרוזת של הקשת הראשונה, ואז התו האחרון של כל קשת הבאה):</span>
          <bdi dir="ltr" className="font-mono text-lg font-bold tracking-[0.18em]">{built || '—'}</bdi>

      </div>
    </div>
  );
}

/* ===================================================================
   Interactive: greedy rules on the activity selection problem
   =================================================================== */
const GR_SETS = {
  lecture: { name: 'הדוגמה מההרצאה', opt: 3, ints: [{ id: 1, s: 2, f: 4 }, { id: 2, s: 6, f: 7 }, { id: 3, s: 3, f: 4 }, { id: 4, s: 4, f: 7 }, { id: 5, s: 5, f: 7 }, { id: 6, s: 3, f: 6 }, { id: 7, s: 1, f: 3 }] },
  short: { name: 'נגד "קצר ביותר"', opt: 2, ints: [{ id: 1, s: 0, f: 5 }, { id: 2, s: 4, f: 6 }, { id: 3, s: 5, f: 10 }] },
  first: { name: 'נגד "מתחיל ראשון"', opt: 2, ints: [{ id: 1, s: 0, f: 10 }, { id: 2, s: 1, f: 3 }, { id: 3, s: 4, f: 6 }] },
};
const GR_RULES = [['few', 'חותך הכי מעט קטעים'], ['short', 'קצר ביותר'], ['first', 'מתחיל ראשון'], ['end', 'מסתיים ראשון']];
const overlaps = (a, b) => a.s < b.f && b.s < a.f;
function runGreedy(ints, rule) {
  let A = [...ints].sort((a, b) => a.id - b.id); const S = [];
  while (A.length) {
    const key = x => rule === 'end' ? x.f : rule === 'first' ? x.s : rule === 'short' ? x.f - x.s : A.filter(y => y !== x && overlaps(x, y)).length;
    let pick = A[0]; A.forEach(x => { if (key(x) < key(pick)) pick = x; });
    S.push(pick); A = A.filter(x => !overlaps(x, pick));
  }
  return S;
}
function GreedySim() {
  const [set, setSet] = useState('lecture');
  const [rule, setRule] = useState('end');
  const data = GR_SETS[set];
  const S = useMemo(() => runGreedy(data.ints, rule), [set, rule]);
  const max = Math.max(...data.ints.map(x => x.f));
  const chosen = new Set(S.map(x => x.id));
  const good = S.length === data.opt;
  return (
    <div className="card p-4 sm:p-5" style={{ background: 'var(--surface-2)' }}>
      <div className="font-semibold">סימולטור: ארבעה כללי בחירה</div>
      <div className="mt-2 grid gap-2">
        <div className="flex flex-wrap items-center gap-2"><span className="text-sm c-muted w-16">קלט:</span>
          {Object.entries(GR_SETS).map(([k, v]) => <button key={k} className="chip" style={set === k ? { background: 'var(--accent-soft)', borderColor: 'var(--accent)', color: 'var(--ink)' } : {}} onClick={() => setSet(k)}>{v.name}</button>)}
        </div>
        <div className="flex flex-wrap items-center gap-2"><span className="text-sm c-muted w-16">כלל:</span>
          {GR_RULES.map(([k, t], i) => <button key={k} className="chip" style={rule === k ? { background: 'var(--mark-soft)', borderColor: 'var(--mark)', color: 'var(--ink)' } : {}} onClick={() => setRule(k)}>{i + 1}. {t}</button>)}
        </div>
      </div>
      <div className="mt-4 grid gap-1.5" dir="ltr">
        {data.ints.map(x => (
          <div key={x.id} className="flex items-center gap-2">
            <span className="font-mono text-xs w-6 text-right c-muted">{x.id}</span>
            <div className="relative flex-1 h-6 rounded" style={{ background: 'var(--sunken)' }}>
              <div className="absolute top-0.5 bottom-0.5 rounded flex items-center justify-center font-mono text-[0.68rem]"
                style={{ left: (x.s / max * 100) + '%', width: ((x.f - x.s) / max * 100) + '%', background: chosen.has(x.id) ? 'var(--accent)' : 'var(--surface)', color: chosen.has(x.id) ? 'var(--accent-ink)' : 'var(--muted)', border: '1px solid ' + (chosen.has(x.id) ? 'var(--accent)' : 'var(--line-strong)') }}>
                ({x.s},{x.f})
              </div>
            </div>
          </div>
        ))}
        <div className="flex items-center gap-2"><span className="w-6" /><div className="relative flex-1 h-4">{Array.from({ length: max + 1 }, (_, t) => <span key={t} className="absolute font-mono text-[0.62rem] c-muted" style={{ left: (t / max * 100) + '%', transform: 'translateX(-50%)' }}>{t}</span>)}</div></div>
      </div>
      <div className={'mt-3 text-[0.95rem] ' + (good ? 'c-tip' : 'c-pit')}>
        <strong>הכלל בחר {S.length} פעילויות ({S.map(x => x.id).join(', ')}). האופטימום: {data.opt}. </strong>
        <span className="text-ink">{good ? 'על הקלט הזה הכלל הצליח. זה עדיין לא אומר שהוא נכון לכל קלט.' : 'דוגמה נגדית: על הקלט הזה הכלל לא מוצא פתרון אופטימלי.'}</span>
      </div>
    </div>
  );
}

            <li>בניית המחרוזת: <M>O(n)</M>.</li>
          </ul>
        </Def>
        <Callout type="behind" title="למה לא קיבלנו אלגוריתם יעיל?">
          <p>לבעיית תתי־המחרוזות קיים פתרון יעיל, אבל הרדוקציה העבירה אותה לבעיה <strong>קשה יותר</strong>. הרדוקציה נכונה לגמרי; הבחירה של בעיית היעד היא שהייתה גרועה.</p>
        </Callout>
        <IntuitionCheck
          q="בקורס 'מבנים בדידים וקומבינטוריקה' ראיתם את מסלול המילטון ואת מסלול אוילר. לאיזו מהן ידוע אלגוריתם יעיל?"
          options={[
            { t: 'מסלול המילטון', correct: false, why: 'לבעיית מסלול המילטון לא ידוע אלגוריתם יעיל. בדיוק בגלל זה קיבלנו זמן אקספוננציאלי.' },
            { t: 'מסלול אוילר', correct: true, why: 'ממשפט אוילר יש אלגוריתם בזמן O(|E|). לכן ננסה עכשיו רדוקציה לאוילר.' },
            { t: 'לשתיהן', correct: false, why: 'אילו היה אלגוריתם יעיל להמילטון, האלגוריתם מהרצאה 1 כבר היה יעיל.' },
          ]}
        />
      </Section>

      <Section id="euler" scope="lec2" doneKey="euler" kicker="הרצאה 2 · עמ׳ 3" title="בעיית מסלול אוילר">
        <Def tag="הבעיה">
          <p><strong>קלט:</strong> גרף מכוון <M>G = (V, E)</M>.</p>
          <p><strong>פלט:</strong> מסלול שעובר בכל <strong>קשת</strong> בגרף בדיוק פעם אחת, או הודעה שאין מסלול כזה.</p>
        </Def>
        <Def tag="משפט אוילר">
          <p>בגרף מכוון <span className="hl">וקשיר</span> יש מסלול אוילר אם ורק אם מתקיים אחד משני התנאים:</p>
          <ol>
            <li>לכל קודקוד, דרגת הכניסה שווה לדרגת היציאה. במקרה זה יש מעגל אוילר.</li>
            <li>לכל הקודקודים פרט לשניים דרגת הכניסה שווה לדרגת היציאה. באחד מהשניים דרגת היציאה גדולה בדיוק ב-1 מדרגת הכניסה, ובשני דרגת הכניסה גדולה בדיוק ב-1 מדרגת היציאה.</li>
          </ol>
          <p>קיים אלגוריתם בזמן <M>O(|E|)</M> שמוצא מסלול אוילר, אם קיים.</p>
        </Def>
        <Callout type="behind" title="ההיפוך: מקודקודים לקשתות">
          <p>ברדוקציה להמילטון כל מחרוזת קלט הייתה <strong>קודקוד</strong>, והמסלול נדרש לבקר בכל קודקוד פעם אחת. עכשיו כל מחרוזת תהיה <strong>קשת</strong>: מסלול שעובר בכל קשת בדיוק פעם אחת ישתמש בכל מחרוזת בדיוק פעם אחת. אותה דרישה, מנוסחת במונחים של בעיה קלה.</p>
        </Callout>
        <Callout type="pit" title="אל תשכחו את 'קשיר'">
          <p>תנאי הדרגות לבדם לא מספיקים: גרף עם שני מעגלים נפרדים מקיים אותם, ואין בו מסלול אוילר. תרגיל 13 במעבדה בנוי בדיוק על זה.</p>
          <button className="btn text-sm mt-2" onClick={() => goLab('e13')}>לתרגיל 13</button>
        </Callout>
        <Callout type="tip">
          <p>כשמשתמשים במשפט כקופסה שחורה, מצטטים אותו כמו שהוא, כולל ההנחות שלו. ההנחות הן בדיוק המקום שבו בודקים מחפשים טעויות.</p>
        </Callout>
      </Section>

      <Section id="euler-red" scope="lec2" doneKey="euler-red" kicker="הרצאה 2 · עמ׳ 4" title="הרדוקציה למסלול אוילר">
        <Def tag="ממיר הקלט">
          <p>בהינתן <M>w_1, …, w_n</M>, בונים גרף מכוון <M>G = (V, E)</M>:</p>
          <ul>
            <li>כל קודקוד מתאים למחרוזת באורך 2 שמופיעה כשתי האותיות הראשונות או כשתי האותיות האחרונות של אחת ממחרוזות הקלט. כל מחרוזת כזו מיוצגת בקודקוד <strong>אחד בלבד</strong>.</li>
            <li>לכל מחרוזת <M>w_j</M> יוצרים קשת מכוונת מהקודקוד של שתי האותיות הראשונות שלה אל הקודקוד של שתי האותיות האחרונות שלה.</li>
          </ul>
          <p><strong>ממיר הפלט:</strong> מחזירים "כן" אם ורק אם יש מסלול אוילר בגרף.</p>
        </Def>
        <p>בדוגמה <M>ATE, EAT, TEA, EAM, THE, HEA</M> המחרוזת <M>EA</M> מופיעה כתחילית או כסופית של ארבע מחרוזות, אבל מיוצגת בקודקוד אחד. נסו למצוא מסלול אוילר:</p>
        <EulerPlayground />
        <Def tag="נכונות">
          <p><strong>משפט:</strong> יש פתרון לבעיית תתי־המחרוזות אם ורק אם האלגוריתם מחזיר "כן".</p>
          <p><strong>טענה 1:</strong> אם אין פתרון לבעיה, אז אין מסלול אוילר בגרף.</p>
          <p><strong>טענה 2:</strong> אם יש פתרון לבעיה, אז קיים מסלול אוילר בגרף.</p>
          <p>הטענות גוררות את המשפט בדיוק כמו ברדוקציה להמילטון: יש פתרון ⇒ (טענה 2) יש מסלול אוילר ⇒ "כן". אין פתרון ⇒ (טענה 1) אין מסלול אוילר ⇒ "לא".</p>
        </Def>
        <Callout type="tip" title="אותו שלד, גרף אחר">
          <p>המשפט, שתי הטענות והמעבר מהטענות למשפט כמעט זהים לרדוקציה להמילטון. השלד של הוכחת רדוקציה לבעיית הכרעה קבוע; רק הוכחות טענות העזר תלויות בבנייה.</p>
        </Callout>
        <IntuitionCheck
          q="כמה קשתות יש בגרף שבונה ממיר הקלט?"
          options={[
            { t: 'בדיוק n', correct: true, why: 'קשת אחת לכל מחרוזת קלט. זה ישמש בהוכחה: מסלול אוילר עובר בדיוק ב-n קשתות, ולכן יש בו n + 1 קודקודים (עם חזרות).' },
            { t: 'עד n²', correct: false, why: 'זה היה בגרף ההמילטון, שם בודקים כל זוג מחרוזות. כאן כל מחרוזת יוצרת קשת אחת.' },
            { t: '2n', correct: false, why: '2n הוא חסם על מספר הקודקודים (תחילית וסופית לכל מחרוזת), לא על מספר הקשתות.' },
          ]}
        />
      </Section>

      <Section id="euler-c1" scope="lec2" doneKey="euler-c1" kicker="הרצאה 2 · עמ׳ 5" title="טענה 1: ממסלול אוילר למחרוזת">
        <p>גם כאן נוח להוכיח את הניסוח השקול: <strong>אם יש מסלול אוילר בגרף, אז קיים פתרון.</strong></p>
        <TryFirst goLab={goLab} ids={[['e10', 10]]} text="ההוכחה הזו היא תרגיל 10 במעבדה." />
        <div className="grid gap-5">
          <RevealStep n="1" title="המסלול והסימון" question="כמה איברים יש ברשימת הקודקודים של מסלול אוילר כאן, ואיך כדאי לסמן תווים של קודקוד?">
            <p>יהי <M>{"P = (v_1, v_2, …, v_{n+1})"}</M> מסלול אוילר. יש בגרף <M>n</M> קשתות, ולכן ברשימה <M>n + 1</M> איברים; קודקודים יכולים לחזור.</p>
            <p><strong>סימון:</strong> למחרוזת <M>v</M> באורך 2, <M>v[1]</M> הוא התו הראשון ו-<M>v[2]</M> התו השני.</p>
          </RevealStep>
          <RevealStep n="2" title="הבנייה" question="איך בונים את T, ומה אורכה?">
            <p><M>{"T = v_1[1] v_1[2] v_2[2] ⋯ v_{n+1}[2]"}</M>: שתי האותיות של <M>v_1</M>, ואחריהן האות האחרונה של כל קודקוד הבא. אורכה <M>n + 2</M>.</p>
          </RevealStep>
          <RevealStep n="3" title="כל מחרוזת קלט מופיעה" question="תהי w_j מחרוזת קלט, והקשת שלה במסלול היא (v_i, v_{i+1}). איפה w_j נמצאת ב-T?">
            <p>מבניית הגרף, <M>{"w_j = v_i[1] v_i[2] v_{i+1}[2]"}</M>.</p>
            <ul>
              <li>אם <M>i = 1</M>: <M>w_j</M> הם שלושת התווים הראשונים של <M>T</M>.</li>
              <li>אם <M>{"i > 1"}</M>: נסתכל על <M>{"U = v_{i−1}[2] v_i[2] v_{i+1}[2]"}</M>, שלושה תווים עוקבים של <M>T</M>. הקשת <M>{"(v_{i−1}, v_i)"}</M> מבטיחה ש-<M>{"v_{i−1}[2] = v_i[1]"}</M>, ולכן <M>{"U = v_i[1] v_i[2] v_{i+1}[2] = w_j"}</M>.</li>
            </ul>
          </RevealStep>
          <RevealStep n="4" title="סוגרים בספירה" question="מה מבטיח ש-T פתרון חוקי?">
            <p>מחרוזות הקלט שונות, ולכן ל-<M>T</M> יש לפחות <M>n</M> תתי־מחרוזות שונות באורך 3. אורכה <M>n + 2</M>, ולכן יש לה לכל היותר <M>n</M>. לכן מחרוזות הקלט הן בדיוק כל תתי־המחרוזות שלה באורך 3, ו-<M>T</M> פתרון חוקי. <span className="qed" /></p>
          </RevealStep>
        </div>
        <Callout type="tip" title="סימון קטן, הוכחה קצרה">
          <p>הסימון <M>v[1], v[2]</M> הופך משפט כמו "האות השנייה של הקודקוד הקודם שווה לאות הראשונה של הנוכחי" לשוויון אחד: <M>{"v_{i−1}[2] = v_i[1]"}</M>. כשהוכחה מתמלאת במילים, זה סימן שצריך להגדיר סימון.</p>
        </Callout>
      </Section>

      <Section id="euler-c2" scope="lec2" doneKey="euler-c2" kicker="הרצאה 2 · עמ׳ 6" title="טענה 2: ממחרוזת למסלול אוילר">
        <p><strong>טענה 2:</strong> אם יש פתרון לבעיית תתי־המחרוזות, אז קיים מסלול אוילר בגרף.</p>
        <TryFirst goLab={goLab} ids={[['e9', 9]]} text="ההוכחה הזו היא תרגיל 9 במעבדה." />
        <div className="grid gap-5">
          <RevealStep n="1" title="חלונות באורך 2" question="תהי T פתרון באורך n + 2. איך מפיקים ממנה רשימת קודקודים?">
            <p>לכל <M>{"i ∈ {1, …, n+1}"}</M>, נסמן ב-<M>y_i</M> את תת־המחרוזת באורך 2 שמתחילה בתו ה-<M>i</M> של <M>T</M>. נראה ש-<M>{"Q = (y_1, y_2, …, y_{n+1})"}</M> הוא מסלול אוילר.</p>
          </RevealStep>
          <RevealStep n="2" title="(א) כל y_i הוא קודקוד" question="למה כל חלון באורך 2 הוא קודקוד בגרף?">
            <p>לכל <M>1 ≤ i ≤ n</M>, נסמן ב-<M>x_i</M> את תת־המחרוזת באורך 3 שמתחילה בתו ה-<M>i</M>. <M>T</M> פתרון, ולכן <M>x_i</M> מחרוזת קלט, ו-<M>y_i</M> הן שתי האותיות הראשונות שלה, כלומר קודקוד. ב-<M>{"y_{n+1}"}</M> מטפלים בנפרד, באופן דומה: אלה שתי האותיות האחרונות של <M>x_n</M>.</p>
          </RevealStep>
          <RevealStep n="3" title="(ב) כל זוג עוקב הוא קשת" question="למה (y_i, y_{i+1}) היא קשת?">
            <p>שתי האותיות הראשונות של <M>x_i</M> הן <M>y_i</M> ושתי האחרונות הן <M>{"y_{i+1}"}</M>. לכן הקשת של <M>x_i</M> היא בדיוק <M>{"(y_i, y_{i+1})"}</M>. מ-(א) ו-(ב), <M>Q</M> הוא מסלול בגרף.</p>
          </RevealStep>
          <RevealStep n="4" title="(ג) כל קשת בדיוק פעם אחת" question="מה עוד חסר כדי שזה יהיה מסלול אוילר?">
            <ul>
              <li>לכל תת־מחרוזת <M>x_i</M> התאמנו קשת במסלול.</li>
              <li><M>T</M> פתרון חוקי ומחרוזות הקלט שונות, ולכן גם <M>x_1, …, x_n</M> שונות זו מזו.</li>
              <li>לכן <M>n</M> הקשתות במסלול שונות: אם <M>{"(y_i, y_{i+1}) = (y_j, y_{j+1})"}</M> אז <M>x_i = x_j</M>.</li>
              <li>בגרף יש בדיוק <M>n</M> קשתות, ולכן כל אחת מהן מופיעה במסלול בדיוק פעם אחת. <span className="qed" /></li>
            </ul>
          </RevealStep>
        </div>
        <Def tag="זמן הריצה">
          <ul>
            <li>ממיר הקלט: ממיינים לקסיקוגרפית את המחרוזות באורך 2 שמופיעות כתחיליות וכסופיות, מזהים מחרוזות זהות ויוצרים קודקוד אחד לכל מחרוזת שונה: <M>O(n log n)</M>. אפשר גם מימוש יעיל יותר.</li>
            <li>מציאת מסלול אוילר: <M>O(|E|) = O(n)</M>.</li>
            <li>ממיר הפלט: <M>O(n)</M>. סך הכול <M>O(n log n)</M>.</li>
          </ul>
        </Def>
        <IntuitionCheck
          q="למה בכלל צריך למיין בבניית הגרף?"
          options={[
            { t: 'כדי לזהות מחרוזות זהות באורך 2, כך שכל אחת תהיה קודקוד אחד בלבד.', correct: true, why: 'אילו EA הייתה נוצרת כארבעה קודקודים שונים, הקשתות לא היו מתחברות למסלול. המיון מקבץ את העותקים הזהים.' },
            { t: 'כי האלגוריתם למסלול אוילר דורש קשתות ממוינות.', correct: false, why: 'אסור להניח שום דבר על אופן פעולת הקופסה השחורה, ובוודאי לא דרישות קלט שאינן בהגדרת הבעיה.' },
            { t: 'כדי שהמחרוזת שנבנית תהיה הקטנה ביותר לקסיקוגרפית.', correct: false, why: 'בעיית ההכרעה לא מבקשת מחרוזת מסוימת; כל פתרון חוקי מתאים.' },
          ]}
        />
        <Callout type="behind" title="המילטון מול אוילר">
          <p>אותה בעיה, שתי רדוקציות נכונות: <M>O(n²)</M> ועוד זמן אקספוננציאלי, מול <M>O(n log n)</M>. כל ההבדל הוא בשאלה מה קודקוד ומה קשת.</p>
        </Callout>
        <TryFirst goLab={goLab} ids={[['e11', 11], ['e12', 12]]} text="המשך במעבדה: גרסת החיפוש (להחזיר את המחרוזת עצמה), והכללה למחרוזות באורך k." />
      </Section>

      <Section id="greedy" scope="lec2" doneKey="greedy" kicker="הרצאה 2 · עמ׳ 7–8" title="מבוא לאלגוריתמים חמדניים: בעיית הפעילויות">
        <p>באופן אינטואיטיבי, אלגוריתם חמדן מבצע בכל צעד את הפעולה שנראית הטובה ביותר באותו רגע, <strong>ואינו חוזר בו</strong> מבחירותיו.</p>
        <Def tag="בעיית הפעילויות">
          <p>יש חדר הרצאות ופעילויות שרוצים לקיים בו. לכל פעילות זמן התחלה וזמן סיום, ובכל רגע אפשר לקיים בחדר לכל היותר פעילות אחת.</p>
          <p><strong>קלט:</strong> <M>n</M> פעילויות; לכל פעילות <M>i</M> זמן התחלה <M>s_i</M> וזמן סיום <M>f_i</M>, כאשר <M>{"s_i < f_i"}</M>. הפעילויות אינן כוללות את קצות קטעי הזמן.</p>
          <p><strong>פתרון חוקי:</strong> קבוצה <M>{"S ⊆ {1, …, n}"}</M> של פעילויות שאינן חופפות: לכל <M>i ≠ j</M> ב-<M>S</M> מתקיים <M>f_i ≤ s_j</M> או <M>f_j ≤ s_i</M>.</p>
          <p><strong>יש למצוא:</strong> פתרון חוקי עם מספר גדול ככל האפשר של פעילויות.</p>
        </Def>
        <p>האלגוריתם הנאיבי בודק כל תת־קבוצה, כלומר <M>2^n</M> תתי־קבוצות. במקום זה, תבנית חמדנית:</p>
        <Def tag="תבנית לאלגוריתם חמדן">
          <p><strong>אתחול:</strong> <M>S ← ∅</M> (הפתרון החלקי), <M>{"A ← {1, …, n}"}</M> (הקטעים שזרים לכל הקטעים ב-<M>S</M>).</p>
          <p><strong>צעד:</strong> כל עוד <M>A ≠ ∅</M>: (1) בוחרים <M>i ∈ A</M> לפי כלל בחירה כלשהו ומוסיפים אותו ל-<M>S</M>. (2) מסירים מ-<M>A</M> את כל הקטעים שחותכים את הקטע ה-<M>i</M>, כולל אותו עצמו.</p>
          <p><strong>הבחנה:</strong> האלגוריתם מחזיר פתרון <strong>חוקי</strong> לכל כלל בחירה.</p>
        </Def>
        <p>ארבעה רעיונות לכלל הבחירה: (1) קטע שחותך הכי מעט קטעים; (2) קטע קצר ביותר; (3) הקטע שמתחיל ראשון; (4) הקטע שמסתיים ראשון. נסו כל כלל על כל קלט:</p>
        <GreedySim />
        <Callout type="behind" title="למה קודם 'הבחנה' על חוקיות?">
          <p>ההבחנה מפרידה בין שתי שאלות: האם הפלט חוקי (נכון לכל כלל, בזכות שלב ההסרה), והאם הוא אופטימלי (תלוי בכלל). זו אותה הפרדה כמו ברדוקציות. בהוכחות של אלגוריתמים חמדניים מטפלים בשתיהן בנפרד.</p>
        </Callout>
        <IntuitionCheck
          q="מבין ארבעת הכללים, רק אחד מבטיח פתרון אופטימלי לכל קלט. איזה?"
          options={[
            { t: 'חותך הכי מעט קטעים', correct: false, why: 'נשמע הגיוני, אבל יש לו דוגמה נגדית (בציור בעמ׳ 8 של ההרצאה).' },
            { t: 'קצר ביותר', correct: false, why: 'נסו בסימולטור את הקלט "נגד קצר ביותר": קטע קצר אחד יכול לחסום שני קטעים ארוכים.' },
            { t: 'מתחיל ראשון', correct: false, why: 'קטע ארוך שמתחיל ראשון יכול לתפוס את כל הזמן. נסו את הקלט "נגד מתחיל ראשון".' },
            { t: 'מסתיים ראשון', correct: true, why: 'זה הכלל היחיד מהארבעה שמבטיח אופטימום. את ההוכחה נראה בהמשך הפרק.' },
          ]}
        />
        <Callout type="pit" title="דוגמה נגדית אחת מספיקה">
          <p>כדי להפריך כלל חמדני מספיק קלט אחד שעליו הוא נכשל; כדי להוכיח כלל צריך הוכחה לכל קלט. לכן בשאלות "האם האלגוריתם החמדני נכון?" כדאי קודם לחפש דוגמה נגדית קטנה.</p>
        </Callout>
      </Section>

      <div className="card p-5 sm:p-6" style={{ background: 'var(--ink)', color: 'var(--surface)', borderColor: 'var(--ink)' }}>
        <div className="kicker" style={{ color: 'var(--mark)' }}>כרטיס סיכום · הרצאה 2</div>
        <ul className="mt-2 grid gap-1.5 text-[0.98rem]" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>בהוכחות על מחרוזות: מחרוזת ← מסלול בעזרת חלונות לפי מיקום; מסלול ← מחרוזת בעזרת "הקודקוד הראשון ועוד התו האחרון של כל הבא".</li>
          <li>"בדיוק הקלט" מוכיחים בספירה: לפחות <M>n</M> שונות, לכל היותר <M>n</M> חלונות.</li>
          <li>רדוקציה נכונה לבעיה קשה נותנת אלגוריתם איטי. הבחירה של בעיית היעד קובעת את היעילות.</li>
          <li>אוילר: מחרוזות כקשתות, קודקודים כחפיפות באורך 2. זמן <M>O(n log n)</M>.</li>
          <li>חמדנים: חוקיות (לכל כלל) ואופטימליות (רק לכלל הנכון) הן שתי טענות נפרדות.</li>
        </ul>
      </div>
    </Stepper>
  );
}

const TUT_SECTIONS = [
  ['basics', 'שפה משותפת'], ['formal-tut', 'רדוקציה בגרסת התרגול'], ['sep-sp', 'דוגמה 1: SEP ← SP'],

];
function ClassifyQuiz() {
  const items = [
    { t: 'בהינתן גרף G וקודקודים u, v: האם קיים מסלול בין u ל-v?', a: 'הכרעה', why: 'שאלת כן/לא. זו בעיה A מהתרגול.' },
    { t: 'בהינתן גרף G וקודקודים u, v: מצא מסלול קצר ביותר, או "אין מסלול".', a: 'אופטימיזציה', why: 'יש הרבה פתרונות חוקיים (מסלולים) ומחפשים בעל ערך מינימלי. זו בעיה B מהתרגול.' },
    { t: 'בהינתן גרף G: מצא 2-צביעה חוקית, או החזר שאין כזו.', a: 'חיפוש', why: 'כל צביעה חוקית מתאימה, אין ערך לשפר. בתרגול מוגדרים במפורש רק שני הסוגים הראשונים; בעיות "מצא פתרון חוקי כלשהו" כמו בתגבור 1 קרובות להכרעה, אבל מחזירות את הפתרון עצמו.' },
    { t: 'SEP: לכל קודקוד u, אורך מסלול זוגי מינימלי מ-s, או ∞.', a: 'אופטימיזציה', why: 'מחפשים ערך מינימלי, ו-∞ הוא הערך כשאין אף פתרון חוקי.' },
  ];
  const [ans, setAns] = useState({});
  return (
    <div className="card p-4 grid gap-3" style={{ background: 'var(--surface-2)' }}>
      <div className="font-semibold">תרגול קצר: איזה סוג בעיה?</div>
      {items.map((it, i) => (
        <div key={i} className="card p-3">
          <div className="text-[0.97rem]">{it.t}</div>
          <div className="mt-2 flex flex-wrap gap-2">
            {['הכרעה', 'אופטימיזציה', 'חיפוש'].map(o => {
              const picked = ans[i] === o; const ok = o === it.a;
              return <button key={o} className="chip" onClick={() => setAns(a => ({ ...a, [i]: o }))} style={picked ? { background: ok ? 'var(--tip-soft)' : 'var(--pit-soft)', borderColor: ok ? 'var(--tip)' : 'var(--pit)', color: 'var(--ink)' } : {}}>{o}</button>;
            })}
          </div>
          {ans[i] && <div className={'mt-2 text-sm ' + (ans[i] === it.a ? 'c-tip' : 'c-pit')}><strong>{ans[i] === it.a ? 'נכון. ' : 'לא. '}</strong><span className="text-ink">{ans[i] === it.a ? it.why : 'נסו שוב.'}</span></div>}
        </div>
      ))}
    </div>
  );
}

function TutorialTab({ goLab, goTab, onIndex }) {
  return (
    <Stepper scope="tut" items={TUT_SECTIONS} onFinish={() => goTab('lab')} finishLabel="למעבדת ההוכחות" onIndexChange={onIndex}>

      <Section id="basics" scope="tut" doneKey="basics" kicker="תרגול 1 · עמ׳ 1–3" title="שפה משותפת: בעיה, מופע, פתרון, הוכחה">
        <p>בבעיה נשאלת שאלה קבועה על קלט משתנה שנקרא <strong>מופע</strong>. בדוגמת מפת הכבישים: המופע הוא המפה, עיר המוצא ועיר היעד; הפתרון הוא מסלול קצר ביותר בין הערים.</p>
        <Def tag="הוכחת נכונות פורמלית">
          <p>סדרה של טענות, שכל אחת נגררת לוגית <strong>רק</strong> מידע מוקדם מוכח ומהנחות על הקלט, והטענה האחרונה היא המסקנה המבוקשת.</p>
          <p>כדי להוכיח שאלגוריתם מחזיר מסלול קצר ביותר, צריך להוכיח שני מקרים: (א) קיים מסלול בין הערים; (ב) לא קיים מסלול.</p>
        </Def>
        <ClassifyQuiz />
        <Def tag="תזכורת: O גדול">
          <p><M>f(n) = O(g(n))</M> אם קיימים <M>{"c > 0"}</M> ו-<M>n_0</M> כך שלכל <M>n ≥ n_0</M> מתקיים <M>f(n) ≤ c·g(n)</M>.</p>
          <p>קבוע <M>O(1)</M>, ליניארי <M>O(n)</M>, פולינומיאלי <M>O(n^c)</M>, אקספוננציאלי <M>{"O(2^{nᶜ})"}</M>. בקורס נחפש אלגוריתמים פולינומיאליים בדרגה נמוכה.</p>
        </Def>
        <Callout type="tip" title="שלושת החלקים של כל תשובה">
          <p>"מעתה ואילך, בכל פעם שנבקש פתרון לבעיה, ברירת המחדל היא לפרט את שלושת האספקטים": תיאור האלגוריתם, הוכחה פורמלית של נכונותו, מימוש וניתוח זמן ריצה. בבדיקה במעבדה הם מקבלים שדות נפרדים בדיוק בגלל זה.</p>
        </Callout>
      </Section>

      <Section id="formal-tut" scope="tut" doneKey="formal-tut" kicker="תרגול 1 · עמ׳ 4–5" title="ההגדרה הפורמלית, בגרסת התרגול">
        <Def>
          <p>רדוקציה מ-<M>A</M> ל-<M>B</M> היא זוג פונקציות <M>f, g</M>: <M>f</M> מעבירה מופע של <M>A</M> למופע של <M>B</M>; <M>g</M> מעבירה פתרון של <M>B</M> לפתרון של <M>A</M>. <strong>נכונות:</strong> לכל מופע <M>a</M> של <M>A</M>, אם <M>B(f(a))</M> פתרון למופע <M>f(a)</M>, אז <M>g(B(f(a)))</M> פתרון למופע <M>a</M>.</p>
        </Def>
        <ul className="prose-he grid gap-1" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>בהוכחה האלגוריתם ל-<M>B</M> הוא <strong>קופסה שחורה</strong>: לא מניחים דבר על אופן פעולתו מלבד שהוא פותר נכון את <M>B</M> לכל מופע.</li>
          <li>מותר להפעיל את הקופסה <strong>כמה פעמים</strong>. עדיין אומרים ש-<M>A</M> ניתנת לרדוקציה ל-<M>B</M>.</li>
          <li>זמן הריצה: שלושה רכיבים (תרגום קלט, קופסה, תרגום פלט). אסימפטוטית זה המקסימום מביניהם, כלומר אותו דבר כמו הסכום.</li>
          <li>גודל הקלט ל-<M>B</M> יכול להיות שונה מהמקורי, ומנתחים כפונקציה של הקלט המקורי.</li>
        </ul>
        <Callout type="behind" title="הרצאה מול תרגול: g(b) או g(x, y)?">
          <p>בתרגול <M>g</M> מקבל רק את הפתרון של <M>B</M>; בהרצאה הוא מקבל גם את הקלט המקורי. בפועל, כמעט תמיד ממיר הפלט משתמש בקלט המקורי (למשל כדי לדעת מי הם <M>u_1</M>). כתבו <M>g(x, y)</M> ותהיו מכוסים בשתי הגרסאות.</p>
        </Callout>
      </Section>

      <Section id="sep-sp" scope="tut" doneKey="sep-sp" kicker="תרגול 1 · דוגמה 1" title="SEP ← SP: מסלול זוגי קצר ביותר בעזרת מסלול קצר ביותר">
        <Def tag="הבעיות">
          <p><strong>SP:</strong> גרף לא מכוון <M>G = (V, E)</M> וקודקוד <M>s</M>. יש למצוא <M>d(s, u)</M> לכל <M>u ∈ V</M> (∞ אם אין מסלול).</p>
          <p><strong>SEP:</strong> אותו קלט. יש למצוא לכל <M>u ∈ V</M> את אורך המסלול (בצלעות) <strong>הזוגי</strong> הקצר ביותר מ-<M>s</M> ל-<M>u</M>, או ∞.</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="מה ההבדל בין מה שיש לנו למה שצריך?" question="מה הדבר היחיד ש-SEP דורש ו-SP לא יודע לעשות?">
            <p>אילוץ הזוגיות. SP (למשל BFS) לא מבדיל בין אורכים זוגיים לאי־זוגיים. אז צריך גרף שבו "מרחק רגיל" כבר <strong>מקודד</strong> את הזוגיות.</p>
          </RevealStep>
          <RevealStep n="2" title="הרעיון: הגרף יזכור את הזוגיות" question="איך קודקוד בגרף יכול 'לזכור' אם עברנו עד עכשיו מספר זוגי או אי־זוגי של צלעות?">
            <p>שני עותקים לכל קודקוד: <M>u_1</M> פירושו "הגעתי ל-u אחרי מספר זוגי של צלעות", <M>u_2</M> פירושו "אחרי מספר אי־זוגי". כל צלע מחליפה עותק. זה <strong>כיסוי דו־חלקי</strong>: מסלול מ-<M>s_1</M> ל-<M>v_1</M> חייב להיות זוגי.</p>
          </RevealStep>
          <DoubleCover />
          <RevealStep n="3" title="ממיר הקלט, במדויק" question="איך כותבים את G′ כקבוצות, לא כציור?">
            <p><M>{"V′ = V_1 ∪ V_2"}</M> כאשר <M>{"V_1 = { u_1 : u ∈ V }"}</M>, <M>{"V_2 = { u_2 : u ∈ V }"}</M>.</p>
            <p><M>{"E′ = { (u_1, v_2), (u_2, v_1) : (u, v) ∈ E }"}</M>. מקור: <M>s_1</M>.</p>
          </RevealStep>
          <RevealStep n="4" title="ממיר הפלט" question="מהי התשובה ל-u, במונחי הפלט של SP על G′?">
            <p>לכל <M>u ∈ V</M> מחזירים את <M>d(s_1, u_1)</M> ב-<M>G′</M> כאורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>u</M> ב-<M>G</M>.</p>
          </RevealStep>
          <RevealStep n="5" title="מבנה ההוכחה" question="מהי הטענה הראשית, ומה הייתי צריך לדעת כדי שתצא מיד?">
            <p><strong>טענה ראשית:</strong> לכל <M>v ∈ V</M>, אורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>v</M> ב-<M>G</M> שווה ל-<M>d(s_1, v_1)</M> ב-<M>G′</M>.</p>
            <p><strong>אבחנה:</strong> כל מסלול מ-<M>s_1</M> לקודקוד ב-<M>V_1</M> הוא באורך זוגי (הקודקודים מתחלפים בין <M>V_1</M> ל-<M>V_2</M>).</p>
            <p><strong>טענת עזר:</strong> קיים ב-<M>G</M> מסלול באורך <M>2m</M> מ-<M>s</M> ל-<M>v</M> אם ורק אם קיים ב-<M>G′</M> מסלול באורך <M>2m</M> מ-<M>s_1</M> ל-<M>v_1</M>.</p>
            <p><strong>מהטענה למשפט:</strong> יהי <M>2m</M> המינימום ב-<M>G</M>. לפי ⇒, <M>d(s_1, v_1) ≤ 2m</M>. אם היה ב-<M>G′</M> מסלול קצר יותר, הוא זוגי (אבחנה), נניח <M>{"2k < 2m"}</M>, ולפי ⇐ יש ב-<M>G</M> מסלול זוגי באורך <M>2k</M>: סתירה. ואם אין ב-<M>G</M> מסלול זוגי, אילו <M>{"d(s_1, v_1) < ∞"}</M> הייתה אותה סתירה.</p>
            <p><strong>הוכחת טענת העזר:</strong> ממפים <M>(s, u_1, u_2, …, v)</M> ל-<M>(s_1, u_1^2, u_2^1, …, v_1)</M> (העותק מתחלף), וכל צלע עוברת לפי בניית <M>E′</M>. אפשר לכתוב את שני הכיוונים יחד כשרשרת ⇔.</p>
          </RevealStep>
          <Callout type="behind" title="'האם זה מספיק?' (שאלה מהתרגול)">
            <p>להראות רק שכל מסלול ב-<M>G′</M> מתאים למסלול זוגי ב-<M>G</M> (כיוון ⇐) מבטיח שהקופסה לא מחזירה ערך <em>קטן מדי</em>. אבל ייתכן שב-<M>G′</M> חסר מסלול, והקופסה תחזיר ערך <em>גדול מדי</em>. בשביל זה צריך את ⇒. בטענה על אופטימום תמיד צריך את שני האי־שוויונות.</p>
          </Callout>
          <RevealStep n="6" title="זמן ריצה" question="מה גודל G′ ביחס ל-G?">
            <p><M>|V′| = 2|V|</M>, <M>|E′| = 2|E|</M>. בנייה: <M>O(|V| + |E|)</M>. BFS על <M>G′</M>: <M>O(|V′| + |E′|) = O(|V| + |E|)</M>. תרגום הפלט: <M>O(|V|)</M>. סה"כ <M>O(|V| + |E|)</M>.</p>
          </RevealStep>
        </div>
        <Callout type="pit">
          <p>ההוכחה מהתרגול מטפלת במפורש גם במקרה <strong>∞</strong>. בבחינות זה המקום שבו מאבדים נקודות הכי בקלות.</p>
        </Callout>
      </Section>

      <Section id="sp-sep" scope="tut" doneKey="sp-sep" kicker="תרגול 1 · דוגמה 2" title="SP ← SEP: הכיוון ההפוך, ולמה הבעיות שקולות">
        <div className="grid gap-5">
          <RevealStep n="1" title="מה הטריק הפעם?" question="יש קופסה ל-SEP. איך גורמים לכל מסלול להיות זוגי, בלי לאבד מידע על האורך?">
            <p>מוסיפים קודקוד באמצע כל צלע. כל מסלול באורך <M>m</M> ב-<M>G</M> הופך למסלול באורך <M>2m</M> ב-<M>G′</M>, ולהפך. מריצים SEP על <M>G′</M> ומחזירים חצי.</p>
          </RevealStep>
          <RevealStep n="2" title="ממיר הקלט, במדויק" question="איך מגדירים את קודקודי הביניים כך שלכל צלע יהיה בדיוק אחד?">
            <p><M>{"V* = { uv : (u, v) ∈ E }"}</M> (הקודקוד <M>uv</M> והקודקוד <M>vu</M> הם אותו קודקוד), <M>{"V′ = V ∪ V*"}</M>, <M>{"E′ = { (u, uv), (v, uv) : (u, v) ∈ E }"}</M>. <M>G′</M> דו־חלקי עם הצדדים <M>V</M> ו-<M>V*</M>.</p>
          </RevealStep>
          <RevealStep n="3" title="ממיר הפלט" question="מה מחזירים לכל u ∈ V?">
            <p>את מחצית אורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>u</M> ב-<M>G′</M>.</p>
          </RevealStep>
          <RevealStep n="4" title="מבנה ההוכחה" question="אילו טענות עזר נדרשות כאן, ומה שונה מדוגמה 1?">
            <p><strong>אבחנה:</strong> כל מסלול ב-<M>G′</M> מקודקוד ב-<M>V</M> לקודקוד ב-<M>V</M> זוגי (דו־חלקיות).</p>
            <p><strong>טענת עזר:</strong> לכל <M>s ≠ v</M>, קיים ב-<M>G</M> מסלול <strong>פשוט</strong> באורך <M>m</M> מ-<M>s</M> ל-<M>v</M> אם"ם קיים ב-<M>G′</M> מסלול <strong>פשוט</strong> באורך <M>2m</M>.</p>
            <p><strong>עוד טענה:</strong> מסלול קצר ביותר הוא פשוט (אחרת מקצרים את הקטע שבין שתי ההופעות של הקודקוד החוזר, ומקבלים מסלול קצר יותר).</p>
          </RevealStep>
          <Callout type="intuit" title="שאלה מהתרגול: למה דרשנו מסלולים פשוטים?">
            <RevealInline>
              <p>ב-<M>G′</M> אפשר ללכת <M>u_1 → u_1u_2 → u_1</M>: מסלול באורך 2 שחוזר למקום. ב-<M>G</M> הוא לא מתאים לשום צלע (לא הגענו ל-<M>u_2</M>), ולכן מסלול כללי באורך <M>2m</M> ב-<M>G′</M> עלול להתאים למסלול <em>קצר יותר</em> מ-<M>m</M> ב-<M>G</M>, וכיוון ⇐ נשבר. מסלולים פשוטים לא יכולים "להסתובב" בקודקוד ביניים. וזה מספיק, כי מסלולים קצרים ביותר הם פשוטים.</p>
            </RevealInline>
          </Callout>
          <RevealStep n="5" title="זמן ריצה" question="כמה קודקודים וקשתות יש ב-G′?">
            <p><M>|V′| = |V| + |E|</M>, <M>|E′| = 2|E|</M>. הקופסה ל-SEP רצה בזמן <M>O(|V′| + |E′|) = O(|V| + |E|)</M> (את זה ראינו בדוגמה 1). סה"כ <M>O(|V| + |E|)</M>.</p>
          </RevealStep>
        </div>
        <Callout type="tip" title="שתי רדוקציות = שקילות">
          <p>SEP ← SP ו-SP ← SEP יחד מראות ששתי הבעיות שקולות: כל אחת מהן פתירה בעזרת השנייה בתוספת עבודה ליניארית.</p>
        </Callout>
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: 'var(--mark-soft)', borderColor: 'var(--mark)' }}>
          <div><strong>בעיות למחשבה מסוף התרגול:</strong> SOP ← SP, ו-SP ← SOP.</div>
          <div className="flex gap-2 flex-wrap"><button className="btn btn-primary text-sm" onClick={() => goLab('e4')}>לתרגיל 4</button><button className="btn text-sm" onClick={() => goLab('e5')}>לתרגיל 5</button></div>
        </div>
      </Section>

      <Section id="coloring" scope="tut" doneKey="coloring" kicker="תגבור 1 · שאלה 1" title="2-צביעה ← 2-SAT">
        <Def tag="הבעיות">
          <p><strong>2-צביעה:</strong> קלט: גרף לא מכוון <M>G = (V, E)</M>. פלט: פונקציה <M>{"c : V → {0,1}"}</M> כך שלכל <M>(u, v) ∈ E</M> מתקיים <M>c(u) ≠ c(v)</M>, או "לא קיימת צביעה".</p>
          <p><strong>2-SAT:</strong> קלט: פסוק CNF שבכל פסוקית בו בדיוק שני ליטרלים, למשל <M>(x_1 ∨ x_2) ∧ (x_4 ∨ ¬x_6)</M>. פלט: השמה מספקת, או "לא קיימת השמה". נתון אלגוריתם בזמן <M>O(n + m)</M> (<M>n</M> משתנים, <M>m</M> פסוקיות).</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="מה מתאים למה?" question="לכל קודקוד יש אחד משני צבעים. מה בעולם של 2-SAT מקבל אחד משני ערכים?">
            <p>משתנה בוליאני <M>x_v</M> לכל <M>v ∈ V</M>. <M>T</M> = אדום, <M>F</M> = כחול.</p>
          </RevealStep>
          <RevealStep n="2" title="לקודד אילוץ של צלע" question="איך אומרים 'u ו-v בצבעים שונים' בעזרת פסוקיות של שני ליטרלים בלבד?">
            <p><M>(x_u ∨ x_v)</M> אוסרת על שניהם להיות <M>F</M>; <M>(¬x_u ∨ ¬x_v)</M> אוסרת על שניהם להיות <M>T</M>. יחד: בדיוק אחד מהם אמת.</p>
          </RevealStep>
          <RevealStep n="3" title="הממירים" question="מה בדיוק מחזירים בכל צד?">
            <p><strong>ממיר קלט:</strong> <M>{"ψ_G = ∧_{(u,v) ∈ E} (x_u ∨ x_v) ∧ (¬x_u ∨ ¬x_v)"}</M>.</p>
            <p><strong>ממיר פלט:</strong> אם חזרה השמה מספקת <M>x</M>, מחזירים <M>c_x(v)</M> = אדום אם <M>x_v = T</M> וכחול אחרת. אם לא, מחזירים "לא קיימת צביעה".</p>
          </RevealStep>
          <RevealStep n="4" title="הטענות" question="בעיית חיפוש: מה בדיוק צריך להוכיח על הפלט?">
            <p><strong>טענה ראשית:</strong> האלגוריתם מחזיר 2-צביעה חוקית של <M>G</M> אם קיימת, ואחרת מחזיר "לא".</p>
            <p><strong>טענת עזר 1:</strong> אם קיימת 2-צביעה של <M>G</M>, אז קיימת השמה מספקת ל-<M>ψ_G</M>.</p>
            <p><strong>טענת עזר 2:</strong> אם <M>x</M> השמה מספקת ל-<M>ψ_G</M>, אז <M>c_x</M> היא 2-צביעה חוקית של <M>G</M>.</p>
          </RevealStep>
          <Callout type="pit" title="מהסקיצה הרשמית של התגבור">
            <p>טענת עזר בניסוח "קיימת 2-צביעה אם"ם קיימת השמה מספקת" <strong>לא מספיקה</strong>. היא לא מבטיחה שהצביעה שממיר הפלט החזיר בפועל חוקית, רק שקיימת צביעה חוקית כלשהי. בבעיית חיפוש טענת עזר 2 חייבת לדבר על <M>c_x</M> עצמה.</p>
          </Callout>
          <RevealStep n="5" title="הוכחת הטענה הראשית מהטענות" question="מה קורה בכל אחד משני המקרים?">
            <p><strong>קיימת צביעה:</strong> לפי טענה 1 יש השמה מספקת, ולכן הקופסה מחזירה השמה מספקת <M>x</M>. לפי טענה 2 <M>c_x</M> חוקית.</p>
            <p><strong>לא קיימת:</strong> נניח בשלילה שהאלגוריתם החזיר צביעה <M>c_x</M>. אז הקופסה מצאה השמה מספקת <M>x</M>, ולפי טענה 2 <M>c_x</M> חוקית: סתירה.</p>
          </RevealStep>
          <RevealStep n="6" title="זמן ריצה" question="מה הם n ו-m של הקופסה, במונחי G?">
            <p><M>|V|</M> משתנים ופסוק באורך <M>O(4|E|)</M>. הקופסה: <M>n = |V|</M>, <M>m = 2|E|</M>, כלומר <M>O(|V| + |E|)</M>. ממיר הפלט: <M>O(|V|)</M>. סה"כ <M>O(|V| + |E|)</M>.</p>
          </RevealStep>
        </div>
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: 'var(--mark-soft)', borderColor: 'var(--mark)' }}>
          <div>עכשיו כתבו את ההוכחה המלאה בעצמכם, כולל הוכחת שתי טענות העזר.</div>
          <button className="btn btn-primary text-sm" onClick={() => goLab('e6')}>לתרגיל 6</button>
        </div>
      </Section>

      <Section id="spotting" scope="tut" doneKey="spotting" kicker="סיכום שיטתי" title="איך מזהים שצריך רדוקציה, ואיזו בנייה לבחור">
        <div className="grid sm:grid-cols-2 gap-3">
          {[
            ['השאלה אומרת "השתמשו באלגוריתם X כקופסה שחורה"', 'זו רדוקציה מפורשת. המשימה: ממיר קלט, ממיר פלט, הוכחה, זמן.'],

            ['אילוצים בינאריים בין זוגות', '2-SAT: כל אילוץ על זוג משתנים בוליאניים נכתב כפסוקיות של שני ליטרלים.'],
          ].map(([a, b], i) => <div key={i} className="card p-4"><div className="font-semibold">{a}</div><div className="mt-1 text-[0.95rem] c-muted">{b}</div></div>)}
        </div>
        <div className="scroll-x">
          <table className="w-full text-[0.93rem] border-collapse min-w-[520px]">
            <thead><tr className="text-start">{['בנייה', 'מה היא מקודדת', 'איפה ראינו'].map(h => <th key={h} className="text-start py-2 px-2 border-b border-line kicker">{h}</th>)}</tr></thead>
            <tbody>
              {[
                ['צלע ← שתי קשתות', 'אין כיוון', 'הרצאה 1, מסלול קצר'],
                ['שכפול קודקודים (עותקים)', 'מצב: זוגיות, "כמה צעדים עשיתי"', 'SEP ← SP; גרף שכבות במבחני עבר'],
                ['קודקוד באמצע כל צלע', 'הכפלת אורכים', 'SP ← SEP'],
                ['קודקוד חדש מחובר למקור', 'הזזת זוגיות באחד', 'SP ← SOP (תרגיל 5)'],
                ['פריט ← קודקוד, יחס ← קשת', 'סדר בין פריטים', 'תתי־מחרוזות ← המילטון'],
                ['פריט ← קשת', 'כל פריט נוצל פעם אחת', 'תתי־מחרוזות ← אוילר (הרצאה 2)'],
              ].map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j} className={'py-2 px-2 border-b border-line ' + (j === 0 ? 'font-semibold' : '')}>{c}</td>)}</tr>)}
            </tbody>
          </table>
        </div>
        <Callout type="pit" title="שאלות סגורות במבחן">
          <p>בשאלות רב־ברירה על רדוקציות (למשל בוחן 2023), האפשרויות נבדלות במילים <strong>"לכל קלט"</strong>, <strong>"קיים קלט"</strong> ו<strong>"קיימת ריצה"</strong>. הדרך לפתור: לבנות דוגמה נגדית קטנה (3–4 קודקודים) שבה הקופסה בוחרת את הפתרון ה"גרוע" מבין האופטימליים.</p>
        </Callout>
      </Section>
    </Stepper>
  );
}

function RevealInline({ children }) {

}
