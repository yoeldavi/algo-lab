const SG_NODES = [
  { w: 'THE', x: 70, y: 50 }, { w: 'HEA', x: 210, y: 50 }, { w: 'EAT', x: 350, y: 50 },
  { w: 'EAM', x: 70, y: 180 }, { w: 'TEA', x: 210, y: 180 }, { w: 'ATE', x: 350, y: 180 },
];
const canFollow = (a, b) => a.slice(1) === b.slice(0, 2);
function edgePts(a, b, hw = 36, hh = 17) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const t1 = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity);
  const t2 = Math.min(dx ? (hw + 6) / Math.abs(dx) : Infinity, dy ? (hh + 6) / Math.abs(dy) : Infinity);
  return { x1: a.x + dx * t1, y1: a.y + dy * t1, x2: b.x - dx * t2, y2: b.y - dy * t2 };
}
function SubstringPlayground() {
  const [path, setPath] = useState([]);
  const [msg, setMsg] = useState(null);
  const [showEdges, setShowEdges] = useState(true);
  const [shakeW, setShakeW] = useState(null);
  const byW = Object.fromEntries(SG_NODES.map(n => [n.w, n]));
  const edges = [];
  SG_NODES.forEach(a => SG_NODES.forEach(b => { if (a !== b && canFollow(a.w, b.w)) edges.push([a, b]); }));
  const built = path.length ? path[0] + path.slice(1).map(w => w[2]).join('') : '';
  const done = path.length === SG_NODES.length;
  const onPath = (a, b) => { for (let i = 0; i + 1 < path.length; i++) if (path[i] === a && path[i + 1] === b) return true; return false; };
  function click(w) {
    if (done) return;
    if (path.includes(w)) { setMsg({ bad: true, t: `${w} כבר במסלול. במסלול המילטון כל קודקוד מופיע בדיוק פעם אחת.` }); return; }
    if (path.length) {
      const last = path[path.length - 1];
      if (!canFollow(last, w)) {
        setShakeW(w); setTimeout(() => setShakeW(null), 400);
        setMsg({ bad: true, t: `אין קשת ${last} → ${w}: שתי האותיות האחרונות של ${last} הן "${last.slice(1)}", אבל ${w} מתחילה ב-"${w.slice(0, 2)}".` });
        return;
      }
    }
    const np = [...path, w]; setPath(np);
    if (np.length === SG_NODES.length) setMsg({ bad: false, t: 'מסלול המילטון! עברתם בכל קודקוד בדיוק פעם אחת.' });
    else setMsg(null);
  }
  const subs = done ? Array.from({ length: built.length - 2 }, (_, i) => built.slice(i, i + 3)) : [];
  return (
    <div className="card p-4 sm:p-5" style={{ background: 'var(--surface-2)' }}>
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <div className="font-semibold">מגרש משחקים: בנו מחרוזת ממסלול</div>
          <div className="text-sm c-muted">קלט: ATE, EAT, TEA, EAM, THE, HEA. לחצו על קודקודים לפי הסדר.</div>
        </div>
        <div className="flex gap-2 flex-wrap">
          <button className="btn text-sm" onClick={() => { setPath(p => p.slice(0, -1)); setMsg(null); }} disabled={!path.length}>בטל צעד</button>
          <button className="btn text-sm" onClick={() => { setPath([]); setMsg(null); }}>התחל מחדש</button>
          <button className="btn btn-ghost text-sm" onClick={() => setShowEdges(s => !s)}>{showEdges ? 'הסתר קשתות' : 'הצג קשתות'}</button>
        </div>
      </div>
      <div className="mt-3 scroll-x" dir="ltr">
        <svg viewBox="0 0 420 230" className="w-full max-w-[520px] mx-auto block" role="img" aria-label="גרף המחרוזות">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style={{ fill: 'var(--line-strong)' }} /></marker>
            <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style={{ fill: 'var(--accent)' }} /></marker>
          </defs>
          {(showEdges || path.length > 1) && edges.map(([a, b], i) => {
            const p = edgePts(a, b); const hot = onPath(a.w, b.w);
            if (!showEdges && !hot) return null;
            return <line key={i} {...p} strokeWidth={hot ? 3 : 1.5} style={{ stroke: hot ? 'var(--accent)' : 'var(--line-strong)' }} markerEnd={hot ? 'url(#arrA)' : 'url(#arr)'} />;
          })}
          {SG_NODES.map(n => {
            const idx = path.indexOf(n.w); const isLast = idx === path.length - 1 && idx >= 0;
            return (
              <g key={n.w} onClick={() => click(n.w)} style={{ cursor: done ? 'default' : 'pointer' }} className={shakeW === n.w ? 'shake' : ''}>
                <rect x={n.x - 36} y={n.y - 17} width="72" height="34" rx="8" strokeWidth={isLast ? 2.5 : 1.5}
                  style={{ fill: idx >= 0 ? 'var(--accent-soft)' : 'var(--surface)', stroke: isLast ? 'var(--mark)' : idx >= 0 ? 'var(--accent)' : 'var(--line-strong)' }} />
                <text x={n.x} y={n.y + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 15 }}>{n.w}</text>
                {idx >= 0 && <g><circle cx={n.x + 36} cy={n.y - 17} r="10" style={{ fill: 'var(--ink)' }} /><text x={n.x + 36} y={n.y - 13} textAnchor="middle" style={{ fill: 'var(--surface)', fontFamily: 'var(--f-mono)', fontSize: 11, fontWeight: 700 }}>{idx + 1}</text></g>}
              </g>

          })}

      </div>
      <div className="mt-3 grid gap-2">
        <div className="flex flex-wrap items-baseline gap-2">
          <span className="text-sm c-muted">המחרוזת שנבנתה (שלוש אותיות של הראשון, ואז האות האחרונה של כל קודקוד הבא):</span>
          <bdi dir="ltr" className="font-mono text-lg font-bold tracking-[0.18em]">{built || '—'}</bdi>
          <span className="text-xs c-muted font-mono">אורך {built.length} / {SG_NODES.length + 2}</span>
        </div>
        {msg && <div className={'text-[0.95rem] ' + (msg.bad ? 'c-pit' : 'c-tip')}>{msg.t}</div>}
        {done && (
          <div className="callout callout-tip text-[0.95rem]">
            <div>כל תתי־המחרוזות באורך 3 של <M>{built}</M>: {subs.map((s, i) => <M key={i}>{s}</M>)}. בדיוק המחרוזות בקלט. זה הרעיון של טענה 1.</div>
            <div className="mt-1">שימו לב: ל-<M>THE</M> אין קשתות נכנסות ול-<M>EAM</M> אין קשתות יוצאות, ולכן כל מסלול המילטון בגרף הזה חייב להתחיל ב-<M>THE</M> ולהסתיים ב-<M>EAM</M>.</div>
          </div>
        )}
      </div>
    </div>
  );
}

          <svg viewBox="0 0 260 190" className="w-full max-w-[300px] block" dir="ltr" role="img" aria-label="הגרף G">
            {DC_E.map(([u, v], i) => <line key={i} x1={DC_POS_G[u][0]} y1={DC_POS_G[u][1]} x2={DC_POS_G[v][0]} y2={DC_POS_G[v][1]} strokeWidth={hotG.has(u + v) ? 3.5 : 1.8} style={{ stroke: hotG.has(u + v) ? 'var(--accent)' : 'var(--line-strong)' }} />)}
            {DC_V.map(v => <g key={v}><circle cx={DC_POS_G[v][0]} cy={DC_POS_G[v][1]} r="16" strokeWidth="1.8" style={{ fill: v === target ? 'var(--mark-soft)' : 'var(--surface)', stroke: v === target ? 'var(--mark)' : 'var(--ink)' }} /><text x={DC_POS_G[v][0]} y={DC_POS_G[v][1] + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 14 }}>{v}</text></g>)}
          </svg>
        </div>
        <div className="min0">
          <div className="kicker">G′ · עליון: V₁ (זוגי עד כה) · תחתון: V₂ (אי־זוגי עד כה)</div>
          <svg viewBox="0 0 335 195" className="w-full max-w-[420px] block" dir="ltr" role="img" aria-label="הגרף G′">
            {DC_E.flatMap(([u, v], i) => [[u + '1', v + '2'], [u + '2', v + '1']].map(([p, q], j) => {
              const a = P2(p[0], p[1]), b = P2(q[0], q[1]); const hot = hotPrime.has(p + '|' + q);
              return <line key={i + '-' + j} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} strokeWidth={hot ? 3.5 : 1.4} style={{ stroke: hot ? 'var(--accent)' : 'var(--line-strong)' }} />;
            }))}
            {DC_V.flatMap(v => ['1', '2'].map(c => {
              const [x, y] = P2(v, c); const isT = v === target && c === '1'; const isS = v === 's' && c === '1';
              return <g key={v + c}><circle cx={x} cy={y} r="16" strokeWidth="1.8" style={{ fill: isT ? 'var(--mark-soft)' : isS ? 'var(--accent-soft)' : 'var(--surface)', stroke: isT ? 'var(--mark)' : 'var(--ink)' }} /><text x={x} y={y + 5} textAnchor="middle" style={{ fill: 'var(--ink)', fontFamily: 'var(--f-mono)', fontWeight: 700, fontSize: 13 }}>{v}<tspan fontSize="9" dy="3">{c}</tspan></text></g>;
            }))}
          </svg>
        </div>
      </div>
      <div className="mt-3 text-[0.95rem] grid gap-1">
        <div>BFS מ-<M>s_1</M> ב-G′: <M>{`d(s_1, ${target}_1) = ${t1 in dist ? dist[t1] : '∞'}`}</M>. לכן אורך המסלול הזוגי הקצר ביותר מ-<M>s</M> ל-<M>{target}</M> ב-G הוא <strong>{t1 in dist ? dist[t1] : '∞'}</strong>.</div>
        <div>המסלול ב-G′: <M>{path.map(p => p[0] + '_' + p[1]).join(' → ')}</M>. אותו מסלול ב-G (מוחקים את מספר העותק): <M>{gWalk.join(' → ')}</M>.</div>
        {target === 'a' && <div className="c-behind">שימו לב: המסלול חוזר ל-<M>a</M> פעמיים. "מסלול" כאן מותר לחזור על קודקודים, ולכן משולש (מעגל באורך אי־זוגי) מאפשר "להחליף זוגיות".</div>}
      </div>
    </div>
  );
}

function Stepper({ scope, items, children, onFinish, finishLabel }) {
  const { progress } = useApp();
  const [idx, setIdx] = usePersist('step:' + scope, 0);
  const slides = [];
  React.Children.toArray(children).forEach(ch => {
    if (ch.type === Section || !slides.length) slides.push([ch]); else slides[slides.length - 1].push(ch);
  });
  const n = slides.length;
  const i = Math.min(Math.max(idx || 0, 0), n - 1);
  const topRef = useRef(null);
  const segRef = useRef(null);
  const goTo = j => {
    if (j < 0 || j >= n) return;
    setIdx(j);
    requestAnimationFrame(() => {
      const el = topRef.current; if (!el) return;
      const y = el.getBoundingClientRect().top + window.scrollY - 84;
      if (el.getBoundingClientRect().top < 84 || el.getBoundingClientRect().top > window.innerHeight * .5) window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    });
  };
  useEffect(() => {
    const h = e => {
      const t = e.target;
      if (t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
      if (e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(i + 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(i - 1); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [i, n]);
  useEffect(() => {
    const box = segRef.current; if (!box) return;
    const cur = box.querySelector('[aria-current="step"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }, [i]);
  const doneCount = items.filter(([id]) => progress[scope][id]).length;
  const prev = i > 0 ? items[i - 1] : null;
  const next = i < n - 1 ? items[i + 1] : null;
  return (
    <div className="grid gap-5" ref={topRef}>
      <div className="card p-3 sm:p-4 grid gap-3">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <div className="flex items-baseline gap-2">
            <span className="kicker">חלק</span>
            <span className="font-display text-xl"><bdi dir="ltr">{i + 1} / {n}</bdi></span>
            <span className="font-semibold">{items[i][1]}</span>
          </div>
          <span className="text-sm c-muted">{doneCount} מתוך {n} סומנו כהובנו · אפשר לנווט גם בחצים במקלדת</span>
        </div>
        <div className="flex gap-1">
          {items.map(([id], j) => (
            <span key={id} className="h-1.5 flex-1 rounded-full" style={{ background: j === i ? 'var(--mark)' : progress[scope][id] ? 'var(--accent)' : 'var(--sunken)' }} />
          ))}
        </div>
        <div ref={segRef} className="flex gap-1.5 scroll-x pb-1" role="tablist" aria-label="חלקי השיעור">
          {items.map(([id, t], j) => (
            <button key={id} className="seg" aria-current={j === i ? 'step' : undefined} onClick={() => goTo(j)}>
              <span className="n">{j + 1}</span>{t}{progress[scope][id] && <span style={{ color: j === i ? 'var(--mark)' : 'var(--tip)' }}>{Ico.check}</span>}
            </button>
          ))}
        </div>
      </div>

      <div key={i} className="slide-in grid gap-6">{slides[i]}</div>

      <nav className="flex gap-3 items-stretch" aria-label="ניווט בין חלקים">
        {prev ? (
          <button className="navbtn" onClick={() => goTo(i - 1)}>
            <span className="lbl"><span aria-hidden="true">→</span> הקודם</span>
            <span className="sub">{prev[1]}</span>
          </button>
        ) : <div className="flex-1" />}
        {next ? (
          <button className="navbtn next" onClick={() => goTo(i + 1)}>
            <span className="lbl">הבא <span aria-hidden="true">←</span></span>
            <span className="sub">{next[1]}</span>
          </button>
        ) : (
          <button className="navbtn next" onClick={onFinish}>
            <span className="lbl">{finishLabel} <span aria-hidden="true">←</span></span>
            <span className="sub">סיימתם את כל החלקים</span>
          </button>
        )}
      </nav>
    </div>
  );
}

      <Section id="example-sp" scope="lec" doneKey="example-sp" kicker="הרצאה 1 · עמ׳ 3–4" title="דוגמה ראשונה: מסלול קצר ביותר בגרף לא מכוון">
        <p>נתון אלגוריתם יעיל שמוצא מסלול קצר ביותר בין שני קודקודים בגרף <strong>מכוון</strong>. איך נמצא בעזרתו מסלול קצר ביותר בגרף <strong>לא מכוון</strong>? מחליפים כל צלע בשתי קשתות מכוונות, אחת לכל כיוון.</p>
        <Def tag="פירוט הרדוקציה">
          <p><strong>ממיר הקלט:</strong> בהינתן גרף לא מכוון <M>G = (V, E)</M> וקודקודים <M>s, t ∈ V</M>, מחזירים את הגרף המכוון <M>G′ = (V, E′)</M> ואת אותם <M>s, t</M>, כאשר</p>
          <p className="text-center"><M>{"E′ = { (u,v), (v,u) : {u,v} ∈ E }"}</M></p>
          <p><strong>ממיר הפלט:</strong> מחזירים את הפלט של האלגוריתם ללא שינוי.</p>
          <p><strong>האלגוריתם:</strong> (1) מריצים את ממיר הקלט ומקבלים <M>G′, s, t</M>. (2) מוצאים מסלול קצר ביותר מ-<M>s</M> ל-<M>t</M> ב-<M>G′</M>. (3) מחזירים את המסלול, או "לא קיים".</p>
        </Def>
        <Def tag="משפט + טענת עזר">
          <p><strong>משפט:</strong> האלגוריתם מחזיר מסלול קצר ביותר מ-<M>s</M> ל-<M>t</M> ב-<M>G</M>, אם קיים.</p>
          <p><strong>טענת עזר:</strong> <M>P</M> הוא מסלול באורך <M>ℓ</M> מ-<M>s</M> ל-<M>t</M> ב-<M>G</M> אם ורק אם <M>P</M> הוא מסלול באורך <M>ℓ</M> מ-<M>s</M> ל-<M>t</M> ב-<M>G′</M>.</p>
        </Def>
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: 'var(--mark-soft)', borderColor: 'var(--mark)' }}>
          <div><strong>ההרצאה לא הוכיחה את המשפט.</strong> זה בדיוק התרגיל הראשון במעבדה.</div>
          <button className="btn btn-primary text-sm" onClick={() => goLab('e1')}>לתרגיל 1 במעבדה</button>
        </div>
        <Def tag="ניתוח זמן ריצה">
          <ul>
            <li>ממיר הקלט: שתי קשתות לכל צלע, <M>O(|V| + |E|)</M>.</li>
            <li>מציאת המסלול: BFS, <M>O(|V| + |E|)</M>.</li>
            <li>ממיר הפלט: <M>O(1)</M>. סך הכול <M>O(|V| + |E|)</M>.</li>
          </ul>
        </Def>
        <IntuitionCheck
          q="למה מספיק שממיר הפלט יחזיר את המסלול בלי שום שינוי?"
          options={[
            { t: 'כי כל מסלול ב-G′ הוא גם מסלול ב-G, עם אותה סדרת קודקודים ואותו אורך.', correct: true, why: 'קבוצת הקודקודים זהה, וכל קשת (u,v) ב-E′ באה מצלע {u,v} ב-E. לכן אין צורך "לתרגם" כלום. זה כיוון ⇐ של טענת העזר.' },
            { t: 'כי BFS תמיד מחזיר מסלול פשוט.', correct: false, why: 'אסור להניח איך הקופסה השחורה עובדת. ההצדקה צריכה לבוא ממבנה G′, לא מ-BFS.' },
            { t: 'כי G′ קטן יותר מ-G.', correct: false, why: 'למעשה ב-G′ יש פי שניים קשתות. הגודל לא קשור לשאלה.' },
          ]}
        />
        <Callout type="pit" title="קשת לכיוון אחד בלבד">
          <p>אילו ממיר הקלט היה הופך כל צלע לקשת <em>אחת</em> בכיוון שרירותי, כיוון ⇒ של טענת העזר היה נשבר: מסלול ב-<M>G</M> שעובר בצלע "נגד הכיוון" לא היה קיים ב-<M>G′</M>, והקופסה הייתה עלולה לא למצוא את המסלול הקצר ביותר.</p>
        </Callout>
      </Section>

      <Section id="formal" scope="lec" doneKey="formal" kicker="הרצאה 1 · עמ׳ 4" title="ההגדרה הפורמלית של רדוקציה">
        <Def>
          <p>תהיינה <M>A</M> ו-<M>B</M> שתי בעיות. <strong>רדוקציה מ-A ל-B</strong> היא זוג אלגוריתמים <M>f, g</M> כך ש:</p>
          <ul>
            <li><M>f</M> הוא <strong>ממיר הקלט</strong>: ממיר מופע של <M>A</M> למופע של <M>B</M>.</li>
            <li><M>g</M> הוא <strong>ממיר הפלט</strong>: מקבל את הקלט לבעיה <M>A</M> ואת הפתרון למופע המתאים של <M>B</M>, ומחזיר פתרון למופע של <M>A</M>.</li>
          </ul>
          <p><strong>האלגוריתם:</strong> (1) עבור מופע <M>x</M> של <M>A</M>, מחשבים <M>f(x)</M>. (2) מחשבים פתרון <M>y</M> למופע <M>f(x)</M> של <M>B</M>. (3) מחזירים את <M>g(x, y)</M>.</p>
          <p><strong>נכונות הרדוקציה:</strong> לכל מופע <M>x</M> של <M>A</M>, <span className="hl">אם <M>y</M> הוא פתרון</span> למופע <M>f(x)</M> של <M>B</M>, אז <M>g(x, y)</M> הוא פתרון למופע <M>x</M> של <M>A</M>.</p>
        </Def>
        <Callout type="behind" title="למה g מקבל גם את x?">
          <p>לעתים קרובות הפתרון של <M>B</M> חסר משמעות בלי ההקשר המקורי. ב-SEP ← SP מהתרגול, ממיר הפלט צריך לדעת אילו קודקודים ב-<M>G′</M> הם העותקים <M>u_1</M> של קודקודי <M>V</M>. בתרגול כותבים <M>g(b)</M> בלבד, ובהרצאה <M>g(x, y)</M>. ההגדרה של ההרצאה כללית יותר, ובטוח יותר לכתוב אותה.</p>
        </Callout>
        <Callout type="behind" title="'אם y הוא פתרון' פירושו: לכל פתרון">
          <p>ההגדרה לא אומרת "קיים פתרון y שעבורו g עובד". היא דורשת ש-<M>g</M> יעבוד על <strong>כל</strong> פתרון שהקופסה עשויה להחזיר. אם ל-<M>f(x)</M> יש שני פתרונות אופטימליים ורק אחד מהם מתורגם נכון, הרדוקציה שגויה. שאלה 3 בבוחן האמצע של 2023 בנויה בדיוק על זה, והיא במעבדה כתרגיל 7.</p>
        </Callout>
        <Callout type="pit" title="זמן הריצה של הקופסה נמדד על f(x)">
          <p>בניתוח זמן הריצה צריך להביא בחשבון את <strong>גודל</strong> הקלט שמזינים לאלגוריתם ל-<M>B</M>, כלומר את <M>|f(x)|</M>, ואז לבטא אותו במונחי הקלט המקורי.</p>
        </Callout>
        <IntuitionCheck
          q="ממיר הקלט הופך גרף עם n קודקודים לגרף עם n² קודקודים. הקופסה השחורה רצה בזמן O(N log N) על גרף עם N קודקודים. מה זמן הריצה שלה במונחי n?"
          options={[
            { t: 'O(n log n)', correct: false, why: 'זה הזמן על הקלט המקורי, אבל הקופסה לא רצה עליו. היא רצה על f(x).' },
            { t: 'O(n² log n)', correct: true, why: 'מציבים N = n²: O(n² log n²) = O(2n² log n) = O(n² log n).' },
            { t: 'O(n²)', correct: false, why: 'שכחתם את גורם ה-log. log(n²) = 2 log n, וזה לא קבוע.' },
          ]}
        />
      </Section>

      <Section id="substrings" scope="lec" doneKey="substrings" kicker="הרצאה 1 · עמ׳ 5" title="בעיית תתי־המחרוזות">
        <Def tag="הבעיה">
          <p><strong>קלט:</strong> אוסף של <M>n</M> מחרוזות, כל אחת באורך 3. דוגמה: <M>GUR, URI, NGU, BEN, ION, ENG, RIO</M>.</p>
          <p><strong>פלט חוקי:</strong> מחרוזת באורך <M>n + 2</M> שמחרוזות הקלט הן <strong>בדיוק</strong> כל תתי־המחרוזות שלה באורך 3. בדוגמה: <M>BENGURION</M>.</p>
          <p><strong>גרסת ההכרעה:</strong> "כן" אם קיימת מחרוזת כזו, ו"לא" אחרת. <strong>הנחה מפשטת:</strong> כל מחרוזת מופיעה בקלט פעם אחת בלבד.</p>
        </Def>
        <p>דרך נוספת לראות את הבעיה: מישהו החזיק מחרוזת באורך <M>n + 2</M>, גזר ממנה את כל תתי־המחרוזות באורך 3 ונתן לנו אותן בסדר כלשהו. המוטיבציה: ריצוף גנום.</p>
        <p><strong>פתרון נאיבי:</strong> בודקים את כל <M>n!</M> הסידורים. סידור מתאים אם שתי האותיות האחרונות של כל מחרוזת הן שתי האותיות הראשונות של המחרוזת שאחריה. זה לא יעיל: <M>{"n! = 2^{Θ(n log n)}"}</M>.</p>
        <Def tag="הגדרה">
          <p>מחרוזת <M>w_j</M> <strong>יכולה להופיע אחרי</strong> מחרוזת <M>w_i</M> אם שתי האותיות האחרונות של <M>w_i</M> הן שתי האותיות הראשונות של <M>w_j</M>.</p>
        </Def>
        <p>מייצגים בגרף אילו מחרוזות יכולות להופיע זו אחרי זו. נסו בעצמכם על הדוגמה מההרצאה:</p>
        <SubstringPlayground />
        <Callout type="tip" title="התנועה החשובה של השבוע">
          <p>כשיש יחס בין פריטים ("מי יכול לבוא אחרי מי"), זה סימן לגרף מכוון: הפריטים הם קודקודים והיחס הוא הקשתות. שאלה על <em>סידור</em> של כל הפריטים הופכת לשאלה על <em>מסלול</em> שעובר בכולם.</p>
        </Callout>
        <IntuitionCheck
          q="איפה ההנחה 'כל מחרוזת מופיעה בקלט פעם אחת' באמת עוזרת?"
          options={[
            { t: 'היא מבטיחה שיש מסלול המילטון.', correct: false, why: 'היא לא מבטיחה קיום של שום דבר. יש קלטים בלי פתרון גם תחת ההנחה.' },
            { t: 'בזכותה יש התאמה חד־חד־ערכית בין מחרוזות לקודקודים, וטיעון הספירה עובד: n מחרוזות שונות ובדיוק n מקומות התחלה.', correct: true, why: 'בהוכחה בהרצאה 2 משתמשים בכך ש-T באורך n+2 מכילה לכל היותר n תתי־מחרוזות שונות באורך 3, והקלט מכיל n שונות. לכן הן בדיוק אותן מחרוזות.' },
            { t: 'היא מקטינה את זמן הריצה של בניית הגרף.', correct: false, why: 'בניית הגרף היא O(n²) בכל מקרה: בודקים כל זוג מחרוזות.' },
          ]}
        />
      </Section>

      <Section id="hamilton" scope="lec" doneKey="hamilton" kicker="הרצאה 1 · עמ׳ 6" title="רדוקציה למסלול המילטון ונכונותה">
        <p>חזרנו לבעיה מתחילת השיעור. קיבלנו רדוקציה מבעיית ההכרעה של תתי־המחרוזות לבעיית <strong>קיום</strong> מסלול המילטון בגרף מכוון.</p>
        <Def tag="הרדוקציה">
          <p><strong>ממיר הקלט:</strong> קלט <M>w_1, …, w_n</M>. פלט: גרף מכוון <M>G = (V, E)</M> עם <M>{"V = {w_1, …, w_n}"}</M>, ויש קשת מ-<M>w_i</M> ל-<M>w_j</M> אם <M>w_j</M> יכולה להופיע אחרי <M>w_i</M>.</p>
          <p><strong>ממיר הפלט (הכרעה):</strong> מחזירים "כן" אם ורק אם האלגוריתם לקיום מסלול המילטון החזיר "כן".</p>
        </Def>
        <Def tag="נכונות">
          <p><strong>משפט:</strong> יש פתרון לבעיית תתי־המחרוזות אם ורק אם האלגוריתם מחזיר "כן".</p>
          <p><strong>טענה 1:</strong> אם אין פתרון לבעיה, אז אין מסלול המילטון בגרף.</p>
          <p><strong>טענה 2:</strong> אם יש פתרון לבעיה, אז קיים מסלול המילטון בגרף.</p>
          <p><strong>מהטענות למשפט:</strong></p>
          <ul>
            <li>אם יש פתרון, לפי טענה 2 יש מסלול המילטון. לכן האלגוריתם לבדיקת מסלול המילטון מחזיר "כן", וכך גם האלגוריתם שלנו.</li>
            <li>אם אין פתרון, לפי טענה 1 אין מסלול המילטון. לכן הוא מחזיר "לא", וכך גם האלגוריתם שלנו.</li>
          </ul>
        </Def>
        <Callout type="behind" title="למה טענה 1 מנוסחת 'הפוך'?">
          <p>טענה 1 היא זו שמגינה מפני "כן" שגוי. בניסוח השלילי ("אין X ⇒ אין Y") קשה לעבוד, ולכן מוכיחים את הטענה השקולה: <strong>אם יש מסלול המילטון, אז יש פתרון</strong>. כך ההוכחה הופכת לבנייה: מקבלים מסלול ובונים ממנו מחרוזת. זה בדיוק מה שעושים בהרצאה 2. כלל אצבע: טענה מהצורה "אין… ⇒ אין…" כמעט תמיד מוכחת דרך השלילה ההפוכה שלה.</p>
        </Callout>
        <Callout type="tip" title="תבנית לבעיות הכרעה">
          <p>שתי טענות עזר, אחת לכל כיוון, ואז שתי שורות שמחברות אותן לתשובה של הקופסה השחורה. שמרו את התבנית הזו; היא חוזרת בכל רדוקציה של בעיית הכרעה.</p>
        </Callout>
        <div className="grid sm:grid-cols-2 gap-3">
          <div className="card p-4 flex flex-col gap-2"><div className="kicker">נסו לבד</div><div>הוכיחו את טענה 2: ממחרוזת לפתרון למסלול המילטון.</div><button className="btn text-sm self-start" onClick={() => goLab('e2')}>לתרגיל 2</button></div>
          <div className="card p-4 flex flex-col gap-2"><div className="kicker">נסו לבד</div><div>הוכיחו את טענה 1 בניסוח השקול: ממסלול למחרוזת.</div><button className="btn text-sm self-start" onClick={() => goLab('e3')}>לתרגיל 3</button></div>
        </div>
        <Def tag="הרחבה: בעיית החיפוש">
          <p><strong>ממיר הפלט:</strong> בהינתן מסלול המילטון <M>{"w_{i1}, w_{i2}, …, w_{in}"}</M>, בונים מחרוזת באורך <M>n + 2</M>: מתחילים ב-<M>{"w_{i1}"}</M>, ומוסיפים לפי הסדר את האות האחרונה של <M>{"w_{i2}"}</M>, של <M>{"w_{i3}"}</M> וכן הלאה. אם אין מסלול המילטון, מחזירים "אין פתרון".</p>
        </Def>
        <IntuitionCheck
          q="הרדוקציה נכונה, אבל לבעיית מסלול המילטון לא ידוע אלגוריתם יעיל, ולכן האלגוריתם שקיבלנו אקספוננציאלי. מה המסקנה?"
          options={[
            { t: 'בעיית תתי־המחרוזות קשה.', correct: false, why: 'רדוקציה מ-A ל-B מראה ש-A לא קשה יותר מ-B. היא לא אומרת כלום על כך ש-A קשה.' },
            { t: 'צריך לבחור בעיית יעד אחרת, שיש לה אלגוריתם יעיל.', correct: true, why: 'זה בדיוק מה שקורה בהרצאה 2: רדוקציה למסלול אוילר, שנפתר בזמן O(|E|). קשתות במקום קודקודים.' },
            { t: 'הרדוקציה שגויה.', correct: false, why: 'הרדוקציה נכונה. נכונות ויעילות הן שתי שאלות נפרדות.' },
          ]}
        />
        <Callout type="tip" title="מה מחכה בהרצאה 2">
          <p>בנייה חדשה: כל מחרוזת תהיה <strong>קשת</strong> (מהתחילית בת שתי האותיות לסופית שלה), ומסלול שעובר בכל קשת בדיוק פעם אחת הוא מסלול אוילר. אותו רעיון, בחירה חכמה יותר של בעיית היעד.</p>
        </Callout>
      </Section>

      <div className="card p-5 sm:p-6" style={{ background: 'var(--ink)', color: 'var(--surface)', borderColor: 'var(--ink)' }}>
        <div className="kicker" style={{ color: 'var(--mark)' }}>כרטיס סיכום · הרצאה 1</div>
        <ul className="mt-2 grid gap-1.5 text-[0.98rem]" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>אלגוריתם חייב להחזיר פתרון חוקי לכל קלט שיש לו פתרון, ו"אין פתרון" לכל קלט שאין לו.</li>
          <li>רדוקציה = ממיר קלט <M>f</M> + ממיר פלט <M>g(x, y)</M>. הקופסה השחורה היא קופסה: לא מניחים עליה כלום מלבד נכונות.</li>
          <li>נכונות: לכל <M>x</M> ולכל פתרון <M>y</M> של <M>f(x)</M>, <M>g(x, y)</M> פתרון של <M>x</M>.</li>
          <li>זמן ריצה: ממיר קלט + קופסה על <M>|f(x)|</M> + ממיר פלט.</li>
          <li>הוכחה מלמעלה למטה: משפט ← טענות עזר ← המשפט מהטענות ← הוכחת הטענות.</li>
        </ul>
      </div>
    </Stepper>
  );
}

            })}
          </div>
          {ans[i] && <div className={'mt-2 text-sm ' + (ans[i] === it.a ? 'c-tip' : 'c-pit')}><strong>{ans[i] === it.a ? 'נכון. ' : 'לא. '}</strong><span className="text-ink">{ans[i] === it.a ? it.why : 'נסו שוב.'}</span></div>}
        </div>
      ))}
    </div>
  );
}

function TutorialTab({ goLab, goTab }) {
  return (
    <Stepper scope="tut" items={TUT_SECTIONS} onFinish={() => goTab('lab')} finishLabel="למעבדת ההוכחות">

      <Section id="basics" scope="tut" doneKey="basics" kicker="תרגול 1 · עמ׳ 1–3" title="שפה משותפת: בעיה, מופע, פתרון, הוכחה">
        <p>בבעיה נשאלת שאלה קבועה על קלט משתנה שנקרא <strong>מופע</strong>. בדוגמת מפת הכבישים: המופע הוא המפה, עיר המוצא ועיר היעד; הפתרון הוא מסלול קצר ביותר בין הערים.</p>
        <Def tag="הוכחת נכונות פורמלית">
          <p>סדרה של טענות, שכל אחת נגררת לוגית <strong>רק</strong> מידע מוקדם מוכח ומהנחות על הקלט, והטענה האחרונה היא המסקנה המבוקשת.</p>
          <p>כדי להוכיח שאלגוריתם מחזיר מסלול קצר ביותר, צריך להוכיח שני מקרים: (א) קיים מסלול בין הערים; (ב) לא קיים מסלול.</p>
        </Def>
        <ClassifyQuiz />
        <Def tag="תזכורת: O גדול">
          <p><M>f(n) = O(g(n))</M> אם קיימים <M>{"c > 0"}</M> ו-<M>n_0</M> כך שלכל <M>n ≥ n_0</M> מתקיים <M>f(n) ≤ c·g(n)</M>.</p>
          <p>קבוע <M>O(1)</M>, ליניארי <M>O(n)</M>, פולינומיאלי <M>O(n^c)</M>, אקספוננציאלי <M>{"O(2^{nᶜ})"}</M>. בקורס נחפש אלגוריתמים פולינומיאליים בדרגה נמוכה.</p>
        </Def>
        <Callout type="tip" title="שלושת החלקים של כל תשובה">
          <p>"מעתה ואילך, בכל פעם שנבקש פתרון לבעיה, ברירת המחדל היא לפרט את שלושת האספקטים": תיאור האלגוריתם, הוכחה פורמלית של נכונותו, מימוש וניתוח זמן ריצה. בבדיקה במעבדה הם מקבלים שדות נפרדים בדיוק בגלל זה.</p>
        </Callout>
      </Section>

      <Section id="formal-tut" scope="tut" doneKey="formal-tut" kicker="תרגול 1 · עמ׳ 4–5" title="ההגדרה הפורמלית, בגרסת התרגול">
        <Def>
          <p>רדוקציה מ-<M>A</M> ל-<M>B</M> היא זוג פונקציות <M>f, g</M>: <M>f</M> מעבירה מופע של <M>A</M> למופע של <M>B</M>; <M>g</M> מעבירה פתרון של <M>B</M> לפתרון של <M>A</M>. <strong>נכונות:</strong> לכל מופע <M>a</M> של <M>A</M>, אם <M>B(f(a))</M> פתרון למופע <M>f(a)</M>, אז <M>g(B(f(a)))</M> פתרון למופע <M>a</M>.</p>
        </Def>
        <ul className="prose-he grid gap-1" style={{ listStyle: 'disc', paddingInlineStart: '1.2rem' }}>
          <li>בהוכחה האלגוריתם ל-<M>B</M> הוא <strong>קופסה שחורה</strong>: לא מניחים דבר על אופן פעולתו מלבד שהוא פותר נכון את <M>B</M> לכל מופע.</li>
          <li>מותר להפעיל את הקופסה <strong>כמה פעמים</strong>. עדיין אומרים ש-<M>A</M> ניתנת לרדוקציה ל-<M>B</M>.</li>
          <li>זמן הריצה: שלושה רכיבים (תרגום קלט, קופסה, תרגום פלט). אסימפטוטית זה המקסימום מביניהם, כלומר אותו דבר כמו הסכום.</li>
          <li>גודל הקלט ל-<M>B</M> יכול להיות שונה מהמקורי, ומנתחים כפונקציה של הקלט המקורי.</li>
        </ul>
        <Callout type="behind" title="הרצאה מול תרגול: g(b) או g(x, y)?">
          <p>בתרגול <M>g</M> מקבל רק את הפתרון של <M>B</M>; בהרצאה הוא מקבל גם את הקלט המקורי. בפועל, כמעט תמיד ממיר הפלט משתמש בקלט המקורי (למשל כדי לדעת מי הם <M>u_1</M>). כתבו <M>g(x, y)</M> ותהיו מכוסים בשתי הגרסאות.</p>
        </Callout>
      </Section>

      <Section id="sep-sp" scope="tut" doneKey="sep-sp" kicker="תרגול 1 · דוגמה 1" title="SEP ← SP: מסלול זוגי קצר ביותר בעזרת מסלול קצר ביותר">
        <Def tag="הבעיות">
          <p><strong>SP:</strong> גרף לא מכוון <M>G = (V, E)</M> וקודקוד <M>s</M>. יש למצוא <M>d(s, u)</M> לכל <M>u ∈ V</M> (∞ אם אין מסלול).</p>
          <p><strong>SEP:</strong> אותו קלט. יש למצוא לכל <M>u ∈ V</M> את אורך המסלול (בצלעות) <strong>הזוגי</strong> הקצר ביותר מ-<M>s</M> ל-<M>u</M>, או ∞.</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="מה ההבדל בין מה שיש לנו למה שצריך?" question="מה הדבר היחיד ש-SEP דורש ו-SP לא יודע לעשות?">
            <p>אילוץ הזוגיות. SP (למשל BFS) לא מבדיל בין אורכים זוגיים לאי־זוגיים. אז צריך גרף שבו "מרחק רגיל" כבר <strong>מקודד</strong> את הזוגיות.</p>
          </RevealStep>
          <RevealStep n="2" title="הרעיון: הגרף יזכור את הזוגיות" question="איך קודקוד בגרף יכול 'לזכור' אם עברנו עד עכשיו מספר זוגי או אי־זוגי של צלעות?">
            <p>שני עותקים לכל קודקוד: <M>u_1</M> פירושו "הגעתי ל-u אחרי מספר זוגי של צלעות", <M>u_2</M> פירושו "אחרי מספר אי־זוגי". כל צלע מחליפה עותק. זה <strong>כיסוי דו־חלקי</strong>: מסלול מ-<M>s_1</M> ל-<M>v_1</M> חייב להיות זוגי.</p>
          </RevealStep>
          <DoubleCover />
          <RevealStep n="3" title="ממיר הקלט, במדויק" question="איך כותבים את G′ כקבוצות, לא כציור?">
            <p><M>{"V′ = V_1 ∪ V_2"}</M> כאשר <M>{"V_1 = { u_1 : u ∈ V }"}</M>, <M>{"V_2 = { u_2 : u ∈ V }"}</M>.</p>
            <p><M>{"E′ = { (u_1, v_2), (u_2, v_1) : (u, v) ∈ E }"}</M>. מקור: <M>s_1</M>.</p>
          </RevealStep>
          <RevealStep n="4" title="ממיר הפלט" question="מהי התשובה ל-u, במונחי הפלט של SP על G′?">
            <p>לכל <M>u ∈ V</M> מחזירים את <M>d(s_1, u_1)</M> ב-<M>G′</M> כאורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>u</M> ב-<M>G</M>.</p>
          </RevealStep>
          <RevealStep n="5" title="מבנה ההוכחה" question="מהי הטענה הראשית, ומה הייתי צריך לדעת כדי שתצא מיד?">
            <p><strong>טענה ראשית:</strong> לכל <M>v ∈ V</M>, אורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>v</M> ב-<M>G</M> שווה ל-<M>d(s_1, v_1)</M> ב-<M>G′</M>.</p>
            <p><strong>אבחנה:</strong> כל מסלול מ-<M>s_1</M> לקודקוד ב-<M>V_1</M> הוא באורך זוגי (הקודקודים מתחלפים בין <M>V_1</M> ל-<M>V_2</M>).</p>
            <p><strong>טענת עזר:</strong> קיים ב-<M>G</M> מסלול באורך <M>2m</M> מ-<M>s</M> ל-<M>v</M> אם ורק אם קיים ב-<M>G′</M> מסלול באורך <M>2m</M> מ-<M>s_1</M> ל-<M>v_1</M>.</p>
            <p><strong>מהטענה למשפט:</strong> יהי <M>2m</M> המינימום ב-<M>G</M>. לפי ⇒, <M>d(s_1, v_1) ≤ 2m</M>. אם היה ב-<M>G′</M> מסלול קצר יותר, הוא זוגי (אבחנה), נניח <M>{"2k < 2m"}</M>, ולפי ⇐ יש ב-<M>G</M> מסלול זוגי באורך <M>2k</M>: סתירה. ואם אין ב-<M>G</M> מסלול זוגי, אילו <M>{"d(s_1, v_1) < ∞"}</M> הייתה אותה סתירה.</p>
            <p><strong>הוכחת טענת העזר:</strong> ממפים <M>(s, u_1, u_2, …, v)</M> ל-<M>(s_1, u_1^2, u_2^1, …, v_1)</M> (העותק מתחלף), וכל צלע עוברת לפי בניית <M>E′</M>. אפשר לכתוב את שני הכיוונים יחד כשרשרת ⇔.</p>
          </RevealStep>
          <Callout type="behind" title="'האם זה מספיק?' (שאלה מהתרגול)">
            <p>להראות רק שכל מסלול ב-<M>G′</M> מתאים למסלול זוגי ב-<M>G</M> (כיוון ⇐) מבטיח שהקופסה לא מחזירה ערך <em>קטן מדי</em>. אבל ייתכן שב-<M>G′</M> חסר מסלול, והקופסה תחזיר ערך <em>גדול מדי</em>. בשביל זה צריך את ⇒. בטענה על אופטימום תמיד צריך את שני האי־שוויונות.</p>
          </Callout>
          <RevealStep n="6" title="זמן ריצה" question="מה גודל G′ ביחס ל-G?">
            <p><M>|V′| = 2|V|</M>, <M>|E′| = 2|E|</M>. בנייה: <M>O(|V| + |E|)</M>. BFS על <M>G′</M>: <M>O(|V′| + |E′|) = O(|V| + |E|)</M>. תרגום הפלט: <M>O(|V|)</M>. סה"כ <M>O(|V| + |E|)</M>.</p>
          </RevealStep>
        </div>
        <Callout type="pit">
          <p>ההוכחה מהתרגול מטפלת במפורש גם במקרה <strong>∞</strong>. בבחינות זה המקום שבו מאבדים נקודות הכי בקלות.</p>
        </Callout>
      </Section>

      <Section id="sp-sep" scope="tut" doneKey="sp-sep" kicker="תרגול 1 · דוגמה 2" title="SP ← SEP: הכיוון ההפוך, ולמה הבעיות שקולות">
        <div className="grid gap-5">
          <RevealStep n="1" title="מה הטריק הפעם?" question="יש קופסה ל-SEP. איך גורמים לכל מסלול להיות זוגי, בלי לאבד מידע על האורך?">
            <p>מוסיפים קודקוד באמצע כל צלע. כל מסלול באורך <M>m</M> ב-<M>G</M> הופך למסלול באורך <M>2m</M> ב-<M>G′</M>, ולהפך. מריצים SEP על <M>G′</M> ומחזירים חצי.</p>
          </RevealStep>
          <RevealStep n="2" title="ממיר הקלט, במדויק" question="איך מגדירים את קודקודי הביניים כך שלכל צלע יהיה בדיוק אחד?">
            <p><M>{"V* = { uv : (u, v) ∈ E }"}</M> (הקודקוד <M>uv</M> והקודקוד <M>vu</M> הם אותו קודקוד), <M>{"V′ = V ∪ V*"}</M>, <M>{"E′ = { (u, uv), (v, uv) : (u, v) ∈ E }"}</M>. <M>G′</M> דו־חלקי עם הצדדים <M>V</M> ו-<M>V*</M>.</p>
          </RevealStep>
          <RevealStep n="3" title="ממיר הפלט" question="מה מחזירים לכל u ∈ V?">
            <p>את מחצית אורך המסלול הזוגי המינימלי מ-<M>s</M> ל-<M>u</M> ב-<M>G′</M>.</p>
          </RevealStep>
          <RevealStep n="4" title="מבנה ההוכחה" question="אילו טענות עזר נדרשות כאן, ומה שונה מדוגמה 1?">
            <p><strong>אבחנה:</strong> כל מסלול ב-<M>G′</M> מקודקוד ב-<M>V</M> לקודקוד ב-<M>V</M> זוגי (דו־חלקיות).</p>
            <p><strong>טענת עזר:</strong> לכל <M>s ≠ v</M>, קיים ב-<M>G</M> מסלול <strong>פשוט</strong> באורך <M>m</M> מ-<M>s</M> ל-<M>v</M> אם"ם קיים ב-<M>G′</M> מסלול <strong>פשוט</strong> באורך <M>2m</M>.</p>
            <p><strong>עוד טענה:</strong> מסלול קצר ביותר הוא פשוט (אחרת מקצרים את הקטע שבין שתי ההופעות של הקודקוד החוזר, ומקבלים מסלול קצר יותר).</p>
          </RevealStep>
          <Callout type="intuit" title="שאלה מהתרגול: למה דרשנו מסלולים פשוטים?">
            <RevealInline>
              <p>ב-<M>G′</M> אפשר ללכת <M>u_1 → u_1u_2 → u_1</M>: מסלול באורך 2 שחוזר למקום. ב-<M>G</M> הוא לא מתאים לשום צלע (לא הגענו ל-<M>u_2</M>), ולכן מסלול כללי באורך <M>2m</M> ב-<M>G′</M> עלול להתאים למסלול <em>קצר יותר</em> מ-<M>m</M> ב-<M>G</M>, וכיוון ⇐ נשבר. מסלולים פשוטים לא יכולים "להסתובב" בקודקוד ביניים. וזה מספיק, כי מסלולים קצרים ביותר הם פשוטים.</p>
            </RevealInline>
          </Callout>
          <RevealStep n="5" title="זמן ריצה" question="כמה קודקודים וקשתות יש ב-G′?">
            <p><M>|V′| = |V| + |E|</M>, <M>|E′| = 2|E|</M>. הקופסה ל-SEP רצה בזמן <M>O(|V′| + |E′|) = O(|V| + |E|)</M> (את זה ראינו בדוגמה 1). סה"כ <M>O(|V| + |E|)</M>.</p>
          </RevealStep>
        </div>
        <Callout type="tip" title="שתי רדוקציות = שקילות">
          <p>SEP ← SP ו-SP ← SEP יחד מראות ששתי הבעיות שקולות: כל אחת מהן פתירה בעזרת השנייה בתוספת עבודה ליניארית.</p>
        </Callout>
        <div className="card p-4 flex flex-wrap items-center justify-between gap-3" style={{ background: 'var(--mark-soft)', borderColor: 'var(--mark)' }}>
          <div><strong>בעיות למחשבה מסוף התרגול:</strong> SOP ← SP, ו-SP ← SOP.</div>
          <div className="flex gap-2 flex-wrap"><button className="btn btn-primary text-sm" onClick={() => goLab('e4')}>לתרגיל 4</button><button className="btn text-sm" onClick={() => goLab('e5')}>לתרגיל 5</button></div>
        </div>
      </Section>

      <Section id="coloring" scope="tut" doneKey="coloring" kicker="תגבור 1 · שאלה 1" title="2-צביעה ← 2-SAT">
        <Def tag="הבעיות">
          <p><strong>2-צביעה:</strong> קלט: גרף לא מכוון <M>G = (V, E)</M>. פלט: פונקציה <M>{"c : V → {0,1}"}</M> כך שלכל <M>(u, v) ∈ E</M> מתקיים <M>c(u) ≠ c(v)</M>, או "לא קיימת צביעה".</p>
          <p><strong>2-SAT:</strong> קלט: פסוק CNF שבכל פסוקית בו בדיוק שני ליטרלים, למשל <M>(x_1 ∨ x_2) ∧ (x_4 ∨ ¬x_6)</M>. פלט: השמה מספקת, או "לא קיימת השמה". נתון אלגוריתם בזמן <M>O(n + m)</M> (<M>n</M> משתנים, <M>m</M> פסוקיות).</p>
        </Def>
        <div className="grid gap-5">
          <RevealStep n="1" title="מה מתאים למה?" question="לכל קודקוד יש אחד משני צבעים. מה בעולם של 2-SAT מקבל אחד משני ערכים?">
            <p>משתנה בוליאני <M>x_v</M> לכל <M>v ∈ V</M>. <M>T</M> = אדום, <M>F</M> = כחול.</p>
          </RevealStep>
          <RevealStep n="2" title="לקודד אילוץ של צלע" question="איך אומרים 'u ו-v בצבעים שונים' בעזרת פסוקיות של שני ליטרלים בלבד?">
            <p><M>(x_u ∨ x_v)</M> אוסרת על שניהם להיות <M>F</M>; <M>(¬x_u ∨ ¬x_v)</M> אוסרת על שניהם להיות <M>T</M>. יחד: בדיוק אחד מהם אמת.</p>
          </RevealStep>
          <RevealStep n="3" title="הממירים" question="מה בדיוק מחזירים בכל צד?">
            <p><strong>ממיר קלט:</strong> <M>{"ψ_G = ∧_{(u,v) ∈ E} (x_u ∨ x_v) ∧ (¬x_u ∨ ¬x_v)"}</M>.</p>
            <p><strong>ממיר פלט:</strong> אם חזרה השמה מספקת <M>x</M>, מחזירים <M>c_x(v)</M> = אדום אם <M>x_v = T</M> וכחול אחרת. אם לא, מחזירים "לא קיימת צביעה".</p>
          </RevealStep>
          <RevealStep n="4" title="הטענות" question="בעיית חיפוש: מה בדיוק צריך להוכיח על הפלט?">
            <p><strong>טענה ראשית:</strong> האלגוריתם מחזיר 2-צביעה חוקית של <M>G</M> אם קיימת, ואחרת מחזיר "לא".</p>
            <p><strong>טענת עזר 1:</strong> אם קיימת 2-צביעה של <M>G</M>, אז קיימת השמה מספקת ל-<M>ψ_G</M>.</p>

function buildPrompt(ex, draft, withRef) {
  const F = FIELDS.map(f => `[${f.label}]\n${(draft.fields[f.key] || '').trim() || '(ריק)'}`).join('\n\n');
  const choiceTxt = ex.choices ? 'אפשרויות:\n' + ex.choices.map((c, i) => `${'אבגד'[i]}. ${plain(c)}`).join('\n') + '\n' : '';
  const picked = ex.choices && draft.choice != null ? `התשובה שהסטודנט בחר: ${'אבגד'[draft.choice]}\n` : (ex.choices ? 'הסטודנט לא בחר אפשרות.\n' : '');
  const refBlock = withRef
    ? `# פתרון ייחוס (לשימושך בלבד. אל תעתיק אותו לסטודנט ואל תחשוף את התשובה המלאה)\n${ex.reference}\n\n# נקודות שבודק מחפש\n${ex.rubric.map(r => '- ' + r).join('\n')}`
    : `# חומר עזר\nהשווה לחומר הקורס בפרויקט (מקור השאלה: ${ex.source}). השתמש בהגדרות ובסימונים של ההרצאות והתרגולים.`;
  return `אתה בודק הוכחות מנוסה בקורס האוניברסיטאי "תכנון אלגוריתמים" (נושא: רדוקציות, שבוע 1). הסטודנט מתאמן בכתיבת הוכחות בגישת "מלמעלה למטה" שנלמדה בקורס: ניסוח משפט נכונות, ניסוח טענות עזר, הוכחת המשפט מתוך טענות העזר, הוכחת טענות העזר, ולבסוף ניתוח זמן ריצה. רדוקציה בקורס היא זוג ממירים: ממיר קלט f וממיר פלט g(x, y). הקופסה השחורה רשאית להחזיר כל פתרון חוקי, ואסור להניח עליה שום דבר מלבד נכונות.

# השאלה: ${ex.title}
${plain(ex.statement)}

מה נדרש:
${ex.tasks.map(t => '- ' + plain(t)).join('\n')}
${choiceTxt}
${refBlock}

# תשובת הסטודנט
${picked}${F}

(הסטודנט פתח ${draft.hints || 0} מתוך 3 רמזים.)

# הוראות לבדיקה
כתוב בעברית טבעית וברורה, ופנה לסטודנט בגוף שני. כתוב סימנים מתמטיים ב-Unicode (∀, ∈, ⇔, ≤, s₁) ולא ב-LaTeX. אל תכתוב את הפתרון המלא: כשחסר רעיון מרכזי, הצבע עליו בעזרת שאלה מנחה. היה מדויק: ציין איזו שורה או איזה מעבר לוגי בעייתי ולמה. שדה ריק הוא חוסר שיש לציין. אם הניסוח נכון אבל לא פורמלי מספיק לבחינה, אמור זאת.
השב בדיוק במבנה הזה, עם הכותרות האלה:
## פסק דין
שורה אחת: "נכון ומלא" / "נכון ברובו – חסרים פרטים" / "רעיון נכון, הוכחה חלקית" / "לא נכון בבסיסו", ואחריה "ציון משוער: X/10".
## מה היה טוב בתשובה
2–4 נקודות: צעדים לוגיים נכונים, ניסוח טוב, מבנה נכון.
## מה חסר או שגוי
כל פגם בנקודה נפרדת: פערים לוגיים, כיוון שלא הוכח, מקרי קצה (אין פתרון, ∞), הנחות על הקופסה השחורה, טעויות בסיבוכיות, בעיות ניסוח וסימון.
## טיפים לשיפור
2–4 טיפים מעשיים לכתיבת הוכחה מהסוג הזה בפעם הבאה.
## הצעד הבא
שאלה מנחה אחת שתקדם את הסטודנט מהנקודה שבה הוא נמצא.`;
}

function ReviewView({ text }) {
  const groups = []; let cur = null;
  text.split('\n').forEach(ln => {
    const h = ln.match(/^\s*#{1,4}\s*(.+?)\s*$/);
    if (h) {
      const t = h[1].replace(/\*\*/g, '');
      const tone = /טוב/.test(t) ? 'good' : /חסר|שגוי/.test(t) ? 'bad' : /טיפ/.test(t) ? 'tip' : /פסק/.test(t) ? 'verdict' : /הבא/.test(t) ? 'next' : '';
      cur = { title: t, tone, lines: [] }; groups.push(cur); return;
    }
    if (!cur) { cur = { title: '', tone: '', lines: [] }; groups.push(cur); }
    cur.lines.push(ln);
  });
  const renderLines = (lines, gk) => {
    const out = []; let list = null;
    const flush = () => { if (list) { out.push(<ul key={gk + 'u' + out.length}>{list}</ul>); list = null; } };
    lines.forEach((ln, i) => {
      const li = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
      if (li) { (list = list || []).push(<li key={i}>{inline(li[1], gk + 'li' + i)}</li>); return; }
      if (!ln.trim()) { flush(); return; }
      flush(); out.push(<p key={i}>{inline(ln, gk + 'p' + i)}</p>);
    });
    flush(); return out;
  };
  return (
    <div className="grid gap-2.5">
      {groups.filter(g => g.title || g.lines.some(l => l.trim())).map((g, i) => (
        <div key={i} className={'review-block ' + (g.tone ? 'rv-' + g.tone : '')}>
          {g.title && <h4>{g.title}</h4>}
          <div className="prose-he text-[0.96rem]">{renderLines(g.lines, 'g' + i)}</div>
        </div>
      ))}
    </div>
  );
}
const scoreOf = t => { const m = (t || '').match(/ציון משוער[^0-9]*(\d+(?:\.\d+)?)\s*\/\s*10/); return m ? Number(m[1]) : null; };

function Workspace({ ex }) {
  const { ai, setAiBlocked, progress, setEx } = useApp();
  const [draft, setDraft] = usePersist('draft:' + ex.id, { fields: {}, hints: 0, choice: null });
  const [review, setReview] = usePersist('review:' + ex.id, null);
  const [live, setLive] = useState(null); // {phase, text, err}
  const [elapsed, setElapsed] = useState(0);
  const [copyState, setCopyState] = useState(null);
  const [fallback, setFallback] = useState(null);
  const ctlRef = useRef(null);
  const focusRef = useRef('main');
  const refs = useRef({});

  const setField = (k, v) => {
    setDraft(d => ({ ...d, fields: { ...d.fields, [k]: v } }));
    if ((progress.ex[ex.id] || {}).status !== 'reviewed') setEx(ex.id, { status: 'working' });
  };
  const setOpened = n => { setDraft(d => ({ ...d, hints: n })); setEx(ex.id, { hints: n }); };
  const insert = sym => {
    const k = focusRef.current; const el = refs.current[k]; if (!el) return;
    const v = draft.fields[k] || ''; const s = el.selectionStart ?? v.length, e = el.selectionEnd ?? v.length;
    const nv = v.slice(0, s) + sym + v.slice(e); setField(k, nv);
    requestAnimationFrame(() => { el.focus(); el.selectionStart = el.selectionEnd = s + sym.length; });
  };
  const filled = FIELDS.filter(f => (draft.fields[f.key] || '').trim()).length;
  const words = FIELDS.reduce((a, f) => a + ((draft.fields[f.key] || '').trim().split(/\s+/).filter(Boolean).length), 0);

  useEffect(() => {
    if (!live || live.phase !== 'thinking') return;
    const t0 = Date.now(); const t = setInterval(() => setElapsed(Math.floor((Date.now() - t0) / 1000)), 500);
    return () => clearInterval(t);

      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) {

      }

                  <span className="font-mono text-xs px-1.5 py-0.5 rounded" style={{ background: 'var(--ink)', color: 'var(--surface)' }}>{String(i + 1).padStart(2, '0')}</span>

            ))}
          </div>

          <div className="mt-5 grid gap-2">
            <div className="text-sm c-muted">לפני שליחה, עברו על הרשימה: שני כיווני טענות העזר · מקרה "אין פתרון" או ∞ · שום הנחה על הקופסה השחורה מלבד נכונות · זמן הקופסה לפי |f(x)|.</div>

              {ai.status === 'loading' && 'בודקים אם אפשר להריץ בדיקה בתוך הדף…'}

      {(live || review) && (

          <div className="mt-3">

}

function LabTab({ exId, setExId }) {

  const done = EXERCISES.filter(e => (progress.ex[e.id] || {}).status === 'reviewed').length;

    <div className="grid gap-8">
      <div className="term lift">
        <div className="term-bar"><span className="dot" style={{ background: '#E5605A' }} /><span className="dot" style={{ background: '#E9B53C' }} /><span className="dot" style={{ background: '#4FB873' }} /><bdi dir="ltr" className="ms-2">~/algo/week01/proof-lab</bdi></div>
        <div className="p-5 sm:p-7 grid gap-4">
          <div>
            <div className="font-mono text-sm" style={{ color: 'var(--mark)' }}><bdi dir="ltr">$ prove --topic reductions</bdi></div>

            <p className="mt-2 max-w-[62ch]" style={{ color: 'var(--term-dim)' }}>קודם השיטה, אחר כך התרגול. כל תרגיל: שלושה רמזים מדורגים, ארבעה שדות שבונים בהם את ההוכחה שלב אחר שלב, ובודק שמסביר מה עבד, מה חסר, ואיך כותבים את זה טוב יותר בפעם הבאה.</p>
          </div>

            {[[`${done}/${EXERCISES.length}`, 'תרגילים שנבדקו'], [hints, 'רמזים שנפתחו'], [METHOD_STEPS.length, 'שלבים בשיטה']].map(([v, l], i) => (
              <div key={i}><div className="font-mono text-2xl font-bold" style={{ color: 'var(--term-ink)' }}><bdi dir="ltr">{v}</bdi></div><div className="text-xs" style={{ color: 'var(--term-dim)' }}>{l}</div></div>

      <section className="grid gap-4">

          <p className="mt-1 c-muted max-w-[65ch]">שמונה שלבים, ולכל אחד שאלה שאפשר לשאול את עצמכם כשנתקעים. הדוגמאות לקוחות מ-SEP ← SP מתרגול 1.</p></div>
        <MethodTimeline />
      </section>

      <section className="grid gap-4">
        <div><div className="kicker">חלק ב · תבניות</div><h2 className="font-display text-2xl mt-1">איך מנסחים את משפט הנכונות, לפי סוג הבעיה</h2></div>
        <TemplateSwitch />
      </section>

      <section className="grid gap-4">
        <div><div className="kicker">חלק ג · חימום</div><h2 className="font-display text-2xl mt-1">שלד התשובה</h2></div>
        <OrderGame />
      </section>

      <section className="grid gap-4">
        <div><div className="kicker">חלק ד · לפני ההגשה</div><h2 className="font-display text-2xl mt-1">דגלים אדומים</h2>
          <p className="mt-1 c-muted">הטעויות שהכי מורידות נקודות בשאלות רדוקציה. הבודק מחפש בדיוק אותן.</p></div>
        <div className="grid sm:grid-cols-2 gap-3">
          {PITFALLS.map(([t, d], i) => (

          ))}
        </div>
      </section>

      <section className="grid gap-4">
        <div><div className="kicker">חלק ה · תרגול</div><h2 className="font-display text-2xl mt-1">תרגילים</h2>
          <p className="mt-1 c-muted">מסודרים מהשלמת הוכחות מההרצאה, דרך שאלות התרגול והתגבור, ועד שאלות ממבחני עבר.</p></div>
        <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-3">
          {EXERCISES.map(e => {
            const st = progress.ex[e.id] || {}; const lvl = LEVELS[e.level]; const sel = e.id === ex.id;
            return (
              <button key={e.id} onClick={() => pick(e.id)} className="card p-3.5 text-start flex flex-col gap-1.5 transition-shadow" style={{ borderColor: sel ? 'var(--accent)' : 'var(--line)', boxShadow: sel ? '0 0 0 3px var(--accent-soft)' : 'none' }}>
                <div className="flex items-center justify-between gap-2">
                  <span className="font-mono text-xs c-muted">תרגיל {e.num}</span>
                  <span className="text-xs font-semibold flex items-center gap-1"><span className="inline-block w-2 h-2 rounded-full" style={{ background: lvl[1] }} />{lvl[0]}</span>
                </div>
                <div className="font-semibold leading-snug">{e.title}</div>
                <div className="text-xs c-muted">{e.source}</div>
                <div className="mt-auto pt-1 text-xs flex items-center gap-2">
                  {st.status === 'reviewed' ? <span className="c-tip font-semibold flex items-center gap-1">{Ico.check} נבדק{st.score != null ? ` · ${st.score}/10` : ''}</span>
                    : st.status === 'working' ? <span className="c-mark font-semibold">בעבודה</span> : <span className="c-muted">לא התחלתם</span>}
                  {st.hints ? <span className="c-muted">· {st.hints} רמזים</span> : null}

            );
          })}
        </div>
        <div ref={wsRef} data-workspace className="scroll-mt-28"><Workspace key={ex.id} ex={ex} /></div>

  );
}

  const total = LEC_SECTIONS.length + TUT_SECTIONS.length + EXERCISES.length;
  const done = Object.values(progress.lec).filter(Boolean).length + Object.values(progress.tut).filter(Boolean).length + EXERCISES.filter(e => (progress.ex[e.id] || {}).status === 'reviewed').length;
  const pct = Math.round(100 * done / total);
  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-start justify-between gap-2">
        <div>
          <div className="kicker">202-1-2041</div>
          <div className="font-display text-xl leading-tight mt-0.5">תכנון אלגוריתמים</div>
          <div className="text-sm c-muted">מפת הסמסטר</div>
        </div>
        {onClose && <button className="btn btn-ghost !p-2" onClick={onClose} aria-label="סגור">{Ico.x}</button>}
      </div>
      <div>
        <div className="flex justify-between text-sm"><span className="c-muted">התקדמות בשבוע 1</span><span className="font-mono"><bdi dir="ltr">{pct}%</bdi></span></div>
        <div className="progress-track mt-1"><div className="progress-fill" style={{ width: pct + '%' }} /></div>
      </div>
      <ol className="grid gap-1 list-none p-0">
        {WEEKS.map(w => (
          <li key={w.n}>
            <div className={'rail-week rounded-xl border px-3 py-2 ' + (w.active ? '' : 'opacity-60')} aria-current={w.active ? 'true' : 'false'} style={{ borderColor: w.active ? 'var(--line)' : 'transparent' }}>
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs w-6 text-center rounded" style={w.active ? { background: 'var(--accent)', color: 'var(--accent-ink)' } : { background: 'var(--sunken)', color: 'var(--muted)' }}>{String(w.n).padStart(2, '0')}</span>
                <span className={'text-[0.93rem] leading-snug ' + (w.active ? 'font-semibold' : '')}>{w.title}</span>
                {!w.active && <span className="ms-auto c-muted" title="בקרוב">{Ico.lock}</span>}

      <div className="text-xs c-muted leading-relaxed">שבוע 1 בנוי במלואו. שמות הנושאים של שאר השבועות הם תוכנית משוערת לפי מבחני העבר, ויתעדכנו כשיעלו ההרצאות.</div>
    </div>
  );
}

const TABS = [
  { k: 'lecture', label: 'הרצאה', sub: 'הבנת החומר' },
  { k: 'tutorial', label: 'תרגול', sub: 'דרכי פתרון' },
  { k: 'lab', label: 'מעבדת הוכחות', sub: 'ותרגול', star: true },
];

function ThemeToggle() {
  const sysDark = () => { try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; } };
  const [theme, setTheme] = useState(() => store.get('theme', null) || (document.documentElement.getAttribute('data-theme')) || (sysDark() ? 'dark' : 'light'));
  const [explicit, setExplicit] = useState(() => !!store.get('theme', null));
  useEffect(() => {
    if (explicit) { document.documentElement.setAttribute('data-theme', theme); store.set('theme', theme); }
  }, [theme, explicit]);
  useEffect(() => {
    if (explicit) return;
    let mq; try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
    const h = () => setTheme(document.documentElement.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'));
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, [explicit]);
  const flip = () => { setExplicit(true); setTheme(t => (t === 'dark' ? 'light' : 'dark')); };
  const dark = theme === 'dark';
  return (
    <button className="theme-switch" dir="ltr" data-theme-now={theme} onClick={flip} role="switch" aria-checked={dark} aria-label={dark ? 'מעבר למצב בהיר' : 'מעבר למצב כהה'} title={dark ? 'מצב בהיר' : 'מצב כהה'}>
      <span className="knob" />
      <span className="opt" data-on={!dark}>{Ico.sun}</span>
      <span className="opt" data-on={dark}>{Ico.moon}</span>
    </button>
  );
}

function App() {
  const initialTab = (() => { const h = (location.hash || '').slice(1); return TABS.some(t => t.k === h) ? h : 'lecture'; })();
  const [tab, setTab] = useState(initialTab);
  const [exId, setExId] = usePersist('exId', 'e1');
  const [drawer, setDrawer] = useState(false);
  const [progress, setProgress] = usePersist('progress', { lec: {}, tut: {}, ex: {} });
  const [ai, setAi] = useState({ status: 'loading', fn: null });

  useEffect(() => {
    let alive = true; const c = window.claude;
    if (!c || typeof c.use !== 'function') { setAi({ status: 'off', fn: null }); return; }
    c.use('sample').then(fn => { if (alive) setAi(fn ? { status: 'on', fn } : { status: 'off', fn: null }); }).catch(() => { if (alive) setAi({ status: 'off', fn: null }); });
    return () => { alive = false; };
  }, []);

  const ctx = {
    progress, ai,
    setAiBlocked: () => setAi({ status: 'blocked', fn: null }),
    setDone: (scope, k, v) => setProgress(p => ({ ...p, [scope]: { ...p[scope], [k]: v } })),
    setEx: (id, patch) => setProgress(p => ({ ...p, ex: { ...p.ex, [id]: { ...(p.ex[id] || {}), ...patch } } })),
  };
  const go = k => { setTab(k); try { history.replaceState(null, '', '#' + k); } catch (e) {} window.scrollTo({ top: 0 }); };
  const goLab = id => { setExId(id); setTab('lab'); try { history.replaceState(null, '', '#lab'); } catch (e) {} setTimeout(() => { const el = document.querySelector('[data-workspace]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); };

  return (
    <Ctx.Provider value={ctx}>
      <div dir="rtl" className="max-w-[1320px] mx-auto py-4 sm:py-6 lg:flex lg:gap-7">
        <aside className="hidden lg:block w-[272px] shrink-0">
          <div className="sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 24px)' }}><Rail /></div>
        </aside>

        {drawer && (
          <div className="fixed inset-0 z-50 lg:hidden" role="dialog" aria-modal="true">
            <div className="absolute inset-0" style={{ background: 'rgba(8,12,20,.45)' }} onClick={() => setDrawer(false)} />
            <div className="absolute top-0 bottom-0 right-0 w-[86%] max-w-[330px] overflow-y-auto p-4" style={{ background: 'var(--bg)', paddingTop: 'calc(env(safe-area-inset-top, 0px) + 16px)', paddingRight: 'max(16px, env(safe-area-inset-right, 0px))', paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 16px)' }}>
              <Rail onClose={() => setDrawer(false)} />
            </div>
          </div>
        )}

        <main className="flex-1 min0">
          <header className="grid gap-4">
            <div className="flex items-center gap-3">
              <button className="btn lg:hidden !p-2" onClick={() => setDrawer(true)} aria-label="מפת הסמסטר">{Ico.menu}</button>
              <div className="kicker min0">שבוע 01 · הרצאה 1 (18.10.2026) · תרגול 1 · תגבור 1</div>
              <div className="ms-auto flex items-center gap-2"><span className="hidden sm:inline text-sm c-muted">ערכת צבעים</span><ThemeToggle /></div>
            </div>
            <div>
              <h1 className="font-display text-[2rem] sm:text-[2.6rem] leading-[1.1]">מבוא ורדוקציות</h1>
              <p className="mt-2 c-muted max-w-[62ch]">איך פותרים בעיה חדשה בעזרת אלגוריתם שכבר קיים, ואיך מוכיחים שזה עובד, <span className="hl" style={{ color: 'var(--ink)' }}>לכל קלט</span>.</p>
            </div>
          </header>
          <div className="sticky z-40 mt-5 mb-6 py-2" style={{ top: 'env(safe-area-inset-top, 0px)', background: 'var(--bg)' }}>
            <div className="tabbar" role="tablist">
              {TABS.map((t, i) => (
                <button key={t.k} role="tab" aria-selected={tab === t.k} className="tab" onClick={() => go(t.k)}>
                  <span className="font-mono text-xs c-muted">{i + 1}</span>{t.label}<span className="hidden sm:inline font-normal c-muted text-sm">· {t.sub}</span>{t.star && <span className="star">★</span>}
                </button>
              ))}
            </div>
          </div>
                    {tab === 'lecture' && <LectureTab goLab={goLab} goTab={go} />}
          {tab === 'tutorial' && <TutorialTab goLab={goLab} goTab={go} />}
          {tab === 'lab' && <LabTab exId={exId} setExId={setExId} />}
          <footer className="mt-10 mb-6 text-sm c-muted text-center">החומר מבוסס על הרצאה 1, תרגול 1, תגבור 1 ומבחני העבר בפרויקט. טיוטות והתקדמות נשמרות רק בדפדפן הזה.</footer>
        </main>
      </div>
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
